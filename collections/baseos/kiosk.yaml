---
playbooks:
  - name: kiosk
    play: |
      ---
      # Edge box: role detection (tt|kiosk) + Firefox kiosk on tty1
      #   ansible-playbook -i inventory sthings.baseos.kiosk -e target_host=edge \
      #     -e kiosk_url=https://<start-page>
      # Several pages, one tab each, switching to the next tab every 30s:
      #   ansible-playbook -i inventory sthings.baseos.kiosk -e target_host=edge \
      #     -e kiosk_urls=https://<page-1>,https://<page-2> -e kiosk_rotate_seconds=30
      # ... and hold the current tab while someone uses keyboard/mouse (here: 60s):
      #     -e kiosk_rotate_pause_seconds=60
      # ... back to the start URLs after 5 min without use, and a zoom per tab:
      #     -e kiosk_reset_idle_seconds=300 -e kiosk_tab_zoom=100,80,120
      # Private CAs Firefox must trust (PEM files on the controller):
      #     -e kiosk_ca_certs=/path/ca-1.crt,/path/ca-2.crt
      # Gateways per role can be overridden via -e '{"edge_role_gateways": {...}}'
      - name: Edge box - role detection and kiosk browser
        hosts: "{{ target_host | default('all') }}"
        become: true

        vars:
          kiosk_url: ""
          kiosk_urls: []                # one tab per URL (list or comma separated), wins over kiosk_url
          kiosk_rotate_seconds: 0       # > 0: switch to the next tab every N seconds (xdotool ctrl+Tab)
          kiosk_rotate_pause_seconds: 0 # > 0: no switch while keyboard/mouse were used in the last N seconds
          kiosk_reset_idle_seconds: 0   # > 0: N seconds after the last use, restart Firefox -> all tabs on their start URL
          kiosk_tab_zoom: []            # zoom per tab in percent, same order as the tabs (list or comma separated; missing = 100)
          kiosk_tab_zoom_delay_seconds: 8   # wait for the pages before zooming
          kiosk_tab_zoom_list: "{{ (kiosk_tab_zoom.split(',') if kiosk_tab_zoom is string else kiosk_tab_zoom) | map('string') | map('trim') | select | map('int') | list }}"
          kiosk_input_watch: "{{ (kiosk_rotate_seconds | int > 0 and kiosk_rotate_pause_seconds | int > 0) or kiosk_reset_idle_seconds | int > 0 }}"
          kiosk_tabs: "{{ (kiosk_urls.split(',') if kiosk_urls is string else kiosk_urls) | map('trim') | select | list if kiosk_urls | length > 0 else ([kiosk_url] if kiosk_url | length > 0 else []) }}"
          kiosk_ca_certs: []            # PEM CA files on the controller (list or comma separated)
          kiosk_ca_dir: /usr/local/share/ca-certificates/kiosk
          kiosk_ca_list: "{{ (kiosk_ca_certs.split(',') if kiosk_ca_certs is string else kiosk_ca_certs) | map('trim') | select | list }}"
          kiosk_ca_paths: "{{ kiosk_ca_list | map('basename') | map('regex_replace', '\\.(crt|pem)$', '') | map('regex_replace', '^(.*)$', kiosk_ca_dir ~ '/\\1.crt') | list }}"
          kiosk_user: kiosk
          edge_role_default: auto       # only written if /etc/edge-role does not exist yet
          edge_role_wait_seconds: 30    # tty1: max. wait for a default route before deciding the role
          edge_role_gateways:
            tt: 192.168.8.1
            kiosk: 192.168.10.1
          kiosk_firefox_policies:
            policies:
              DisableAppUpdate: true
              DisableTelemetry: true
              DisableFirefoxStudies: true
              DisablePocket: true
              DontCheckDefaultBrowser: true
              NoDefaultBookmarks: true
              OverrideFirstRunPage: ""
              OverridePostUpdatePage: ""
              Preferences:
                browser.sessionstore.resume_from_crash:
                  Value: false
                  Status: locked
                browser.ctrlTab.sortByRecentlyUsed:   # ctrl+Tab (rotation) goes strictly left to right
                  Value: false
                  Status: locked

        pre_tasks:
          - name: kiosk_url or kiosk_urls must be set
            ansible.builtin.assert:
              that:
                - kiosk_tabs | length > 0
                - kiosk_rotate_seconds | int >= 0
              fail_msg: "Please set -e kiosk_url=https://... or -e kiosk_urls=https://...,https://... (kiosk_rotate_seconds >= 0)"

        tasks:
          # ------------------------------------------------------------------
          # Role detection
          # ------------------------------------------------------------------
          - name: edge-role script
            ansible.builtin.copy:
              dest: /usr/local/bin/edge-role
              mode: "0755"
              content: |
                #!/bin/sh
                # Usage: edge-role show | edge-role is <role>
                # Override: /etc/edge-role (auto|tt|kiosk|none)
                role=$(cat /etc/edge-role 2>/dev/null)
                if [ -z "$role" ] || [ "$role" = "auto" ]; then
                  role=none
                  route=$(ip route show default)
                {% for name, gateway in edge_role_gateways.items() %}
                  case "$route" in *"via {{ gateway }} "*) role={{ name }} ;; esac
                {% endfor %}
                fi
                case "$1" in
                  show) echo "$role" ;;
                  is)   [ "$role" = "$2" ] ;;
                  *)    echo "usage: edge-role show | edge-role is <role>" >&2; exit 2 ;;
                esac

          - name: Create /etc/edge-role (keep an existing override)
            ansible.builtin.copy:
              dest: /etc/edge-role
              content: "{{ edge_role_default }}\n"
              mode: "0644"
              force: false

          - name: Drop-in directory for k3s
            ansible.builtin.file:
              path: /etc/systemd/system/k3s.service.d
              state: directory
              mode: "0755"

          - name: Start k3s only in role "tt"
            ansible.builtin.copy:
              dest: /etc/systemd/system/k3s.service.d/edge-role.conf
              mode: "0644"
              content: |
                [Service]
                ExecCondition=/usr/local/bin/edge-role is tt
            notify: Reload systemd

          # ------------------------------------------------------------------
          # Packages + kiosk user
          # ------------------------------------------------------------------
          - name: Install cage, Mesa and Xwayland
            ansible.builtin.apt:
              name: [cage, mesa-utils, xwayland]
              state: present
              update_cache: true

          - name: Install xdotool (tab rotation)
            ansible.builtin.apt:
              name: xdotool
              state: present
            when: kiosk_rotate_seconds | int > 0

          - name: Install xdotool (per-tab zoom)
            ansible.builtin.apt:
              name: xdotool
              state: present
            when: kiosk_tab_zoom_list | length > 0 or kiosk_reset_idle_seconds | int > 0

          - name: Install xinput (rotation pause / reset on keyboard/mouse input)
            ansible.builtin.apt:
              name: xinput
              state: present
            when: kiosk_input_watch | bool

          - name: Kiosk user
            ansible.builtin.user:
              name: "{{ kiosk_user }}"
              shell: /bin/bash
              password_lock: true
              groups: [video, render]
              append: true
              create_home: true

          # ------------------------------------------------------------------
          # Firefox as .deb from the Mozilla repo (instead of snap)
          # ------------------------------------------------------------------
          - name: Keyring directory
            ansible.builtin.file:
              path: /etc/apt/keyrings
              state: directory
              mode: "0755"

          - name: Mozilla signing key
            ansible.builtin.get_url:
              url: https://packages.mozilla.org/apt/repo-signing-key.gpg
              dest: /etc/apt/keyrings/packages.mozilla.org.asc
              mode: "0644"

          - name: Mozilla APT source
            ansible.builtin.copy:
              dest: /etc/apt/sources.list.d/mozilla.sources
              mode: "0644"
              content: |
                Types: deb
                URIs: https://packages.mozilla.org/apt
                Suites: mozilla
                Components: main
                Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc

          - name: Prefer Mozilla packages (otherwise Ubuntu pulls the snap transitional package)
            ansible.builtin.copy:
              dest: /etc/apt/preferences.d/mozilla
              mode: "0644"
              content: |
                Package: *
                Pin: origin packages.mozilla.org
                Pin-Priority: 1000

          - name: Check whether Firefox is installed as a snap
            ansible.builtin.command: snap list firefox
            register: firefox_snap
            changed_when: false
            failed_when: false

          - name: Remove snap Firefox
            ansible.builtin.command: snap remove firefox
            when: firefox_snap.rc == 0

          - name: Install Firefox (.deb)
            ansible.builtin.apt:
              name: firefox
              state: present
              update_cache: true

          - name: Policy directory
            ansible.builtin.file:
              path: /etc/firefox/policies
              state: directory
              mode: "0755"

          # Firefox on Linux does not read the system trust store; it installs
          # the CAs from policies.json (Certificates.Install, absolute paths).
          # The same files go into the system store for curl & co.
          - name: CA directory
            ansible.builtin.file:
              path: "{{ kiosk_ca_dir }}"
              state: directory
              mode: "0755"

          - name: Private CAs (kiosk_ca_certs)
            ansible.builtin.copy:
              src: "{{ item.0 }}"
              dest: "{{ item.1 }}"
              mode: "0644"
            loop: "{{ kiosk_ca_list | zip(kiosk_ca_paths) | list }}"
            notify: Update CA certificates

          - name: Find CAs no longer listed
            ansible.builtin.find:
              paths: "{{ kiosk_ca_dir }}"
              patterns: "*.crt"
            register: kiosk_ca_found

          - name: Remove CAs no longer listed
            ansible.builtin.file:
              path: "{{ item.path }}"
              state: absent
            loop: "{{ kiosk_ca_found.files | rejectattr('path', 'in', kiosk_ca_paths) | list }}"
            notify: Update CA certificates

          - name: Firefox policies (no updates, no session restore, no first-run pages, private CAs)
            ansible.builtin.copy:
              dest: /etc/firefox/policies/policies.json
              mode: "0644"
              content: "{{ (kiosk_firefox_policies | combine({'policies': {'Certificates': {'Install': kiosk_ca_paths}}}, recursive=True) if kiosk_ca_paths | length > 0 else kiosk_firefox_policies) | to_nice_json }}\n"
            notify: Restart getty tty1   # a running kiosk Firefox reads policies only at start

          # ------------------------------------------------------------------
          # Cleanup: earlier kiosk.service approach
          # ------------------------------------------------------------------
          - name: Check for old kiosk.service
            ansible.builtin.stat:
              path: /etc/systemd/system/kiosk.service
            register: old_kiosk_unit

          - name: Stop and disable old kiosk.service
            ansible.builtin.systemd_service:
              name: kiosk.service
              state: stopped
              enabled: false
            when: old_kiosk_unit.stat.exists

          - name: Remove old kiosk.service and its drop-ins
            ansible.builtin.file:
              path: "{{ item }}"
              state: absent
            loop:
              - /etc/systemd/system/kiosk.service
              - /etc/systemd/system/kiosk.service.d
            notify: Reload systemd

          # ------------------------------------------------------------------
          # Kiosk start via tty1 autologin
          # ------------------------------------------------------------------
          - name: tty1 getty wrapper (autologin only in role kiosk)
            ansible.builtin.copy:
              dest: /usr/local/bin/tty1-getty
              mode: "0755"
              content: |
                #!/bin/sh
                # Called by getty@tty1 on every (re)spawn, so the role is re-evaluated each time.
                # At boot getty starts before DHCP: in auto mode wait (max. {{ edge_role_wait_seconds }}s) for a default route.
                mode=$(cat /etc/edge-role 2>/dev/null)
                if [ -z "$mode" ] || [ "$mode" = "auto" ]; then
                  i=0
                  while [ -z "$(ip route show default)" ] && [ "$i" -lt {{ edge_role_wait_seconds }} ]; do
                    sleep 1; i=$((i + 1))
                  done
                fi
                if /usr/local/bin/edge-role is kiosk; then
                  exec /sbin/agetty --autologin {{ kiosk_user }} --noclear "$1" "$TERM"
                else
                  exec /sbin/agetty -o '-p -- \u' --noclear "$1" "$TERM"
                fi

          - name: Drop-in directory for getty@tty1
            ansible.builtin.file:
              path: /etc/systemd/system/getty@tty1.service.d
              state: directory
              mode: "0755"

          - name: getty@tty1 uses the wrapper
            ansible.builtin.copy:
              dest: /etc/systemd/system/getty@tty1.service.d/kiosk.conf
              mode: "0644"
              content: |
                [Service]
                ExecStart=
                ExecStart=-/usr/local/bin/tty1-getty %I
            notify: Restart getty tty1

          - name: Kiosk session (Firefox, one tab per URL, optional tab rotation, zoom, reset)
            ansible.builtin.copy:
              dest: /usr/local/bin/kiosk-session
              mode: "0755"
              content: |
                #!/bin/sh
                # Managed by Ansible (kiosk.yaml). Runs inside cage; the session ends when Firefox exits.
                /usr/bin/firefox --kiosk {{ kiosk_tabs | map('quote') | join(' ') }} &
                firefox=$!
                {% if kiosk_input_watch | bool %}
                # Last keyboard/mouse input (epoch seconds, 0 = none since the start). xinput reads
                # the raw XI2 events ("device: <master> (<source>)"); the XTEST devices are left out,
                # they carry our own xdotool keys. xprintidle does not work: Xwayland has no screen
                # saver extension.
                last_input="${XDG_RUNTIME_DIR:-/tmp}/kiosk-last-input"
                echo 0 > "$last_input"
                (
                  sleep 3   # Xwayland is up once Firefox started
                  xtest=" $(xinput list --id-only 'Virtual core XTEST pointer' 2>/dev/null) $(xinput list --id-only 'Virtual core XTEST keyboard' 2>/dev/null) "
                  prev=0
                  stdbuf -oL xinput test-xi2 --root 2>/dev/null | while read -r k v rest; do
                    case "$k" in
                      EVENT) case "$rest" in *Raw*) raw=1 ;; *) raw=0 ;; esac ;;
                      device:)
                        if [ "${raw:-0}" = 1 ]; then
                          src=${rest#(}; src=${src%)}
                          case "$xtest" in
                            *" $src "*) ;;
                            *) now=$(date +%s); [ "$now" != "$prev" ] && echo "$now" > "$last_input" && prev=$now ;;
                          esac
                          raw=0
                        fi ;;
                    esac
                  done
                ) &
                {% endif %}
                {% set zoom_levels = [20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200, 220, 240, 260, 280, 300, 400, 500] %}
                {% set do_zoom = kiosk_tab_zoom_list | length > 0 or kiosk_reset_idle_seconds | int > 0 %}
                {% if do_zoom or kiosk_rotate_seconds | int > 0 %}
                # Firefox runs via Xwayland, so xdotool (XTEST) reaches it without a Wayland protocol
                (
                {% if do_zoom %}
                  # Zoom per tab. Firefox keeps zoom per site in the profile, so every start sets it
                  # again: Ctrl+0, then Ctrl+= / Ctrl+- to the nearest of Firefox's zoom steps
                  # (toolkit.zoomManager.zoomValues, Firefox 157: {{ zoom_levels | join(' ') }}),
                  # then on to the next tab.
                  sleep {{ kiosk_tab_zoom_delay_seconds | int }}
                {% for url in kiosk_tabs %}
                {% set want = kiosk_tab_zoom_list[loop.index0] | default(100) | int %}
                {% set ns = namespace(best=8, dist=100000) %}
                {% for level in zoom_levels %}
                {% if (level - want) | abs < ns.dist %}{% set ns.best = loop.index0 %}{% set ns.dist = (level - want) | abs %}{% endif %}
                {% endfor %}
                {% set steps = ns.best - 8 %}
                  xdotool key --clearmodifiers ctrl+0{% for i in range(steps if steps > 0 else 0) %} ctrl+equal{% endfor %}{% for i in range(-steps if steps < 0 else 0) %} ctrl+minus{% endfor %}   # {{ url }}: {{ zoom_levels[ns.best] }} %
                  xdotool key --clearmodifiers ctrl+Tab
                {% endfor %}
                {% endif %}
                {% if kiosk_rotate_seconds | int > 0 %}
                  sleep {{ kiosk_rotate_seconds | int }}
                  while kill -0 "$firefox" 2>/dev/null; do
                {% if kiosk_rotate_pause_seconds | int > 0 %}
                    # hold the tab while someone uses keyboard/mouse
                    if [ $(( $(date +%s) - $(cat "$last_input" 2>/dev/null || echo 0) )) -ge {{ kiosk_rotate_pause_seconds | int }} ]; then
                      xdotool key --clearmodifiers ctrl+Tab
                    fi
                {% else %}
                    xdotool key --clearmodifiers ctrl+Tab
                {% endif %}
                    sleep {{ kiosk_rotate_seconds | int }}
                  done
                {% endif %}
                ) &
                {% endif %}
                {% if kiosk_reset_idle_seconds | int > 0 %}
                # Back to the start URLs: once someone used the kiosk and then left it alone for
                # {{ kiosk_reset_idle_seconds | int }}s, end Firefox. The session ends, getty logs in again and
                # the kiosk starts fresh (tabs, history, scroll position, zoom).
                (
                  while kill -0 "$firefox" 2>/dev/null; do
                    sleep 15
                    li=$(cat "$last_input" 2>/dev/null || echo 0)
                    if [ "$li" -gt 0 ] && [ $(( $(date +%s) - li )) -ge {{ kiosk_reset_idle_seconds | int }} ]; then
                      kill "$firefox"
                    fi
                  done
                ) &
                {% endif %}
                wait "$firefox"
            notify: Restart getty tty1   # a running kiosk keeps the old session script otherwise

          - name: Kiosk login starts cage + Firefox (logs to journal, tag "kiosk")
            ansible.builtin.copy:
              dest: "/home/{{ kiosk_user }}/.bash_profile"
              owner: "{{ kiosk_user }}"
              group: "{{ kiosk_user }}"
              mode: "0644"
              content: |
                # Managed by Ansible (kiosk.yaml)
                # MOZ_ENABLE_WAYLAND=0: Firefox runs via Xwayland. Native Wayland triggers an
                # assertion in cage 0.2.1 (wlr_xdg_surface_schedule_configure: surface->initialized).
                if [ "$(tty)" = "/dev/tty1" ] && /usr/local/bin/edge-role is kiosk; then
                  exec env MOZ_ENABLE_WAYLAND=0 systemd-cat -t kiosk /usr/bin/cage -s -- /usr/local/bin/kiosk-session
                fi

        handlers:
          - name: Update CA certificates
            ansible.builtin.command: update-ca-certificates
            changed_when: true

          - name: Reload systemd
            ansible.builtin.systemd_service:
              daemon_reload: true

          - name: Restart getty tty1
            ansible.builtin.systemd_service:
              name: getty@tty1.service
              state: restarted
              daemon_reload: true
