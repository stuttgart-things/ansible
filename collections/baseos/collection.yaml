    - src: https://github.com/stuttgart-things/manage-filesystem.git
      scm: git
      version: 2026.13.04
    - src: https://github.com/stuttgart-things/install-configure-vault.git
      scm: git
      # 2026.09.01 -- install-ca-auth now derives the CA FILENAME from the Vault
      # instance instead of `999 | random`:
      #
      #   https://vault.infra.sthings.lab -> vault-ca-vault-infra-sthings-lab.crt
      #
      # Why the bump matters here specifically: sthings.baseos.setup probes
      # `vault_instances` and installs the CA from every reachable one, in a
      # LOOP. With random names that loop was write-only -- every run added
      # another copy of the same CA, and removing an instance from the list left
      # its CA trusted forever under a name nobody could identify. Trust could be
      # added and never retired.
      #
      # That is precisely the last step of the harvester lab's move off
      # vault.infra.sthings.lab onto the OpenBao on platform: add the new
      # instance, let both CAs be trusted, move issuance, then DROP THE OLD ONE.
      # The drop is what did not work before.
      #
      # `vault_ca_cleanup_legacy: true` (opt-in, default false) clears the
      # vault-ca-<digits>.crt files the old versions left behind. Not set
      # anywhere yet -- it removes trust, so it wants a deliberate run.
      version: 2026.09.01
    - src: https://github.com/stuttgart-things/create-send-webhook.git
      scm: git
      version: 2024.09.06
    - src: https://github.com/stuttgart-things/install-configure-docker.git
      scm: git
      version: 2026.07.19
    # PINNED BY COMMIT, not by a dated tag like its siblings: the role repo has
    # never been tagged, and its main branch has not moved since 2023-05-10.
    # A SHA is at least as reproducible; swap it for a tag once the repo has one.
    - src: https://github.com/stuttgart-things/install-configure-powerdns.git
      scm: git
      version: 6c4267160f4cd6f5a678d84034655ca05c395c92
