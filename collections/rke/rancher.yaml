---
playbooks:
  - name: rancher_register
    play: | #pragma: allowlist secret
      ---
      # JOINS A HOST TO AN EXISTING RANCHER CUSTOM CLUSTER
      # (provisioning.cattle.io/v1 CLUSTER WITHOUT machinePools) BY RUNNING THE
      # NODE-REGISTRATION COMMAND RANCHER RENDERS FOR THAT CLUSTER. THE COMMAND
      # IS EXECUTED AS DELIVERED - IT IS NOT VENDORED OR REBUILT HERE, SO A
      # CHANGE IN RANCHER'S INSTALL SCRIPT NEEDS NO CHANGE IN THIS PLAYBOOK.
      - hosts: all
        gather_facts: true
        become: true

        vars:
          # THE REGISTRATION COMMAND EMBEDS THE CLUSTER REGISTRATION TOKEN, SO IT
          # IS READ FROM THE ENVIRONMENT - NOT FROM A VARS FILE AND NOT FROM A
          # PLAYBOOK PARAMETER. THE CALLER IS AN AnsibleRun XR
          # (stuttgart-things/crossplane-configurations) WHOSE extraEnvSecretName
          # TURNS THE KEYS OF A KUBERNETES SECRET INTO ENV VARS OF THE SAME NAME
          # IN THE ANSIBLE STEP. HANDED IN AS A VAR THE TOKEN WOULD TRAVEL AS A
          # PipelineRun PARAMETER AND STAY READABLE THERE. SAME PATTERN AS
          # upload_kubeconfig_vault WITH VAULT_ROLE_ID/VAULT_SECRET_ID.
          nodeCommand: "{{ lookup('env', 'nodeCommand') }}"
          insecureNodeCommand: "{{ lookup('env', 'insecureNodeCommand') }}"

          # SWITCHES BETWEEN THE TWO COMMANDS ABOVE. true PICKS THE --insecure
          # VARIANT, FOR A RANCHER SERVING A CERTIFICATE THE NODE DOES NOT TRUST.
          insecure: false

          # RANCHER DOES NOT SHIP THE ROLE FLAGS WITH THE COMMAND - THEY ARE
          # APPENDED HERE. ALL THREE DEFAULT TO true, WHICH IS AN ALL-IN-ONE NODE.
          rancher_node_etcd: true
          rancher_node_controlplane: true
          rancher_node_worker: true

          # OPTIONAL. rancher_node_address PINS THE ADDRESS RANCHER REGISTERS THE
          # NODE WITH, WHICH MATTERS ON MULTI-NIC HOSTS WHERE THE AGENT WOULD
          # OTHERWISE PICK THE WRONG INTERFACE.
          # rancher_node_name: node-1
          # rancher_node_address: 192.168.10.11

          # THE COMMAND INSTALLS THE rancher-system-agent. A SECOND RUN AGAINST AN
          # ALREADY-JOINED NODE MUST NOT REGISTER IT AGAIN - THE AnsibleRun IS
          # REPEATABLE BY DESIGN (runID), SO THIS PATH IS REALLY TAKEN.
          rancher_register_force: false
          rancher_agent_service: rancher-system-agent
          rancher_agent_config_path: /etc/rancher/agent/config.yaml
          rancher_agent_wait_retries: 30
          rancher_agent_wait_delay: 5

          # THE REGISTRATION TASK IS no_log BECAUSE THE COMMAND LINE CONTAINS THE
          # TOKEN. A FAILURE STILL NAMES ITS EXIT CODE AND LIKELY CAUSE (SEE THE
          # rescue BELOW), SO FLIP THIS ONLY WHEN THAT IS NOT ENOUGH - THE TOKEN
          # IS THEN IN THE LOG.
          rancher_register_no_log: true

          # WITH set -o pipefail A FAILED DOWNLOAD SURFACES AS curl'S EXIT CODE,
          # WHICH IS ENOUGH TO NAME THE CAUSE WITHOUT PRINTING THE COMMAND. THE
          # FALLBACK IS A VAR AND NOT AN INLINE LITERAL BECAUSE A STRING WRAPPED
          # ACROSS LINES INSIDE THE >- MESSAGE BELOW WOULD KEEP ITS NEWLINE AND
          # INDENTATION: YAML FOLDS ONLY LINES AT THE BLOCK'S OWN INDENT.
          rancher_register_rc_fallback: "the install script itself failed; check the rancher-system-agent install output on the node"
          rancher_register_rc_hints:
            6: "curl could not resolve the rancher host"
            7: "curl could not connect to the rancher host"
            22: "rancher answered the install script request with an http error - the registration token may be wrong or expired"
            60: "the node does not trust rancher's certificate - set insecure=true to use insecureNodeCommand, or install the CA on the node"

          # THE DISK IS GROWN BEFORE THE NODE JOINS. THE VM TEMPLATES SHIP A SMALL
          # LVM LAYOUT (vg0 ON A 15.5G PARTITION: root 5.5G, var 6G) AND A CLONE
          # WITH A BIGGER DISK LEAVES THE REST UNPARTITIONED. sthings.baseos.setup
          # GROWS IT - BUT A CALLER THAT LISTS ONLY THIS PLAYBOOK REPLACES THAT
          # DEFAULT, AND RANCHER PULLS ITS IMAGES INTO /var: THE FIRST JOIN ON A
          # 50G PROXMOX VM WENT INTO DiskPressure AND EVICTED cattle-cluster-agent
          # 29 TIMES. SAME ROLE AND SIZING AS sthings.baseos.setup; var TAKES WHAT
          # IS LEFT. THE ROLE ONLY ACTS WHEN THE PARTITION OR THE VG HAS FREE
          # SPACE, SO A RE-RUN IS A NO-OP UNLESS THE DISK WAS ENLARGED IN BETWEEN.
          # IT EXPECTS LVs root, home AND var ON A KVM OR VMWARE GUEST - SET false
          # ON ANY OTHER HOST.
          manage_filesystem: true
          lvm_root_sizing: "35%"
          lvm_home_sizing: "15%"

          # OPTIONAL: PUBLISH THIS NODE'S KUBECONFIG TO VAULT ONCE IT HAS JOINED.
          #
          # FOR A CLUSTER BUILT WITHOUT A CNI (k3s flannel-backend: none, rke2
          # cni: none). RANCHER'S PROXY RUNS THROUGH cattle-cluster-agent, WHICH
          # IS AN ORDINARY POD - WITHOUT A CNI IT NEVER STARTS, SO NOTHING CAN
          # REACH THE CLUSTER THROUGH RANCHER TO INSTALL ONE. THE WAY IN IS THE
          # API SERVER DIRECTLY: THIS WRITES THE NODE'S OWN ADMIN KUBECONFIG,
          # 127.0.0.1 REPLACED BY THE NODE ADDRESS, RAW UNDER
          # <secret_path_kubeconfig>/data/<cluster_name> (KEY kubeconfig) - THE
          # PATH A crossplane-configurations ClusterAccess READS, WHICH THEN LETS A
          # Cni XR INSTALL CILIUM.
          #
          # ONLY ON A CONTROL-PLANE NODE: A WORKER HAS NO ADMIN KUBECONFIG. THE
          # FILE APPEARS WHEN RANCHER STARTS THE DISTRIBUTION, WHICH IS AFTER THE
          # AGENT REGISTERED - HENCE THE WAIT. THE KUBECONFIG CARRIES A CLUSTER-ADMIN
          # CLIENT KEY, SO EVERY TASK TOUCHING IT IS no_log.
          #
          # VAULT CREDENTIALS COME FROM THE ENVIRONMENT (VAULT_ADDR, VAULT_ROLE_ID,
          # VAULT_SECRET_ID) - FROM AN AnsibleRun THAT IS ITS vaultSecretName, SAME
          # AS upload_kubeconfig_vault. THE AppRole NEEDS WRITE ON THE MOUNT.
          rancher_upload_kubeconfig: false
          # EMPTY MEANS DETECT. ON A RANCHER CUSTOM NODE THE DISTRIBUTION IS
          # RANCHER'S CHOICE, NOT THE CALLER'S: THE SAME REGISTRATION COMMAND
          # INSTALLS k3s OR rke2 DEPENDING ON THE CLUSTER IT BELONGS TO, AND A
          # PATH PINNED BY WHOEVER ORDERED THE RUN IS A GUESS ABOUT SOMEBODY
          # ELSE'S CLUSTER. A WRONG GUESS FAILS ONLY AT THE VERY END, AFTER THE
          # FULL rancher_kubeconfig_wait_timeout - 15 MINUTES ON A RUN THAT HAD
          # ALREADY DONE EVERYTHING ELSE RIGHT (stuttgart-things/kcl#277).
          # SET IT TO PIN ONE PATH ANYWAY; THEN NOTHING IS DETECTED. EMPTY,
          # UNSET AND null ALL MEAN DETECT - A varsFile THAT CARRIES THE KEY
          # WITHOUT A VALUE HANDS OVER null.
          rancher_kubeconfig_path: ""
          rancher_kubeconfig_candidates:
            - /etc/rancher/k3s/k3s.yaml
            - /etc/rancher/rke2/rke2.yaml
          rancher_kubeconfig_wait_timeout: 900
          rancher_kubeconfig_wait_delay: 5
          rancher_kubeconfig_api_port: 6443
          secret_path_kubeconfig: kubeconfigs
          # cluster_name: my-cluster                          # REQUIRED with rancher_upload_kubeconfig
          rancher_kubeconfig_vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
          rancher_kubeconfig_vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
          rancher_kubeconfig_vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        # ROLES RUN AFTER pre_tasks AND BEFORE tasks, SO A vars FILE CAN STILL
        # SWITCH IT OFF AND THE DISK IS GROWN BEFORE THE AGENT PULLS ANYTHING.
        roles:
          - role: sthings.rke.manage_filesystem
            when: manage_filesystem | bool

        tasks:
          - name: Select registration command
            ansible.builtin.set_fact:
              _rancher_node_command: "{{ insecureNodeCommand if insecure | bool else nodeCommand }}"
            no_log: "{{ rancher_register_no_log | bool }}"

          - name: Assert a registration command was handed in
            ansible.builtin.assert:
              that:
                - _rancher_node_command | default('', true) | trim | length > 0
              fail_msg: >-
                No registration command in the environment. Export
                {{ 'insecureNodeCommand' if insecure | bool else 'nodeCommand' }}
                for the ansible run - via extraEnvSecretName when called from an
                AnsibleRun XR.
              success_msg: "Registration command present"

          - name: Assert at least one node role is enabled
            ansible.builtin.assert:
              that:
                - (rancher_node_etcd | bool) or (rancher_node_controlplane | bool) or (rancher_node_worker | bool)
              fail_msg: >-
                At least one of rancher_node_etcd, rancher_node_controlplane,
                rancher_node_worker must be true - a node without a role cannot
                join the cluster.
              success_msg: "Node roles selected"

          # CHECKED UP FRONT, NOT AFTER THE JOIN: A MISSING cluster_name OR VAULT
          # CREDENTIAL WOULD OTHERWISE ONLY SURFACE AFTER THE NODE HAS JOINED AND
          # THE WAIT FOR ITS KUBECONFIG HAS RUN - A HALF-DONE RUN INSTEAD OF A
          # CLEAN FAILURE. ONLY LENGTHS ARE TESTED, SO NO VALUE IS PRINTED.
          - name: Assert the kubeconfig upload is configured
            ansible.builtin.assert:
              that:
                - cluster_name | default('', true) | trim | length > 0
                - rancher_kubeconfig_vault_addr | default('', true) | length > 0
                - rancher_kubeconfig_vault_role_id | default('', true) | length > 0
                - rancher_kubeconfig_vault_secret_id | default('', true) | length > 0
                - rancher_node_controlplane | bool
              fail_msg: >-
                rancher_upload_kubeconfig needs cluster_name (the Vault path and
                the ClusterAccess clusterName), VAULT_ADDR / VAULT_ROLE_ID /
                VAULT_SECRET_ID in the environment (the AnsibleRun's
                vaultSecretName), and a control-plane node - a worker has no admin
                kubeconfig to publish.
              success_msg: "Kubeconfig upload configured"
            when: rancher_upload_kubeconfig | bool

          - name: Build role flags
            ansible.builtin.set_fact:
              _rancher_role_flags: >-
                {{
                  (
                    (['--etcd'] if rancher_node_etcd | bool else [])
                    + (['--controlplane'] if rancher_node_controlplane | bool else [])
                    + (['--worker'] if rancher_node_worker | bool else [])
                    + (['--node-name ' ~ rancher_node_name] if rancher_node_name | default('', true) | trim | length > 0 else [])
                    + (['--address ' ~ rancher_node_address] if rancher_node_address | default('', true) | trim | length > 0 else [])
                  ) | join(' ')
                }}

          # IDEMPOTENCY GUARD: EITHER SIGN OF AN INSTALLED AGENT COUNTS AS
          # REGISTERED, BECAUSE NEITHER ALONE HOLDS FOR EVERY AGENT VERSION - THE
          # CONFIG PATH HAS MOVED, AND service_facts ONLY SEES THE UNIT ONCE IT IS
          # INSTALLED. A HALF-INSTALLED AGENT IS THEREFORE READ AS REGISTERED;
          # rancher_register_force IS THE WAY OUT OF THAT.
          - name: Check for the rancher-system-agent config
            ansible.builtin.stat:
              path: "{{ rancher_agent_config_path }}"
            register: _rancher_agent_config

          - name: Gather service facts
            ansible.builtin.service_facts:

          - name: Determine whether the node is already registered
            ansible.builtin.set_fact:
              _rancher_already_registered: >-
                {{
                  _rancher_agent_config.stat.exists
                  or (rancher_agent_service ~ '.service') in (ansible_facts.services | default({}))
                }}

          - name: Report an already registered node
            ansible.builtin.debug:
              msg: >-
                {{ inventory_hostname }} already runs the {{ rancher_agent_service }} -
                skipping registration. Set rancher_register_force=true to register again.
            when:
              - _rancher_already_registered | bool
              - not rancher_register_force | bool

          # set -o pipefail IS LOAD-BEARING: THE COMMAND IS A PIPELINE
          # (curl ... | sh -s - ...), AND WITHOUT IT THE EXIT STATUS IS sh'S -
          # WHICH EXITS 0 ON THE EMPTY STDIN A FAILED DOWNLOAD LEAVES BEHIND. A
          # BROKEN DOWNLOAD WOULD REPORT SUCCESS HERE AND ONLY SURFACE MINUTES
          # LATER IN THE WAIT BELOW, AS A COMPLAINT ABOUT THE AGENT INSTEAD OF
          # ABOUT THE DOWNLOAD. executable: /bin/bash IS WHAT MAKES IT VALID.
          - name: Register node against rancher
            when: (not _rancher_already_registered | bool) or (rancher_register_force | bool)
            block:
              - name: Run the registration command
                ansible.builtin.shell: "set -o pipefail && {{ _rancher_node_command }} {{ _rancher_role_flags }}"
                args:
                  executable: /bin/bash
                register: _rancher_register
                changed_when: _rancher_register.rc == 0
                no_log: "{{ rancher_register_no_log | bool }}"

            # THE TASK ABOVE IS no_log, SO A FAILURE OTHERWISE READS "non-zero
            # return code" AND NOTHING ELSE - AND THE ONLY WAY OUT WOULD BE A
            # SECOND RUN WITH THE TOKEN VISIBLE IN THE LOG. THE EXIT CODE IS NOT
            # SECRET, SO TRANSLATE IT INSTEAD. no_log IS DELIBERATELY NOT SET
            # HERE: IT WOULD HIDE THE VERY MESSAGE THIS RESCUE EXISTS TO PRINT.
            rescue:
              - name: Report the failed registration without echoing the command
                ansible.builtin.fail:
                  msg: >-
                    Registration on {{ inventory_hostname }} failed with
                    rc={{ _rancher_register.rc | default('unknown') }} -
                    {{ rancher_register_rc_hints[_rancher_register.rc | default(0)] | default(rancher_register_rc_fallback) }}.
                    The command is not shown because it carries the cluster
                    registration token; rancher_register_no_log=false prints it
                    (token included) if the exit code is not enough.

          # THE COMMAND RETURNS AS SOON AS THE AGENT IS INSTALLED, NOT WHEN IT
          # HAS COME UP - SO A RUN THAT ONLY LOOKS AT THE COMMAND'S RC REPORTS AN
          # AGENT THAT NEVER STARTED. THIS PROVES THE LOCAL AGENT IS ACTIVE, NOT
          # THAT RANCHER HAS ACCEPTED THE NODE - THE CLUSTER IS STILL WHERE THAT
          # IS CHECKED. systemctl is-active IS USED OVER service_facts BECAUSE ITS
          # OUTPUT (activating, failed, inactive) SURVIVES INTO THE FAILURE MESSAGE.
          - name: Wait for the rancher-system-agent to run
            ansible.builtin.command: "systemctl is-active {{ rancher_agent_service }}"
            register: _rancher_agent_state
            until: _rancher_agent_state.stdout | trim == 'active'
            retries: "{{ rancher_agent_wait_retries | int }}"
            delay: "{{ rancher_agent_wait_delay | int }}"
            changed_when: false
            when: _rancher_register is changed

          # SEE rancher_upload_kubeconfig IN vars. RUNS ON A RE-RUN TOO, SO AN
          # AnsibleRun WITH A NEW runID REPUBLISHES THE KUBECONFIG - E.G. AFTER
          # THE NODE CAME BACK WITH A DIFFERENT DHCP ADDRESS.
          - name: Publish the node kubeconfig to vault
            when: rancher_upload_kubeconfig | bool
            block:
              # wait_for TAKES ONE PATH, AND WITH rancher_kubeconfig_path
              # EMPTY THERE ARE TWO CANDIDATES - SO THIS POLLS WITH find AND
              # STOPS AT WHICHEVER APPEARS. retries x delay IS THE SAME BUDGET
              # wait_for HAD.
              - name: Wait for the distribution to write an admin kubeconfig
                ansible.builtin.find:
                  paths: "{{ _rancher_kubeconfig_search | map('dirname') | list }}"
                  patterns: "{{ _rancher_kubeconfig_search | map('basename') | list }}"
                  file_type: file
                vars:
                  # default('', true) BECAUSE AN UNSET PATH ARRIVES AS None, NOT
                  # AS "": a varsFile written by an AnsibleRun carries the key
                  # with no value, YAML reads that as null, and `null | length`
                  # is a templating error rather than a falsy value. Measured on
                  # the schmetterpause-rehearsal1 build, 2026-09-20.
                  _rancher_kubeconfig_search: >-
                    {{ [rancher_kubeconfig_path] if (rancher_kubeconfig_path | default('', true) | trim | length) > 0
                       else rancher_kubeconfig_candidates }}
                register: _rancher_kubeconfig_found
                until: _rancher_kubeconfig_found.files | length > 0
                retries: "{{ ((rancher_kubeconfig_wait_timeout | int) // (rancher_kubeconfig_wait_delay | int)) | int }}"
                delay: "{{ rancher_kubeconfig_wait_delay | int }}"

              # ONE NODE RUNS ONE DISTRIBUTION, SO THERE IS NORMALLY ONE FILE.
              # SORTED ANYWAY, SO A NODE CARRYING LEFTOVERS OF A PREVIOUS ONE
              # PICKS THE SAME FILE ON EVERY RUN INSTEAD OF WHICHEVER THE
              # FILESYSTEM LISTED FIRST.
              - name: Name the admin kubeconfig that appeared
                ansible.builtin.set_fact:
                  _rancher_kubeconfig_path: "{{ _rancher_kubeconfig_found.files | map(attribute='path') | sort | first }}"

              - name: Report the admin kubeconfig in use
                ansible.builtin.debug:
                  msg: "Admin kubeconfig: {{ _rancher_kubeconfig_path }}"

              - name: Wait for the API server to listen
                ansible.builtin.wait_for:
                  host: 127.0.0.1
                  port: "{{ rancher_kubeconfig_api_port | int }}"
                  timeout: "{{ rancher_kubeconfig_wait_timeout | int }}"

              - name: Read the admin kubeconfig
                ansible.builtin.slurp:
                  src: "{{ _rancher_kubeconfig_path }}"
                register: _rancher_kubeconfig_raw
                no_log: true

              # THE DISTRIBUTION POINTS ITS KUBECONFIG AT 127.0.0.1, WHICH IS
              # USELESS FROM ANYWHERE ELSE. THE ADDRESS RANCHER REGISTERED THE
              # NODE WITH WINS; OTHERWISE THE DEFAULT ROUTE'S.
              - name: Point the kubeconfig at the node address
                ansible.builtin.set_fact:
                  _rancher_kubeconfig: >-
                    {{
                      _rancher_kubeconfig_raw.content | b64decode
                      | regex_replace('https://127\.0\.0\.1:',
                          'https://' ~ (rancher_node_address | default(ansible_default_ipv4.address, true)) ~ ':')
                    }}
                no_log: true

              # become: false IS REQUIRED - THE PLAY BECOMES ROOT, AND A
              # DELEGATED TASK WOULD TRY sudo INSIDE THE ANSIBLE RUNNER, WHICH HAS
              # NONE. STORED RAW, NOT BASE64: provider-kubeconfig HANDS THE VALUE
              # STRAIGHT TO clientcmd WITHOUT DECODING.
              - name: Write the kubeconfig to vault
                community.hashi_vault.vault_write:
                  auth_method: approle
                  url: "{{ rancher_kubeconfig_vault_addr }}"
                  role_id: "{{ rancher_kubeconfig_vault_role_id }}"
                  secret_id: "{{ rancher_kubeconfig_vault_secret_id }}"
                  validate_certs: false
                  path: "{{ secret_path_kubeconfig }}/data/{{ cluster_name }}"
                  data:
                    data:
                      kubeconfig: "{{ _rancher_kubeconfig }}"
                delegate_to: localhost
                become: false
                no_log: true

              - name: Report the published kubeconfig
                ansible.builtin.debug:
                  msg: >-
                    Published the admin kubeconfig of {{ inventory_hostname }} to
                    {{ rancher_kubeconfig_vault_addr }} at
                    {{ secret_path_kubeconfig }}/data/{{ cluster_name }} (key kubeconfig).
