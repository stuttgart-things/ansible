---
playbooks:
  - name: k3s_cluster
    play: | #pragma: allowlist secret
      - hosts: all
        gather_facts: true
        become: true

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          install_k3s: true
          copy_kubeconfig: true
          fetch_kubeconfig: true
          k3s_state: present #absent
          fetched_kubeconfig_path: /tmp/kubeconfig
          prepare_rancher_ha_nodes: true #false
          k3s_k8s_version: 1.36.5
          cilium_version: 0.19.7 # cilium-cli; installs Cilium 1.19.5 unless cilium_chart_version is set
          # === optional: pin Cilium itself / opt in to Cilium 1.20 ===========
          # cilium_chart_version is passed as --version to install AND upgrade.
          # Gateway API CRDs must match the Cilium minor: 1.19 -> v1.4.1 (role
          # default), 1.20 -> v1.6.1 (server-side applied; one-way, no going back
          # below v1.5.0).
          # cilium_version: 0.20.1
          # cilium_chart_version: "1.20.2"                 # quoted
          # cilium_gateway_api_crds_version: v1.6.1
          # k3s datastore: true (default) = embedded etcd, false = sqlite/kine
          # (single-node/edge, can't grow to HA; choose before the first install):
          # k3s_cluster_init: false
          k3s_release_kind: k3s1
          cluster_setup: singlenode
          install_cilium: true
          # No self-signed root CA / cert-manager root-ca secret here: this play
          # installs no cert-manager or ClusterIssuer, so nothing consumes it, and
          # PKI usually comes via Flux. The `k3s` play (ca-issuer) keeps the role
          # default (true). Set create_root_cert: true in your vars file to opt in.
          create_root_cert: false

          # === optional new k3s features (uncomment to enable) ==============
          # air-gapped IMAGES from a mirror (images-only; binary/script upstream):
          # k3s_airgapped_installation: true
          # k3s_airgapped_image_url: "https://your-mirror/k3s-airgap-images-amd64.tar.zst"
          # k3s_airgapped_checksum: "sha256:..."          # optional integrity check
          # fully-offline binary (stage k3s binary + INSTALL_K3S_SKIP_DOWNLOAD):
          # k3s_airgapped_skip_download: true
          # k3s_airgapped_binary_url: "https://your-mirror/k3s"
          # k3s_installscript_url: "https://your-mirror/k3s-install.sh"   # zero egress
          # registry pull-through mirror (writes /etc/rancher/k3s/registries.yaml):
          # k3s_registry_mirrors:
          #   - name: "docker.io"
          #     endpoints:
          #       - "https://docker.harbor.example.com"
          #       - "https://registry-1.docker.io"        # upstream fallback
          # k3s_registry_configs:                          # optional per-host auth/TLS
          #   "docker.harbor.example.com":
          #     username: "robot-puller"
          #     password: "<robot-token>"
          #     tls:
          #       insecure_skip_verify: false
          # SELinux toggles (enforcing RHEL-family air-gap):
          # k3s_skip_selinux_rpm: true   # don't fetch k3s-selinux from a repo
          # k3s_selinux_warn: true       # missing SELinux policy -> warn, not fatal
          # Cilium air-gapped images (off by default). cilium-cli pulls from
          # quay.io; this pre-loads its images from a tar into containerd and
          # pins the pull policy so pods start offline. Build the tar with
          # deploy-configure-rke's hack/export-cilium-images.sh on a node that
          # already runs Cilium:
          # cilium_airgapped_images: true
          # cilium_airgapped_image_url: "https://your-mirror/cilium-images.tar"
          # cilium_image_pull_policy: Never                # Always (default) keeps online pull
          # cilium_airgapped_checksum: "sha256:..."        # optional integrity check

        roles:
          - role: sthings.rke.deploy_configure_rke

  - name: k3s
    play: | #pragma: allowlist secret
      - hosts: all
        gather_facts: true
        become: true

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          install_k3s: true
          copy_kubeconfig: true
          fetch_kubeconfig: true
          fetched_kubeconfig_path: ./kubeconfig
          k3s_state: present #absent
          k3s_k8s_version: 1.36.5
          k3s_release_kind: k3s1
          cluster_setup: singlenode
          install_helm_diff: true
          install_cilium: true

          # === optional new k3s features (uncomment to enable) ==============
          # air-gapped IMAGES from a mirror (images-only; binary/script upstream):
          # k3s_airgapped_installation: true
          # k3s_airgapped_image_url: "https://your-mirror/k3s-airgap-images-amd64.tar.zst"
          # k3s_airgapped_checksum: "sha256:..."          # optional integrity check
          # fully-offline binary (stage k3s binary + INSTALL_K3S_SKIP_DOWNLOAD):
          # k3s_airgapped_skip_download: true
          # k3s_airgapped_binary_url: "https://your-mirror/k3s"
          # k3s_installscript_url: "https://your-mirror/k3s-install.sh"   # zero egress
          # registry pull-through mirror (writes /etc/rancher/k3s/registries.yaml):
          # k3s_registry_mirrors:
          #   - name: "docker.io"
          #     endpoints:
          #       - "https://docker.harbor.example.com"
          #       - "https://registry-1.docker.io"        # upstream fallback
          # k3s_registry_configs:                          # optional per-host auth/TLS
          #   "docker.harbor.example.com":
          #     username: "robot-puller"
          #     password: "<robot-token>"
          #     tls:
          #       insecure_skip_verify: false
          # SELinux toggles (enforcing RHEL-family air-gap):
          # k3s_skip_selinux_rpm: true   # don't fetch k3s-selinux from a repo
          # k3s_selinux_warn: true       # missing SELinux policy -> warn, not fatal
          # Cilium air-gapped images (off by default). cilium-cli pulls from
          # quay.io; this pre-loads its images from a tar into containerd and
          # pins the pull policy so pods start offline. Build the tar with
          # deploy-configure-rke's hack/export-cilium-images.sh on a node that
          # already runs Cilium:
          # cilium_airgapped_images: true
          # cilium_airgapped_image_url: "https://your-mirror/cilium-images.tar"
          # cilium_image_pull_policy: Never                # Always (default) keeps online pull
          # cilium_airgapped_checksum: "sha256:..."        # optional integrity check

          deploy_helm_charts: true
          helm_repositories:
            ingress-nginx:
              url: https://kubernetes.github.io/ingress-nginx
            cert-manager:
              url: https://charts.jetstack.io

          helm_releases:
            ingress-nginx:
              ref: ingress-nginx/ingress-nginx
              version: 4.14.5
              namespace: ingress-nginx
              ignore: false
              wait: true
              helm_values: |
                controller:
                  hostNetwork: true
                  service:
                    type: "{{ ingress_service_type | default('ClusterIP') }}"

            cert-manager:
              ref: cert-manager/cert-manager
              version: v1.19.6
              namespace: cert-manager
              ignore: false
              wait: true
              helm_values: |
                crds:
                  enabled: true

          manifests:
            cluster_issuer:
              manifest: |
                apiVersion: cert-manager.io/v1
                kind: ClusterIssuer
                metadata:
                  name: ca-issuer
                spec:
                  ca:
                    secretName: root-ca

            lb_pool:
              manifest: |
                apiVersion: cilium.io/v2alpha1
                kind: CiliumLoadBalancerIPPool
                metadata:
                  name: first-pool
                spec:
                  blocks:
                    - start: {{ cilium_lbrange_start_ip | default('192.168.1.10') }}
                      stop: {{ cilium_lbrange_stop_ip | default('192.168.1.20') }}

            announcement_policy:
              manifest: |
                ---
                apiVersion: cilium.io/v2alpha1
                kind: CiliumL2AnnouncementPolicy
                metadata:
                  name: default-l2-announcement-policy
                  namespace: kube-system
                spec:
                  externalIPs: true
                  loadBalancerIPs: true

        roles:
          - role: sthings.rke.deploy_configure_rke
