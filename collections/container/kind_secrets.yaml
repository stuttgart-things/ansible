---
# stuttgart-things/ansible#1133 — the ONE value that has to travel.
#
# A cluster built by the `management-plane` Configuration
# (stuttgart-things/crossplane-configurations#258) pulls every credential it
# needs from git, encrypted with age. It cannot pull the age key that way —
# that would be circular. Exactly one secret therefore has to be placed from
# outside, and this is it.
#
# WHY IT IS NOT A CROSSPLANE OBJECT
#
# A `provider-kubernetes` Object carrying the key gets it patched back into the
# Object's own spec AND status by the provider — measured, not assumed, even
# with references[].patchesFrom, which is supposed to keep the value out. The
# key would then sit permanently in a plain CR, and `get objects` is a far more
# commonly granted permission than `get secrets`.
#
# Driven by an `AnsibleRun` from the seed, the key travels
# Secret -> extraEnvSecretName -> envFrom -> process environment, and never
# lands at rest anywhere it should not.
#
# WHY IT DOES SO LITTLE
#
# An earlier version installed cert-manager, the sops-secrets-operator and
# sops-git-secrets as well, transcribed from `kind_machinery`. Those belong to
# the platform, not here: they are ordinary cluster software, installable as
# Flux catalog apps (crossplane-configurations#260), and doing them from Ansible
# meant shelling out to kubectl, kustomize and helm — none of which exist in the
# pipeline image (`sthings-ansible` carries ansible and python3, nothing else).
#
# What is left uses `kubernetes.core`, i.e. the python client, so this play runs
# on the stock image with no binaries at all.
playbooks:
  - name: kind_secrets
    play: |
      ---
      - name: place the sops age key on a target cluster
        hosts: "{{ target_host | default('localhost') }}"
        connection: "{{ ansible_connection | default('local') }}"
        gather_facts: false

        # The stage-time pipeline hands `ansibleVarsFile` entries over as a PATH
        # (-e path_to_vars_file=...), not as extra-vars, so a play that does not
        # load it silently ignores everything the caller set — and the pipeline
        # prints the assembled file, which makes it look like the values
        # arrived. Same idiom as sthings.baseos.gh_runner and sthings.rke.rke2.
        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          ansible_user: "{{ lookup('env', 'USER') | default('sthings', true) }}"

          # Two ways to name the target, because the two callers differ. From a
          # workstation you already have a file, so pass the path. From an
          # AnsibleRun there is none — a Tekton pod receives Secrets as
          # environment variables — so pass it base64-encoded in KUBECONFIG_B64
          # and this play materialises it.
          kubeconfig: ""
          kubeconfig_b64: "{{ lookup('env', 'KUBECONFIG_B64') }}"
          kubeconfig_write_path: "/tmp/kind-secrets-kubeconfig"

          sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') }}"
          sops_age_key_name: sops-age-key
          sops_age_key_data_key: age.agekey
          # One namespace, because sops-secrets-operator >=v0.9.0 holds a single
          # global key for every SopsSecret (sops-secrets-operator#47). Before
          # that the private key had to be copied into each consumer namespace,
          # which is why this is a list rather than a string.
          age_key_namespaces:
            - sops-secrets-operator-system

        tasks:
          - name: Preflight — a kubeconfig was supplied
            ansible.builtin.assert:
              that:
                - (kubeconfig | length > 0) or (kubeconfig_b64 | length > 0)
              fail_msg: "set kubeconfig=<path>, or export KUBECONFIG_B64 — this play prepares a cluster the caller names."

          # 0600 and no_log: a kubeconfig carries a client certificate that is
          # cluster-admin on the target.
          - name: Materialise the kubeconfig from KUBECONFIG_B64
            ansible.builtin.copy:
              dest: "{{ kubeconfig_write_path }}"
              content: "{{ kubeconfig_b64 | b64decode }}"
              mode: "0600"
            no_log: true
            when: kubeconfig | length == 0

          - name: Use the materialised kubeconfig
            ansible.builtin.set_fact:
              kubeconfig: "{{ kubeconfig_write_path }}"
            when: kubeconfig | length == 0

          - name: Preflight — SOPS_AGE_KEY present
            ansible.builtin.assert:
              that:
                - sops_age_key | length > 0
              fail_msg: "export SOPS_AGE_KEY before running (age private key)."

          - name: Preflight — cluster reachable
            kubernetes.core.k8s_info:
              kubeconfig: "{{ kubeconfig }}"
              kind: Namespace
              name: kube-system
            register: _probe
            failed_when: _probe.resources | length == 0

          - name: Ensure the namespaces holding the age key
            kubernetes.core.k8s:
              kubeconfig: "{{ kubeconfig }}"
              state: present
              definition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: "{{ item }}"
            loop: "{{ age_key_namespaces }}"

          # THE one secret that travels. `data` (base64), never `stringData`:
          # a stringData-created Secret comes back from a server-side apply with
          # nil managedFields, which breaks every later observe against it
          # (crossplane-configurations, provider-kubernetes).
          - name: Place the sops age key
            kubernetes.core.k8s:
              kubeconfig: "{{ kubeconfig }}"
              state: present
              definition:
                apiVersion: v1
                kind: Secret
                type: Opaque
                metadata:
                  name: "{{ sops_age_key_name }}"
                  namespace: "{{ item }}"
                # The whole mapping is templated, not just the value: Ansible
                # does not template dictionary KEYS in module arguments, so
                # `"{{ var }}": value` reaches the API server as the literal
                # string — which fails validation with the placeholder quoted
                # back at you, and only after the Secret is otherwise correct.
                data: "{{ {sops_age_key_data_key: sops_age_key | b64encode} }}"
            loop: "{{ age_key_namespaces }}"
            no_log: true    # never echo the age private key

          - name: Age key placed
            ansible.builtin.debug:
              msg: >-
                {{ sops_age_key_name }}/{{ sops_age_key_data_key }} present in
                {{ age_key_namespaces | join(', ') }}. Everything else — cert-manager,
                sops-secrets-operator, sops-git-secrets — is the platform's job.
