---
# stuttgart-things/ansible#1133 — the secrets layer, on its own.
#
# Everything a cluster needs BEFORE there is a Crossplane on it, and therefore
# the only part of the machinery bootstrap that cannot come from Crossplane:
#
#   cert-manager -> sops-secrets-operator (+ global age key) -> sops-git-secrets
#
# WHY THIS EXISTS SEPARATELY
#
# With the `management-plane` Configuration
# (stuttgart-things/crossplane-configurations#258) Crossplane installs itself,
# its providers, functions and configurations on a target cluster — under the CR
# names the package manager DERIVES, which is what makes the Lock collision from
# crossplane-configurations#247 structurally impossible.
#
# Running the full `kind_machinery` play over such a cluster would install those
# same packages a second time under SHORT names: two names for one source, i.e.
# exactly the collision that was just designed away. So the machinery play is
# not merely redundant there — it is harmful.
#
# What is still needed is this: the four steps that must precede Crossplane.
#
# INVOCATION
#
# Meant to be driven by an `AnsibleRun` XR from the seed against a freshly built
# cluster, which is what keeps the age key out of a CR: it travels
# Secret -> extraEnvSecretName -> envFrom -> process environment, and the task
# that consumes it is `no_log`. A `provider-kubernetes` Object carrying the key
# would instead have it patched back into its own spec and status by the
# provider — measured, not assumed (crossplane-configurations#258).
#
# `kubeconfig` has no default on purpose: this play is about a cluster the
# caller names, not about the machine it runs on.
playbooks:
  - name: kind_secrets
    play: |
      ---
      - name: secrets layer — cert-manager, sops-secrets-operator, age key, sops-git
        hosts: "{{ target_host | default('localhost') }}"
        connection: "{{ ansible_connection | default('local') }}"
        gather_facts: false

        vars:
          # Several tasks below open with a pipeline. Ansible's shell module runs
          # /bin/sh, which on Ubuntu is dash, and dash has no pipefail — the task
          # then dies on line 1 before reading a single value. Set here so the play
          # is correct however it is invoked.
          ansible_shell_executable: /bin/bash
          ansible_user: "{{ lookup('env', 'USER') | default('sthings', true) }}"

          # Path to a kubeconfig for the cluster to prepare. No default: the
          # whole point of this play is that the target is chosen by the caller.
          #
          # Two ways to supply it, because the two callers differ. From a
          # workstation you already have a file, so pass the path. From an
          # `AnsibleRun` there is no file — a Tekton pod receives Secrets as
          # environment variables — so pass the kubeconfig base64-encoded in
          # KUBECONFIG_B64 and this play materialises it. That keeps the
          # target's credentials on the same path the age key takes:
          # Secret -> envFrom -> process environment, never a field on a CR.
          kubeconfig: ""
          kubeconfig_b64: "{{ lookup('env', 'KUBECONFIG_B64') }}"
          kubeconfig_write_path: "/tmp/kind-secrets-kubeconfig"

          cert_manager_version: v1.21.0

          # From v0.9.0 the ref alone selects the image: semantic-release writes
          # config/manager/kustomization.yaml before it tags. sops-secrets-operator#86,
          # fixed by #90.
          sops_operator_ref: v0.9.0
          sops_operator_kustomize: "https://github.com/stuttgart-things/sops-secrets-operator/config/default"
          sops_operator_namespace: sops-secrets-operator-system
          sops_operator_overlay_dir: "/home/{{ ansible_user }}/.cache/sops-operator-overlay"

          sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') }}"
          sops_age_key_data_key: age.agekey
          # v0.9.0 (sops-secrets-operator#47) lets the operator hold ONE age key for
          # every SopsSecret, so the private key stops being copied into each
          # consumer namespace. With it off, every namespace needs its own copy.
          sops_global_age_key_enabled: true
          age_key_namespaces: >-
            {{ ['sops-secrets-operator-system'] if sops_global_age_key_enabled | bool else ['crossplane-system'] }}
          sops_age_key_ref_name: "{{ '' if sops_global_age_key_enabled | bool else 'sops-age-key' }}"

          sops_git_secrets_enabled: true
          sops_git_secrets_chart_version: "0.9.0"
          sops_git_repository_name: sops-secrets
          sops_git_username: stuttgart-things
          # Read-only token with access to stuttgart_things_repo. Never commit.
          sops_git_token: "{{ lookup('env', 'SOPS_GIT_TOKEN') }}"
          stuttgart_things_repo: "https://github.com/stuttgart-things/stuttgart-things.git"
          charts_oci: "oci://ghcr.io/stuttgart-things/charts"
          standalone_sops_secrets:
            - name: vault
              namespace: crossplane-system

        tasks:
          - name: Preflight — a kubeconfig was supplied
            ansible.builtin.assert:
              that:
                - (kubeconfig | length > 0) or (kubeconfig_b64 | length > 0)
              fail_msg: "set kubeconfig=<path>, or export KUBECONFIG_B64 — this play prepares a cluster the caller names."

          # mode 0600 and no_log: a kubeconfig carries a client certificate that
          # is cluster-admin on the target.
          - name: Materialise the kubeconfig from KUBECONFIG_B64
            ansible.builtin.copy:
              dest: "{{ kubeconfig_write_path }}"
              content: "{{ kubeconfig_b64 | b64decode }}"
              mode: "0600"
            no_log: true
            when: kubeconfig | length == 0

          - name: Use the materialised kubeconfig
            ansible.builtin.set_fact:
              kubeconfig: "{{ kubeconfig_write_path }}"
            when: kubeconfig | length == 0

          - name: Preflight — SOPS_AGE_KEY present
            ansible.builtin.assert:
              that:
                - sops_age_key | length > 0
              fail_msg: "export SOPS_AGE_KEY before running (age private key)."

          - name: Preflight — git token present when sops-git is enabled
            ansible.builtin.assert:
              that:
                - sops_git_token | length > 0
              fail_msg: "export SOPS_GIT_TOKEN (read-only) or set sops_git_secrets_enabled=false."
            when: sops_git_secrets_enabled | bool

          - name: Preflight — cluster reachable
            ansible.builtin.command: >
              kubectl get --raw /healthz --kubeconfig {{ kubeconfig }}
            changed_when: false

          # cert-manager first: the sops-secrets-operator ships a webhook whose
          # certificate it issues. The probe loop is not belt-and-braces — the
          # rollout completing does not mean the webhook is answering yet, and an
          # apply into that window fails with a connection refusal that reads like
          # a broken manifest.
          - name: Ensure cert-manager (sops-secrets-operator webhook dependency)
            ansible.builtin.shell: |
              kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml --kubeconfig {{ kubeconfig }}
              for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
                kubectl -n cert-manager rollout status deploy/$d --timeout=180s --kubeconfig {{ kubeconfig }}
              done
              for i in $(seq 1 30); do
                echo '{"apiVersion":"cert-manager.io/v1","kind":"Issuer","metadata":{"name":"cm-webhook-probe","namespace":"kube-system"},"spec":{"selfSigned":{}}}' | kubectl apply --dry-run=server --kubeconfig {{ kubeconfig }} -f - >/dev/null 2>&1 && break
                sleep 5
              done

          # Deployed through a thin local overlay rather than `apply -k <remote>`
          # directly, so the manager's flags are part of the applied desired state.
          # A `kubectl patch` after the apply would be undone by the next run.
          - name: Create the sops-secrets-operator overlay dir
            ansible.builtin.file:
              path: "{{ sops_operator_overlay_dir }}"
              state: directory
              mode: "0755"

          - name: Render the sops-secrets-operator kustomize overlay
            ansible.builtin.copy:
              dest: "{{ sops_operator_overlay_dir }}/kustomization.yaml"
              mode: "0644"
              content: |
                ---
                resources:
                  - {{ sops_operator_kustomize }}?ref={{ sops_operator_ref }}
                {% if sops_global_age_key_enabled | bool %}
                patches:
                  - target:
                      kind: Deployment
                      name: sops-secrets-operator-controller-manager
                    patch: |-
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-secret={{ sops_operator_namespace }}/sops-age-key
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-data-key={{ sops_age_key_data_key }}
                {% endif %}

          - name: Deploy sops-secrets-operator (kustomize)
            ansible.builtin.command: >
              kubectl apply -k {{ sops_operator_overlay_dir }}
              --kubeconfig {{ kubeconfig }}

          - name: Wait for sops-secrets-operator controller rollout
            ansible.builtin.command: >
              kubectl -n {{ sops_operator_namespace }} rollout status deployment --timeout=180s
              --kubeconfig {{ kubeconfig }}
            changed_when: false

          # THE one secret that has to travel. Everything else the cluster pulls
          # from git with it.
          - name: Install the sops age-key Secret into each consumer namespace
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              kubectl -n {{ item }} create secret generic sops-age-key \
                --from-literal=age.agekey='{{ sops_age_key }}' \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            loop: "{{ age_key_namespaces }}"
            no_log: true    # never echo the age private key

          - name: Ensure the namespaces the standalone sops secrets are written into
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            loop: "{{ standalone_sops_secrets | map(attribute='namespace') | unique | list }}"
            when: sops_git_secrets_enabled | bool

          - name: Deploy sops-git-secrets (GitRepository + read-only credential)
            ansible.builtin.command: >
              helm upgrade --install sops-git-secrets {{ charts_oci }}/sops-git-secrets
              --version {{ sops_git_secrets_chart_version }}
              --set git.name={{ sops_git_repository_name }}
              --set git.url={{ stuttgart_things_repo }}
              --set git.auth.username={{ sops_git_username }}
              --set git.auth.password={{ sops_git_token }}
              {% for s in standalone_sops_secrets %}--set secrets[{{ loop.index0 }}].name={{ s.name }} --set secrets[{{ loop.index0 }}].namespace={{ s.namespace }} {% endfor %}
              --set ageKeySecret.name={{ sops_age_key_ref_name }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            when: sops_git_secrets_enabled | bool
            no_log: true    # never echo the git token

          - name: Secrets layer ready
            ansible.builtin.debug:
              msg: >-
                sops-secrets-operator {{ sops_operator_ref }} running,
                age key in {{ age_key_namespaces | join(', ') }},
                sops-git-secrets {{ 'deployed' if sops_git_secrets_enabled | bool else 'skipped' }}.
