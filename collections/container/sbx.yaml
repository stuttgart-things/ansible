---
playbooks:
  - name: sbx
    play: |
      ---
      # Docker Sandboxes (sbx): one KVM microVM per sandbox. Needs Ubuntu
      # 24.04+ and /dev/kvm -- on a VM that means nested virtualization on the
      # hypervisor node and a CPU type that passes VMX/SVM through (Proxmox:
      # cpuType host). Docker Engine is NOT required; sbx brings its own
      # containerd shim, kernel and rootfs.
      #
      # Every sbx command but the daemon refuses to work until the user is
      # signed in to Docker. By default that stays manual (`sbx login`).
      # With sbx_login=true the play signs in with a Docker PAT, taken from
      # -e sbx_docker_username/sbx_docker_token or, when those are empty,
      # from Vault (sbx_vault_secret, keys username + token):
      #   -e sbx_login=true -e sbx_docker_username=<user> -e sbx_docker_token=<pat>
      #   -e sbx_login=true -e sbx_vault_secret=apps/data/docker-sbx
      #      (+ VAULT_ADDR / VAULT_ROLE_ID / VAULT_SECRET_ID in the env)
      - hosts: "{{ target_host | default('all') }}"
        become: true
        vars:
          sbx_users:
            - sthings
          # '' = newest from the Docker apt repo, otherwise e.g. 0.48.0
          sbx_version: ''
          sbx_package_state: present
          # sandboxd per user as a systemd service (sbx-daemon@<user>)
          sbx_daemon_service: true
          # '' keeps the state in ~/.local/state/sandboxes. Set e.g.
          # /var/lib/sbx to move it off /home (the sthings LVM layout gives
          # /home ~30G but /var ~100G) -- the user dir becomes a symlink to
          # <sbx_state_dir>/<user>.
          sbx_state_dir: ''
          # global network policy the daemon initializes on its first start:
          # allow-all | balanced | deny-all. Without one every `sbx create`
          # fails. Init is one-time -- an existing policy is kept; change it
          # with `sbx policy reset` + `sbx policy init <policy>`.
          sbx_network_policy: balanced
          # Docker sign-in, off by default. A user already signed in is left
          # alone unless sbx_login_force=true (e.g. after rotating the PAT).
          sbx_login: false
          sbx_login_force: false
          sbx_docker_username: ''
          sbx_docker_token: ''
          # KV v2 path with keys `username` and `token`; read only when
          # sbx_login=true and the -e values above are empty
          sbx_vault_secret: ''
          vault_url: "{{ lookup('env', 'VAULT_ADDR') }}"
          vault_approle_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
          vault_approle_secret: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
          sbx_apt_gpg_key: https://download.docker.com/linux/ubuntu/gpg
          # same keyring + repo line as the install_configure_docker role, so
          # both can run on one host without a duplicate apt source
          sbx_apt_gpg_key_dest: /etc/apt/keyrings/docker.asc
          sbx_apt_repository: "deb [arch=amd64 signed-by={{ sbx_apt_gpg_key_dest }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

        handlers:
          - name: Restart sbx daemons
            ansible.builtin.systemd:
              name: "sbx-daemon@{{ item }}"
              state: restarted
              daemon_reload: true
            loop: "{{ sbx_users }}"
            when: sbx_daemon_service | bool

        tasks:
          - name: Assert valid network policy
            ansible.builtin.assert:
              that:
                - sbx_network_policy in ['allow-all', 'balanced', 'deny-all']
              fail_msg: "sbx_network_policy must be allow-all, balanced or deny-all, got '{{ sbx_network_policy }}'"

          - name: Assert supported OS (Ubuntu 24.04 or later)
            ansible.builtin.assert:
              that:
                - ansible_distribution == 'Ubuntu'
                - ansible_distribution_version is version('24.04', '>=')
              fail_msg: "sbx supports Ubuntu 24.04+ only, found {{ ansible_distribution }} {{ ansible_distribution_version }}"

          - name: Check for /dev/kvm
            ansible.builtin.stat:
              path: /dev/kvm
            register: sbx_kvm_dev

          - name: Fail without KVM
            ansible.builtin.fail:
              msg: >-
                /dev/kvm is missing, so sbx cannot start sandboxes. On a VM,
                enable nested virtualization on the hypervisor node and use a
                CPU type that passes VMX/SVM through (Proxmox: cpuType host).
            when: not sbx_kvm_dev.stat.exists

          - name: Ensure keyrings directory exists
            ansible.builtin.file:
              path: /etc/apt/keyrings
              state: directory
              mode: "0755"

          - name: Add Docker apt key
            ansible.builtin.get_url:
              url: "{{ sbx_apt_gpg_key }}"
              dest: "{{ sbx_apt_gpg_key_dest }}"
              mode: "0644"

          - name: Add Docker apt repository
            ansible.builtin.apt_repository:
              repo: "{{ sbx_apt_repository }}"
              state: present
              update_cache: true

          - name: Install docker-sbx and cpu-checker (kvm-ok)
            ansible.builtin.apt:
              name:
                - "docker-sbx{{ ('=' + sbx_version + '*') if sbx_version | length > 0 else '' }}"
                - cpu-checker
              state: "{{ sbx_package_state }}"
            notify: Restart sbx daemons

          - name: Add sbx users to the kvm group
            ansible.builtin.user:
              name: "{{ item }}"
              groups: kvm
              append: true
            loop: "{{ sbx_users }}"

          - name: Relocate sbx state
            when: sbx_state_dir | length > 0
            block:
              - name: Create state directory per user
                ansible.builtin.file:
                  path: "{{ sbx_state_dir }}/{{ item }}"
                  state: directory
                  owner: "{{ item }}"
                  group: "{{ item }}"
                  mode: "0700"
                loop: "{{ sbx_users }}"

              - name: Ensure ~/.local/state exists
                ansible.builtin.file:
                  path: "/home/{{ item }}/.local/state"
                  state: directory
                  owner: "{{ item }}"
                  group: "{{ item }}"
                  mode: "0755"
                loop: "{{ sbx_users }}"

              - name: Check existing state path
                ansible.builtin.stat:
                  path: "/home/{{ item }}/.local/state/sandboxes"
                loop: "{{ sbx_users }}"
                register: sbx_state_stat

              # only while the state is still a real directory -- stopping on
              # every run made the start task below report changed each time
              - name: Stop sbx daemons before moving state
                ansible.builtin.systemd:
                  name: "sbx-daemon@{{ item.item }}"
                  state: stopped
                loop: "{{ sbx_state_stat.results }}"
                when: item.stat.exists and item.stat.isdir
                failed_when: false

              - name: Move existing state into the new location
                ansible.builtin.shell: |
                  set -e
                  cp -a "/home/{{ item.item }}/.local/state/sandboxes/." "{{ sbx_state_dir }}/{{ item.item }}/"
                  rm -rf "/home/{{ item.item }}/.local/state/sandboxes"
                loop: "{{ sbx_state_stat.results }}"
                when: item.stat.exists and item.stat.isdir

              - name: Link state path to the new location
                ansible.builtin.file:
                  src: "{{ sbx_state_dir }}/{{ item }}"
                  dest: "/home/{{ item }}/.local/state/sandboxes"
                  state: link
                  owner: "{{ item }}"
                  group: "{{ item }}"
                  # owner/group on the link itself, not on its target
                  follow: false
                  force: true
                loop: "{{ sbx_users }}"
                notify: Restart sbx daemons

          - name: Install sbx-daemon@ systemd unit
            ansible.builtin.copy:
              dest: /etc/systemd/system/sbx-daemon@.service
              mode: "0644"
              content: |
                [Unit]
                Description=Docker Sandboxes daemon (sandboxd) for %i
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=simple
                User=%i
                Group=%i
                SupplementaryGroups=kvm
                Environment=HOME=/home/%i
                WorkingDirectory=/home/%i
                # the sbx CLI starts its own sandboxd when none answers, and
                # `daemon start` then exits 0 with "already running" -- take
                # over from such a daemon instead of exiting
                ExecStartPre=-/usr/bin/sbx daemon stop
                ExecStart=/usr/bin/sbx daemon start --policy {{ sbx_network_policy }}
                ExecStop=/usr/bin/sbx daemon stop
                Restart=always
                RestartSec=5

                [Install]
                WantedBy=multi-user.target
            when: sbx_daemon_service | bool
            notify: Restart sbx daemons

          - name: Enable and start sbx daemons
            ansible.builtin.systemd:
              name: "sbx-daemon@{{ item }}"
              state: started
              enabled: true
              daemon_reload: true
            loop: "{{ sbx_users }}"
            when: sbx_daemon_service | bool

          - name: Flush handlers
            ansible.builtin.meta: flush_handlers

          # --policy on the daemon only applies when that daemon starts first.
          # Initialize explicitly when no policy exists yet; an existing one
          # is left alone (init is one-time, a change needs `sbx policy reset`)
          - name: Check sbx network policy
            ansible.builtin.command: sbx policy ls
            become_user: "{{ item }}"
            environment:
              HOME: "/home/{{ item }}"
            loop: "{{ sbx_users }}"
            register: sbx_policy_ls
            changed_when: false
            failed_when: false

          - name: Initialize sbx network policy
            ansible.builtin.command: "sbx policy init {{ sbx_network_policy }}"
            become_user: "{{ item.item }}"
            environment:
              HOME: "/home/{{ item.item }}"
            loop: "{{ sbx_policy_ls.results }}"
            when: "'not been initialized' in (item.stdout + item.stderr)"

          - name: Docker sign-in
            when: sbx_login | bool
            block:
              # Same lookup form as baseos developer/setup/pdns. Only the
              # value that was not passed with -e is read.
              - name: Read Docker credentials from Vault
                ansible.builtin.set_fact:
                  sbx_login_username: "{{ sbx_docker_username if sbx_docker_username | length > 0 else lookup('community.hashi_vault.hashi_vault', 'secret=' ~ sbx_vault_secret ~ ':username validate_certs=false auth_method=approle role_id=' ~ vault_approle_id ~ ' secret_id=' ~ vault_approle_secret ~ ' url=' ~ vault_url) }}"
                  sbx_login_token: "{{ sbx_docker_token if sbx_docker_token | length > 0 else lookup('community.hashi_vault.hashi_vault', 'secret=' ~ sbx_vault_secret ~ ':token validate_certs=false auth_method=approle role_id=' ~ vault_approle_id ~ ' secret_id=' ~ vault_approle_secret ~ ' url=' ~ vault_url) }}"
                when: sbx_vault_secret | length > 0
                delegate_to: localhost
                become: false
                no_log: true

              - name: Use Docker credentials from vars
                ansible.builtin.set_fact:
                  sbx_login_username: "{{ sbx_docker_username }}"
                  sbx_login_token: "{{ sbx_docker_token }}"
                when: sbx_vault_secret | length == 0
                no_log: true

              - name: Assert Docker credentials are set
                ansible.builtin.assert:
                  that:
                    - sbx_login_username | length > 0
                    - sbx_login_token | length > 0
                  fail_msg: >-
                    sbx_login=true needs sbx_docker_username + sbx_docker_token
                    (-e) or sbx_vault_secret (Vault keys username, token)
                  quiet: true
                no_log: true

              - name: Check Docker sign-in state
                ansible.builtin.command: sbx diagnose --json
                become_user: "{{ item }}"
                environment:
                  HOME: "/home/{{ item }}"
                loop: "{{ sbx_users }}"
                register: sbx_diagnose
                changed_when: false
                failed_when: false

              - name: Sign in to Docker
                ansible.builtin.command:
                  cmd: "sbx login --username {{ sbx_login_username }} --password-stdin"
                  stdin: "{{ sbx_login_token }}"
                become_user: "{{ item.item }}"
                environment:
                  HOME: "/home/{{ item.item }}"
                loop: "{{ sbx_diagnose.results }}"
                loop_control:
                  label: "{{ item.item }}"
                when: >-
                  sbx_login_force | bool or
                  ((item.stdout | default('{}') | from_json).checks | default([])
                    | selectattr('name', 'equalto', 'Authentication')
                    | selectattr('status', 'equalto', 'pass') | list | length == 0)
                no_log: true

          - name: Run kvm-ok
            ansible.builtin.command: kvm-ok
            changed_when: false

          - name: Read sbx version
            ansible.builtin.command: sbx version
            register: sbx_version_out
            changed_when: false

          - name: Show sbx version
            ansible.builtin.debug:
              msg: "{{ sbx_version_out.stdout }}{{ '' if sbx_login | bool else (' -- sign in with sbx login as each of ' ~ (sbx_users | join(', '))) }}"
