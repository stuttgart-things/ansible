---
playbooks:
  - name: kind
    play: |
      ---
      - hosts: "{{ target_host | default('all') }}"
        become: true
        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          ansible_user: sthings
          kind_cluster_name: dev
          path_to_kubeconfig: "/home/{{ ansible_user }}/.kube/{{ kind_cluster_name }}"
          kind_version: 0.33.0 # datasource=github-tags depName=kubernetes-sigs/kind
          kubectl_version: 1.35.0 # datasource=github-tags depName=kubernetes/kubectl
          count_worker_nodes: 3
          count_controlplane_nodes: 1
          enable_ingress_ports: true
          enable_host_paths: true
          provision_cluster: true
          docker_install_compose: true
          install_kind: true
          create_kind_cluster: true
          rebuild_kind_cluster: true
          update_kubeconfig_ip: false
          fetch_kubeconfig: true
          fetched_kubeconfig_path: "/tmp/{{ kind_cluster_name }}"

          # CLIs that kind_machinery shells out to but the docker/kind role does not
          # carry. Versions and URL shapes mirror collections/baseos/binaries.yaml --
          # keep them in step.
          install_machinery_bins: true
          crossplane_version: 2.5.0 # datasource=github-tags depName=crossplane/cli
          sops_version: 3.13.3 # datasource=github-tags depName=getsops/sops

        roles:
          - role: sthings.container.install_configure_docker

        post_tasks:
          # install_configure_docker brings kubectl, kind, helm, helmfile, k9s and yq.
          # kind_machinery additionally shells out to crossplane and sops, so without
          # these two a machinery run fails on the first crossplane call. `bin` is set
          # as task vars, not play vars, so the docker role's own defaults are left
          # alone.
          - name: Install the machinery CLIs the docker/kind role does not carry
            ansible.builtin.include_role:
              name: sthings.container.download_install_binary
            when: install_machinery_bins | default(true) | bool
            vars:
              bin:
                crossplane:
                  bin_name: crossplane
                  bin_version: "{{ crossplane_version }}"
                  check_bin_version_before_installing: true
                  # Bucket AND binary name both switch at v2.3.0, see
                  # collections/baseos/binaries.yaml -- a bare version bump 404s.
                  source_url: "https://cli.crossplane.io/stable/v{{ crossplane_version }}/bin/linux_amd64/crossplane"
                  bin_to_copy: crossplane
                  to_remove: ""
                  bin_dir: "/usr/bin"
                  version_cmd: "version"
                  target_version: "{{ crossplane_version }}"
                sops:
                  bin_name: sops
                  bin_version: "{{ sops_version }}"
                  check_bin_version_before_installing: true
                  source_url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
                  bin_to_copy: "sops-v{{ sops_version }}.linux.amd64"
                  to_remove: ""
                  # bin_to_copy's basename != bin_name, so bin_dir must be the full
                  # target FILE path -- that is what makes `copy` rename the artifact.
                  # With a directory here the binary lands as
                  # /usr/bin/sops-v<version>.linux.amd64 and `sops` is simply absent,
                  # silently: the play still reports ok.
                  bin_dir: "/usr/bin/sops"
                  version_cmd: " --version"
                  target_version: "{{ sops_version }}"

          - name: Set stats for deployment
            set_fact:
              path_to_kubeconfig: "{{ path_to_kubeconfig }}"
              kind_cluster_name: "{{ kind_cluster_name }}"
              state: present

  - name: kind_xplane_cluster
    play: |
      ---
      - hosts: "{{ target_host | default('all') }}"
        become: true

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          ansible_user: sthings
          kind_cluster_name: dev2
          kubeconfig_folder: "/home/{{ ansible_user }}/.kube"

          kustomize_urls:
            - https://github.com/stuttgart-things/helm/infra/crds/cilium
            - https://github.com/stuttgart-things/helm/infra/crds/cert-manager
            - https://github.com/stuttgart-things/helm/cicd/crds/crossplane

          # Plain manifests to `kubectl apply -f`. Empty by default: the entry
          # that used to live here,
          #   https://github.com/stuttgart-things/helm/cicd/crossplane-config
          # is not a directory in the helm repo — only
          # `cicd/crossplane-config.yaml.gotmpl` exists, and that is a HELMFILE,
          # which kubectl cannot apply. So the URL 404'd and this play failed
          # every time it ran. kind_machinery does it correctly with
          # `helmfile apply -f {{ helm_repo }}@cicd/crossplane-config.yaml.gotmpl`,
          # so nothing is lost. Kept as an extension point for callers that do
          # have real manifest URLs; the task below is guarded on length > 0.
          manifest_urls: []

          helmfile_deployments:
            - location: "git::https://github.com/stuttgart-things/helm.git@infra/cilium.yaml.gotmpl"
              state: "{{ deploy_cilium | default('present') }}"
              state_values:
                config: kind
                clusterName: "{{ kind_cluster_name}}"
                configureLB: false

            - location: "git::https://github.com/stuttgart-things/helm.git@infra/cert-manager.yaml.gotmpl"
              state: "{{ deploy_cert_manager | default('present') }}"
              state_values:
                installCrds: false

            - location: "git::https://github.com/stuttgart-things/helm.git@cicd/crossplane.yaml.gotmpl"
              state: "{{ deploy_crossplane | default('present') }}"
              state_values:
                version: 2.2.0


        tasks:
          - name: Verify kind cluster
            ansible.builtin.shell: |
              kind get clusters
              kubectl get nodes --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }}
            become: yes
            become_user: "{{ ansible_user }}"

          - name: Set kind name as fact
            set_fact:
              kind_cluster_name: "{{ kind_cluster_name }}"

          - name: Apply Kustomize configurations (server-side apply)
            ansible.builtin.shell: |
              kubectl apply -k {{ item }} \
                --server-side \
                --force-conflicts \
                --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }}
            become: yes
            become_user: "{{ ansible_user }}"
            loop: "{{ kustomize_urls }}"
            when: kustomize_urls is defined and kustomize_urls | length > 0

          - name: Apply manifest configurations
            ansible.builtin.shell: |
              kubectl apply -f {{ item }} \
                --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }}
            become: yes
            become_user: "{{ ansible_user }}"
            loop: "{{ manifest_urls }}"
            when: manifest_urls is defined and manifest_urls | length > 0

          - name: Clear helmfile git cache
            ansible.builtin.file:
              path: "/home/{{ ansible_user }}/.cache/helmfile/states/https_github_com_stuttgart-things_helm_git"
              state: absent
            become: yes
            become_user: "{{ ansible_user }}"

          - name: Validate and process Helmfile deployments
            ansible.builtin.assert:
              that:
                - item.state in ['present', 'absent', 'sync']
              msg: "State must be 'present', 'absent', or 'sync'"
            loop: "{{ helmfile_deployments }}"
            loop_control:
              label: "{{ item.location }}"
            when: helmfile_deployments is defined and helmfile_deployments | length > 0

          - name: Apply, Sync, or Destroy Helmfile configurations
            ansible.builtin.shell:
              cmd: |
                helmfile init --force
                {% set state_args = [] %}
                {% if item.state_values is defined %}
                {% for key, value in item.state_values.items() %}
                {% set _ = state_args.append('--state-values-set ' ~ key ~ '=' ~ value|string) %}
                {% endfor %}
                {% endif %}

                {% if item.state == 'present' %}
                helmfile apply -f {{ item.location }} --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }} {{ state_args | join(' ') }}
                {% elif item.state == 'absent' %}
                helmfile destroy -f {{ item.location }} --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }} {{ state_args | join(' ') }}
                {% elif item.state == 'sync' %}
                helmfile sync -f {{ item.location }} --kubeconfig {{ kubeconfig_folder }}/{{ kind_cluster_name }} {{ state_args | join(' ') }}
                {% endif %}
            become: yes
            become_user: "{{ ansible_user }}"
            loop: "{{ helmfile_deployments }}"
            loop_control:
              label: "{{ item.location }} (state: {{ item.state }})"
            when: helmfile_deployments is defined and helmfile_deployments | length > 0

  - name: upload_kubeconfig_vault
    play: |
      ---
      - hosts: "{{ target_host | default('all') }}"
        vars:
          ansible_user: sthings
          vault_approle_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
          vault_approle_secret: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
          vault_url: "{{ lookup('env', 'VAULT_ADDR') }}"
          replace_ip: true
          create_flux_ns: false

          kind_cluster_name: dev
          kubeconfig_path: "/home/{{ ansible_user }}/.kube/{{ kind_cluster_name }}"
          secret_path_kubeconfig: kubeconfigs
          cluster_name: "{{ kind_cluster_name }}"

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        tasks:
          - name: Fetch kubeconfig local to ansible host
            ansible.builtin.fetch:
              src: "{{ kubeconfig_path }}"
              dest: "{{ kubeconfig_path|basename }}"
              flat: yes
              run_once: true

          - name: Create flux-system namespace
            kubernetes.core.k8s:
              name: flux-system
              api_version: v1
              kind: Namespace
              state: present
              kubeconfig: "{{ kubeconfig_path|basename }}"
            when: create_flux_ns|bool
            delegate_to: localhost

          - name: Replace loopback address in kubeconfig with host IP
            ansible.builtin.replace:
              dest: "{{ kubeconfig_path|basename }}"
              regexp: '(127\.0\.0\.1|0\.0\.0\.0)'
              replace: "{{ ansible_default_ipv4.address }}"
            delegate_to: localhost
            when: replace_ip|bool

          # Stored RAW, not base64. Vault KVv2 values are JSON strings and hold
          # YAML fine, so the encoding was redundant — and provider-kubeconfig
          # (RemoteCluster with source.type: vault) hands the value straight to
          # clientcmd.RESTConfigFromKubeConfig with no decode step, so a base64
          # blob fails to parse.
          - name: Write kubeconfig to vault using key value V2 engine
            community.hashi_vault.vault_write:
              auth_method: approle
              url: "{{ vault_url }}"
              role_id: "{{ vault_approle_id }}"
              secret_id: "{{ vault_approle_secret }}"
              validate_certs: false
              path: "{{ secret_path_kubeconfig }}/data/{{ cluster_name }}"
              data:
                data:
                  kubeconfig: "{{ lookup('ansible.builtin.file', kubeconfig_path|basename) }}"
            delegate_to: localhost

  - name: get_controlplane_ip
    play: |
      ---
      - hosts: "{{ target_host | default('all') }}"
        become: true
        vars:
          kind_cluster_name: dev
          ansible_user: sthings

        tasks:
          - name: Get control plane node name
            command: kubectl get nodes --kubeconfig /home/{{ ansible_user }}/.kube/{{ kind_cluster_name }} -o json
            register: nodes_json

          - name: Parse control plane node name
            shell: echo '{{ nodes_json.stdout }}' | jq -r '.items[] | select(.metadata.labels["node-role.kubernetes.io/control-plane"]) | .metadata.name'
            register: control_plane_node

          - name: Get control plane IP
            command: kubectl get node {{ control_plane_node.stdout }} --kubeconfig /home/{{ ansible_user }}/.kube/{{ kind_cluster_name }} -o json
            register: node_json

          - name: Parse control plane IP
            shell: echo '{{ node_json.stdout }}' | jq -r '.status.addresses[] | select(.type=="InternalIP") | .address'
            register: control_plane_ip

          - name: Set control plane IP fact
            set_fact:
              control_plane_ip: "{{ control_plane_ip.stdout }}"
