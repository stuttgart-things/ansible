---
name: container
namespace: sthings
authors:
  - patrick.hermann
description: container runtimes, kubernetes distributions and helm profiles
license:
  - Apache-2.0
tags:
  - container
  - kubernetes
  - helm
repository: https://github.com/stuttgart-things/ansible
documentation: https://github.com/stuttgart-things/ansible
homepage: https://github.com/stuttgart-things/ansible
issues: https://github.com/stuttgart-things/ansible/issues
requirements: |
  roles:
    - src: https://github.com/stuttgart-things/install-configure-docker.git
      scm: git
      # 2026.11.05 -- ansible-lint clean (install-configure-docker#47); no
      # behaviour change.
      version: 2026.11.05
    - src: https://github.com/stuttgart-things/install-requirements.git
      scm: git
      version: 2026.10.09-1
    - src: https://github.com/stuttgart-things/install-configure-vault.git
      scm: git
      # 2026.09.01 -- install-ca-auth derives the CA filename from the Vault
      # instance instead of `999 | random`, so the file is idempotent and can be
      # removed again. See collections/baseos/collection.yaml for the full why.
      # 2026.11.05 -- ansible-lint clean (install-configure-vault#10). Fixes the
      # ssh-conf-server/client includes (.yml -> .yaml; they failed at runtime)
      # and sets explicit modes: generated private key and the init summary
      # (root token, unseal keys) are now 0600; vault.key stays 0644 (read by
      # the container's vault user).
      # 2026.11.06 -- vault.key (and raft client keys) 0600, owned by the
      # container's vault user (vault_container_uid/gid 100:1000) instead of
      # 0644 root; the self-signed path's 777 cert dir is tightened after the
      # deploy (install-configure-vault#12).
      # 2026.11.13 -- trust-store path for RedHat 10 (Rocky/RHEL 10,
      # install-configure-vault#14, stuttgart-things#4489).
      version: 2026.11.13
    - src: https://github.com/stuttgart-things/create-send-webhook.git
      scm: git
      version: 2024.09.06
    - src: https://github.com/stuttgart-things/download-install-binary.git
      scm: git
      version: 2026.10.01
