---
# stuttgart-things/ansible#988 — extends a kind cluster (with cilium
# already installed by the `kind` / `kind_xplane_cluster` plays) into a
# stuttgart-things "machinery" cluster: a vSphere VM builder. Mirrors the
# platform-engineering-showcase Taskfile `profile-machinery`.
#
# Ships two plays:
#   - kind_machinery_profile : opinionated remote form (hosts=all, become,
#     per-task become_user) for driving a target host over SSH.
#   - kind_machinery         : flat/local-testable form (hosts=localhost,
#     connection=local by default, no become) — the exact copy proven
#     end-to-end (failed=0 on a fresh k8s-1.35 labul VM), mirroring
#     plays/kind-machinery-test.yaml.
# Both walk the identical sequence and share var names; pick by execution model.
#
#   cert-manager -> sops-operator + age key -> openebs -> tekton -> crossplane
#   (WAITED: core -> providers -> config -> provider-configs) ->
#   Configuration packages (+ provider-CRD wait) -> EnvironmentConfigs ->
#   tekton-ci namespace -> capabilities (backend=sops-git) ->
#   provider-kubeconfig-vault
#
# Scope note: the package set below is kept at parity with the reference
# machinery cluster (kind1) — reconciled against it on 2026-08-09, which moved
# vspherevm v0.7.0->v0.9.0, proxmoxvm v0.4.0->v0.9.0, packer-release
# v0.2.2->v0.4.2, the ansible chart 0.5.0->0.9.2, proxmoxvm 0.5.0->0.9.2,
# vspherevm 0.12.0->0.12.6 and sops-git-secrets 0.3.0->0.9.0, and added the
# scheduled-run + tofu-run Configurations and the scheduled-run + packer
# capability charts. Everything here now matches what kind1 runs, EXCEPT that
# kind1 carries `platform`, `flux-apps` and `cluster-backup` only as
# hand-applied XRDs rather than as installed Configuration packages — that is
# kind1's gap, not this file's, and a run against it will close it.
#
# HOWEVER — see the "Pin Helm-owned Configurations" task below before running
# this against a cluster that was hand-built. `machinery_packages` is the
# VM/image-builder half;
# `platform_packages` (platform_enabled, default true) is the fleet-manager half
# — cni + Flux + apps pushed onto REMOTE clusters via RemoteCluster-derived
# ClusterProviderConfigs. Set platform_enabled=false for a pure VM builder.
#
# NB: the pins below must stay resolvable against each other — `platform:v0.4.0`
# declares `dependsOn flux-init >=v0.3.0`, so bumping platform without pushing
# the flux-init tag it wants makes the Configuration Unhealthy and the wait task
# fails loudly (by design — a silent skip would leave a half-built cluster).
#
# A RAISED FLOOR DOES NOT PULL AN INSTALLED PACKAGE FORWARD. platform v0.3.8
# requires vault-pki-secrets >=v0.1.5; on a cluster that already has v0.1.4 the
# resolver reports `incompatible dependencies` and stops, and the dependent CR
# has to be patched by hand. Fresh clusters never see it — they resolve the
# newest matching version — so a floor change is only ever felt on existing
# ones. Verified on u26-kind3, 2026-08-14.
#
# The corollary is a rule about what NOT to pin: a package that platform (or
# cluster) reaches via dependsOn must not ALSO be listed in platform_packages.
# Both names would resolve to one ghcr path, and upgrading the short-named CR
# collides the Lock graph — crossplane-configurations#247, which took all 20
# Configurations on u26-kind3 to Healthy=False on 2026-08-12. Pin entry points
# only; let the package manager install the rest under its own CR names.
# The chain now runs one level deeper: `cluster:v0.3.1` declares
# `dependsOn platform >=v0.3.1`, which is why platform is pinned there and not
# at v0.3.0. It also pulls `remote-cluster`, which no other entry installs — so
# that one arrives as a package-manager-named CR rather than a listed pin, and
# is expected to look "extra" in `kubectl get configuration`.
#
# cert-manager is installed by both plays before sops (the sops-secrets-operator
# webhook needs a cert-manager-issued serving cert). The apply is idempotent, so
# it is a fast no-op on a cluster already prepared by kind_xplane_cluster.
#
# Requires on the target host: helmfile, helm, kubectl, kustomize; a reachable
# kind cluster with cilium; SOPS_AGE_KEY exported; the age-encrypted creds blobs
# under {{ secrets_dir }} — one per capability_charts entry per env
# (vsphere-creds-<env>.enc.yaml, proxmox-creds-<env>.enc.yaml) plus
# ansible-credentials.enc.yaml.
#
# NB (containerd 2.x): k8s 1.35 nodes run containerd 2.x, which REJECTS an
# old-format `registry.mirrors` containerdConfigPatch (CRI plugin disabled ->
# kubelet won't start). Ensure the kind role emits no such patch / empty
# registryMirrors. See #988.
playbooks:
  - name: kind_machinery_profile
    play: |
      ---
      - hosts: "{{ target_host | default('all') }}"
        become: true
        gather_facts: false

        pre_tasks:
          - name: Include vars
            ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
            when: path_to_vars_file is defined

        vars:
          # Six tasks below open with `set -euo pipefail`. Ansible's shell
          # module runs /bin/sh, which on Ubuntu is dash — and dash has no
          # pipefail, so those tasks die on line 1 with
          #   /bin/sh: 1: set: Illegal option -o pipefail
          # before reading a single value. Through Tekton this never showed,
          # because the pipeline image supplies its own ansible.cfg; run from
          # the CLI against a plain Ubuntu host it fails every time. Set here
          # so the play is correct however it is invoked.
          ansible_shell_executable: /bin/bash
          ansible_user: sthings
          kind_cluster_name: dev2
          kubeconfig_folder: "/home/{{ ansible_user }}/.kube"
          kubeconfig: "{{ kubeconfig_folder }}/{{ kind_cluster_name }}"

          # --- environment + secrets ---
          # vsphere_envs ist bewusst eine EXPLIZITE Liste und leitet sich nicht
          # mehr aus vsphere_env ab: auf einem Cluster laufen beide vSphere-Envs
          # nebeneinander (je eine vspherevm-Release, Namen vspherevm-<env>).
          # vsphere_env bleibt der "primaere" Env und steuert weiterhin die
          # ansible-Capability (eine Release) und den secrets_dir-Pfad.
          #
          # labda kam am 2026-08-20 dazu. Alles dafuer war schon da — das Chart
          # 0.12.6 traegt den environments.labda-Block, und
          # secrets/vsphere-creds-labda.enc.yaml liegt im secrets-Repo, also
          # genau dort, wo der sops-git-Backend den Pfad ohnehin ableitet. Es
          # fehlte nur die Release. Verifiziert auf kind3 mit einem echten
          # Clone (10.100.136.67, moid vm-45964).
          #
          # labul BLEIBT DRIN, wird aber NICHT MEHR GEPFLEGT: LabUL-vSphere wird
          # in den naechsten Wochen abgeschaltet, der Hypervisor-Fokus im LabUL
          # ist Proxmox. Den labul-Block im Chart (u.a. der Stopgap-Pin auf
          # sthings-u26-previous, cloud-init deaktiviert, stuttgart-things#2432)
          # also nicht mehr reparieren — neue vSphere-Arbeit geht nach labda.
          vsphere_env: labul                                          # labul | labda — primary env (ansible chart, secrets dir)
          vsphere_envs: ["labul", "labda"]                            # one vspherevm capability release per entry
          proxmox_env: labul                                          # only labul creds exist today
          proxmox_envs: ["{{ proxmox_env }}"]                         # one proxmoxvm capability release per entry
          capabilities_enabled: true                                  # false = stop after crossplane
          platform_enabled: true                                      # false = pure VM builder, no cni/Flux/platform
          sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') }}"
          secrets_dir: "/home/{{ ansible_user }}/projects/stuttgart-things/secrets"
          age_key_namespaces: >-
            {{ ['sops-secrets-operator-system'] if sops_global_age_key_enabled | bool
               else ['crossplane-system'] }}

          # --- provider-kubeconfig / Vault-backed RemoteCluster ---
          # Emits the `vault-kubeconfigs` ClusterProviderConfig that RemoteCluster
          # CRs reference, plus the DeploymentRuntimeConfig carrying VAULT_CACERT
          # and the pinned SA name. Without it a machinery cluster can BUILD VMs
          # but cannot adopt the clusters on them, which is half a fleet manager —
          # so it is part of machinery now rather than an opt-in extra.
          #
          # It used to be off by default because it looked like it needed two
          # things supplied by hand: an AppRole role ID (deliberately not
          # committed) and a matching `vault-approle` Secret in
          # crossplane-system. Neither is true on a cluster this play has already
          # set up — `secrets/vault.enc.yaml`, which sops-git materializes into
          # {{ tekton_ci_namespace }}/vault a few tasks earlier, carries
          # VAULT_ROLE_ID and VAULT_SECRET_ID for exactly this AppRole, against
          # exactly the Vault the chart defaults to
          # (https://vault-vsphere.labul.sva.de:8200). Verified by hash against
          # kind1's live release and its crossplane-system/vault-approle on
          # 2026-08-11: both matched.
          #
          # So the deploy task below derives both from that Secret. Set
          # vault_approle_role_id explicitly to override; set
          # sops_git_secrets_enabled=false and supply both by hand to opt out of
          # the derivation entirely.
          vault_kubeconfigs_enabled: true
          vault_approle_role_id: ""
          # The Secret the AppRole is read out of, and the keys in it. Same
          # Secret the Tekton ansible pipeline authenticates with.
          vault_approle_source_secret: vault
          vault_approle_role_id_key: VAULT_ROLE_ID
          vault_approle_secret_id_key: VAULT_SECRET_ID

          # EIN PROVIDER, MEHRERE VAULTS.
          #
          # provider-kubeconfig-vault emittiert eine ClusterProviderConfig je
          # Eintrag; jede braucht eine eigene AppRole — role ID im Manifest,
          # secret-id in einem Secret. Diese Liste sagt, aus welchem
          # tekton-ci-Secret die AppRole abgeleitet wird und wie das dabei
          # entstehende crossplane-system-Secret heisst.
          #
          # Der primaere Vault steht bewusst MIT drin. Bis 2026-08-20 leitete
          # dieser Play nur ihn ab und uebergab auch nur seine role ID;
          # vault-kubeconfigs-infra war deshalb von Hand gesetzt (2026-08-18)
          # und haette den naechsten Lauf nicht ueberlebt. Helm merged Listen
          # naemlich nicht, es ersetzt sie — der infra-Eintrag waere auf
          # roleId="" gefallen und jeder RemoteCluster darueber still
          # kaputtgegangen. Seit Chart 0.2.0 laufen die role IDs ueber die MAP
          # `roleIds`, die sauber merged.
          #
          # Einen Vault dazunehmen = ein Eintrag hier PLUS einer in den
          # additionalVaults des Charts; das Secret in source_secret muss in
          # standalone_sops_secrets stehen, sonst existiert es nie.
          kubeconfig_vaults:
            - provider_config: vault-kubeconfigs
              source_secret: vault
              approle_secret: vault-approle
            - provider_config: vault-kubeconfigs-infra
              source_secret: vault-infra
              approle_secret: vault-approle-infra
            # LabDA, dazu am 2026-08-20 (crossplane-configurations#258). Eigener
            # Vault statt eines LabUL-Vaults, weil LabUL-vSphere abgeschaltet
            # wird und ein LabDA-Cluster seinen kubeconfig nicht in etwas
            # Sterbendem ablegen soll. Vorab geprueft: AppRole-Login OK (Policy
            # superuser), Mount kubeconfigs/ vorhanden, 8200 erreichbar.
            - provider_config: vault-kubeconfigs-labda
              source_secret: vault-labda
              approle_secret: vault-approle-labda
          # The Provider CR the package manager creates for provider-kubeconfig,
          # and the DeploymentRuntimeConfig the chart emits for it. They have to
          # be wired together by hand — see the patch task.
          kubeconfig_provider_name: provider-kubeconfig
          kubeconfig_provider_runtime_config: provider-kubeconfig

          # --- component refs / versions ---
          helm_repo: "git::https://github.com/stuttgart-things/helm.git"
          # From v0.9.0 the ref alone selects the image: semantic-release now
          # writes config/manager/kustomization.yaml before it tags, so the
          # tagged tree pins its own release. Verified by building the bundle:
          # ref=v0.8.5 -> image v0.8.4 (the old off-by-one),
          # ref=v0.9.0 -> image v0.9.0. sops-secrets-operator#86, fixed by #90.
          sops_operator_ref: v0.9.0
          sops_operator_kustomize: "https://github.com/stuttgart-things/sops-secrets-operator/config/default"
          sops_operator_namespace: sops-secrets-operator-system
          sops_operator_overlay_dir: "/home/{{ ansible_user }}/.cache/sops-operator-overlay"
          sops_age_key_data_key: age.agekey
          # v0.9.0 (sops-secrets-operator#47) lets the operator hold one age key
          # for resources that omit spec.decryption.keyRef. Enabling it here does
          # NOT remove the per-namespace copies below: the capability charts
          # still render an explicit keyRef, and a resource's own reference wins
          # over the global default. Groundwork — see the PR.
          sops_global_age_key_enabled: true
          # Derived from the toggle above, driving all three coupled changes so
          # they cannot fall out of sync: the age key ref passed to the charts,
          # and the namespaces the age-key Secret is installed into.
          #   enabled  -> ref "" (charts omit spec.decryption; operator uses its
          #               --global-age-key-secret), key only in the operator ns.
          #   disabled -> ref "sops-age-key" (charts render an explicit keyRef),
          #               key in the namespace every sops-git CR resolves in.
          # Every sops-git SopsSecretManifest is created in crossplane-system
          # (next to the GitRepository), so that is the only per-CR namespace.
          sops_age_key_ref_name: "{{ '' if sops_global_age_key_enabled | bool else 'sops-age-key' }}"
          charts_oci: "oci://ghcr.io/stuttgart-things/charts"
          ansible_chart_version: "0.9.2" # datasource=docker depName=ghcr.io/stuttgart-things/charts/ansible
          # The name the ansible chart gives its Configuration — which is the
          # name `crossplane xpkg install` derives from the image ref, NOT the
          # short `ansible-run`. See the adopt task below for why this matters.
          ansible_run_configuration_name: stuttgart-things-crossplane-configurations-ansible-run
          cluster_backup_chart_version: "0.1.0" # datasource=docker depName=ghcr.io/stuttgart-things/charts/cluster-backup
          scheduled_run_chart_version: "0.2.1" # datasource=docker depName=ghcr.io/stuttgart-things/charts/scheduled-run
          cert_manager_version: 1.21.1 # datasource=github-releases depName=cert-manager/cert-manager
          # The packer capability chart is NOT on OCI — it is installed from a
          # path in the monorepo, like provider-kubeconfig-vault below. Move it
          # to `charts_oci` once `task push-platform-charts` has published it.
          #
          # NB: it lives on the feat/packer-capability-chart branch as of this
          # writing, so until that merges a run needs
          # `-e stuttgart_things_ref=feat/packer-capability-chart`.
          packer_chart_enabled: true

          # Per-environment capability charts. One Helm release per entry in
          # `envs`, named `<chart>-<env>`, credentials read from
          # <secrets_dir>/<credentials_prefix>-<env>.enc.yaml. Every chart here
          # follows the same shape: `--set environment=<env>` selects the
          # placement block, `<backend_key>=sops` picks the sops backend (kind
          # clusters have no Vault/ESO), and the Configuration package itself is
          # skipped because `configuration_packages` above installs it.
          # Add a hypervisor by adding an entry — no new task.
          capability_charts:
            # sops-git: the chart derives the path as secrets/<name>.enc.yaml,
            # i.e. secrets/vsphere-creds-<env>.enc.yaml — exactly where the
            # blobs already live in the repo. No credentials_key: the operator
            # fetches the file, nothing is passed in at deploy time.
            - chart: vspherevm
              version: "0.12.6"
              envs: "{{ vsphere_envs }}"
              credentials_prefix: vsphere-creds
              backend_key: secretStore.backend
              backend: sops-git
              # Set from the play var on the command line rather than inside
              # extra_set: a {{ }} nested in a var value is not reliably
              # re-templated, and it rendered literally when checked.
              repository_ref_key: secretStore.sopsGit.repositoryRef.name
              # Emptied to "" when the global age key is on, which omits
              # spec.decryption so --global-age-key-secret is used instead.
              age_key_ref_key: secretStore.sopsGit.ageKeySecret.name
              extra_set:
                - configuration.install=false
            # Same sops-git treatment as vspherevm above. kind1 already ran
            # 0.4.0 on this backend (installed by hand during the live test)
            # while this file still said 0.3.0 + sops, so a playbook run used
            # to downgrade it and revert it to the embedded blob.
            # 0.10.0, NOT 0.9.2 — and 0.9.2 must not be reintroduced here.
            # stuttgart-things#2483 added `cloneDatastore: V5010-01-1` to
            # environments.labul without bumping Chart.yaml, so the registry's
            # 0.9.2 and the monorepo's 0.9.2 became two different charts: a run
            # against the published one silently produced an EnvironmentConfig
            # with no cloneDatastore, and under the DD-sthings ACL every LabUL
            # clone then 403s unless each XR restates the field. 0.10.0 is the
            # first published version whose content matches the tree (pushed
            # 2026-08-11 alongside this bump); 0.9.2 was deliberately left in
            # place rather than overwritten, so clusters already on it are
            # unchanged. Found on u26-kind3.
            - chart: proxmoxvm
              version: "0.10.0"
              envs: "{{ proxmox_envs }}"
              credentials_prefix: proxmox-creds
              backend_key: secretStore.backend
              backend: sops-git
              repository_ref_key: secretStore.sopsGit.repositoryRef.name
              # Emptied to "" when the global age key is on, which omits
              # spec.decryption so --global-age-key-secret is used instead.
              age_key_ref_key: secretStore.sopsGit.ageKeySecret.name
              extra_set:
                - configuration.install=false

          # The kubeconfig-vault chart is not published to OCI — it is installed
          # from a path in the stuttgart-things monorepo.
          # --- git-sourced sops credentials (backend=sops-git) ---
          # Capability charts on this backend read their encrypted credentials
          # straight from the repo instead of having the blob embedded at deploy
          # time, so rotating a credential is a git push rather than a playbook
          # run. Needs one GitRepository + read-only credential per cluster,
          # from the sops-git-secrets baseline chart. That chart is NOT on OCI,
          # so it is cloned — same as provider-kubeconfig-vault below.
          sops_git_secrets_enabled: true
          sops_git_repository_name: sops-secrets
          sops_git_username: stuttgart-things
          # Read-only token with access to stuttgart_things_repo. Never commit.
          sops_git_token: "{{ lookup('env', 'SOPS_GIT_TOKEN') }}"
          # sops-git-secrets is published to OCI (stuttgart-things#2407/#2408); install
          # from there rather than cloning the private monorepo for its chart source.
          sops_git_secrets_chart_version: "0.9.0" # datasource=docker depName=ghcr.io/stuttgart-things/charts/sops-git-secrets
          # Encrypted blobs in the secrets repo with no capability chart of
          # their own — the capability charts each emit their own
          # SopsSecretManifest, this list covers the rest. Both were applied by
          # hand before they had an owner (stuttgart-things#2407).
          # `namespace` is where the SECRET is written; the CR itself always
          # goes next to the GitRepository, because the operator resolves
          # sourceRef only within the CR's own namespace.
          standalone_sops_secrets:
            - name: vault
              namespace: tekton-ci
            # Quellen fuer die AppRoles der weiteren kubeconfig-Vaults,
            # siehe kubeconfig_vaults oben. Ohne diese beiden Eintraege
            # existieren die Secrets nicht und der Derive-Task bricht ab.
            - name: vault-infra
              namespace: tekton-ci
            - name: vault-labda
              namespace: tekton-ci
            - name: dapr-backstage-template-execution-vars
              namespace: flux-system
            # ghcr push credential for the cluster-backup CronJob. Lands in
            # crossplane-system (cluster-backup's default spec.namespace), as a
            # kubernetes.io/dockerconfigjson Secret - the type is carried in the
            # encrypted manifest, so the operator materializes it as-is.
            - name: backup-registry
              namespace: crossplane-system
            # AppRole a TofuRun authenticates to Vault with, as TF_VAR_* keys.
            # NOT the same credential as the `vault` Secret above — a different
            # AppRole entirely (verified by hash), which is why it needs its own
            # blob. It was hand-applied on kind1 and existed nowhere else until
            # stuttgart-things committed secrets/terraform-credentials.enc.yaml
            # while retiring that cluster; without this entry a machinery
            # cluster can render a TofuRun but not authenticate it.
            - name: terraform-credentials
              namespace: tekton-ci
            # git credential the packer pipelines clone the packer repo with
            # (.git-credentials + .gitconfig). Required now that
            # packer_chart_enabled is on by default — the capability chart names
            # this Secret but creates nothing, so without it a PackerBuild fails
            # at the clone. Same token as sops-git-credentials, but the packer
            # task consumes it in git's own file format rather than as a value.
            - name: packer-git-basicauth
              namespace: tekton-ci

          stuttgart_things_repo: "https://github.com/stuttgart-things/stuttgart-things.git"
          stuttgart_things_ref: main
          # Shallow checkout shared by every chart that is not on OCI (packer,
          # provider-kubeconfig-vault). Cloned once, when either needs it.
          stuttgart_things_checkout: "/tmp/stuttgart-things-baseline"
          # The PipelineRun namespace. Both packer pipelines run here, and it is
          # where the packer CA bundle and the tekton-ci sops Secrets must land —
          # Tekton resolves them in the namespace the run executes in, not the
          # XR's. `helm --create-namespace` only ever creates the RELEASE
          # namespace (crossplane-system), so this one needs creating explicitly.
          tekton_ci_namespace: tekton-ci

          # EnvironmentConfigs for capabilities that have no chart of their own
          # ship as examples/ inside crossplane-configurations, so they are
          # applied straight from git. The vspherevm/proxmoxvm/ansible-run/
          # packer/scheduled-run/cluster-backup ones come from the capability
          # charts instead and are deliberately absent here.
          crossplane_configurations_raw: "https://raw.githubusercontent.com/stuttgart-things/crossplane-configurations"
          crossplane_configurations_ref: main
          environment_config_manifests:
            - machinery/vsphere-vm/examples/environmentconfig.yaml
            - cicd/tofu-run/examples/environmentconfig.yaml
            # cluster-backup's EnvironmentConfig comes from its capability chart
            # (deployed below), not applied raw — it also carries the provider RBAC.
            # Same for scheduled-run (scheduled-run-defaults).
            #
            # The packer ones USED to be applied from
            # cicd/packer-{build,release}/examples/ here. They are now emitted by
            # the packer capability chart, under the same names
            # (packer-build-defaults, packer-release-defaults) plus
            # packer-release-labda. Applying the upstream examples as well would
            # overwrite the chart's values — reverting pipelineRevision to the
            # example's pin and dropping the Proxmox promotion target — so both
            # lines are deliberately gone rather than merely commented out.
          platform_environment_config_manifests:
            - bootstrap/flux-init/examples/environment-config.yaml
            - bootstrap/flux-apps/examples/environment-config.yaml

          # Cluster-scoped RBAC that a Configuration documents as a PRECONDITION
          # but cannot ship — a package installs CRDs and Compositions, never
          # ClusterRoleBindings. Pulled from the repo rather than inlined so the
          # rules stay in one place; the file's own header explains each one.
          #
          # remote-cluster (via `cluster`) needs two, and both were found by a
          # wedged live build on u26-kind3, 2026-08-12:
          #
          #   create remoteclusters — RemoteClusters were always applied by hand
          #   before, so provider-kubernetes only ever had to READ them.
          #
          #   patch clusterproviderconfigs.helm.m — needed even though the Object
          #   that touches them is Observe-only. The provider computes desired
          #   state with a DRY-RUN server-side apply, which the API server
          #   authorizes exactly like a real write.
          #
          # THE SECOND ONE FAILS DECEPTIVELY. status.ready goes true and
          # status.share fills in with the endpoint and serverVersion (both come
          # from the RemoteCluster, which is fine) while only Crossplane's own
          # Ready condition stays False on "Unready resources: observe-helm". A
          # ClusterStack looks finished and is not.
          platform_rbac_manifests:
            - bootstrap/remote-cluster/examples/rbac.yaml
            # Lets the provider-kubernetes SA observe RemoteClusters and manage
            # IPReservations, which is what an ip-reservation child XR (enabled
            # via spec.ipReservation on a Platform) reconciles through.
            #
            # MERGE ORDER: needs crossplane-configurations#251, which changed
            # this file's binding from a literally-named ServiceAccount (with an
            # XXXXXXXXXXXX hash placeholder) to the group
            # `system:serviceaccounts:crossplane-system`. These manifests are
            # fetched raw from `crossplane_configurations_ref` (main) at run
            # time, so merging this play first would apply a binding to a
            # subject that does not exist — and RBAC does not validate subjects,
            # so it would look like it worked.
            - bootstrap/ip-reservation/examples/rbac.yaml

          # Providers that no Configuration carries. Every other provider on a
          # machinery cluster arrives through some Configuration's dependsOn —
          # provider-clusterbook does not, because ip-reservation classes it
          # (and provider-kubeconfig) as a fleet cluster precondition rather
          # than a package dep. Without it, `spec.ipReservation.enabled: true`
          # on a Platform XR has its XRD (platform v0.3.3 pulls ip-reservation)
          # but no controller to reconcile the IPReservation it composes.
          #
          # Gated on platform_enabled with the rest of the fleet-manager half:
          # a pure VM builder composes no Platform and needs none of it.
          provider_packages:
            - name: provider-clusterbook
              package: "ghcr.io/stuttgart-things/provider-clusterbook-xpkg:v0.4.2"
              provider_crd: clusterproviderconfigs.clusterbook.stuttgart-things.com

          # Machinery half: VM + image builders. Each pulls its provider via
          # dependsOn. `provider_crd` is the CRD that provider registers — waited
          # on so the capability charts can reference it; omit when the package
          # pulls no provider beyond the ones already waited on above.
          # ansible-run is NOT listed: vspherevm and proxmoxvm both pull it.
          machinery_packages:
            # v0.9.1 reicht den environmentConfig an den Ansible-Teil durch statt
            # Defaults zu raten — derselbe Fix wie bei proxmoxvm v0.12.1 unten,
            # beide aus crossplane-configurations#320.
            #
            # v0.9.2 NIMMT GENAU DAS WIEDER ZURUECK, und zwar absichtlich. Der
            # Durchreicher aus #317/#320 war ein Fehlschluss: spec.environmentConfig
            # benennt eine HYPERVISOR-Env (labul, labda) und wird gegen das
            # vspherevm-Label aufgeloest — ansible-run loest sein EIGENES Label auf,
            # und dort existiert im Fleet nur `default` (ansible-run-defaults).
            # Der Forward matchte also nichts und liess JEDEN ansible-run-Default
            # still fallen, ansibleExtraCollections eingeschlossen; das Playbook
            # lief dann gegen die Collection, die zufaellig im Working-Image steckt.
            #
            # Gefunden auf kind3 (2026-08-20) beim ersten LabDA-Build:
            # sthings.baseos.setup starb nach ok=70 in install_configure_vault mit
            # "dict object has no element 26" — obwohl das gepinnte Release
            # sthings-baseos-26.730.1176 den Ubuntu-26-Key laengst hat. Der echte
            # Hinweis stand im Step-Log: "No collections directory found".
            #
            # Ab v0.9.2 bleibt der Default `default` stehen; wer eine
            # ansible-run-<env> hat, waehlt sie ueber spec.ansible.environmentConfig.
            # crossplane-configurations#347.
            - name: vspherevm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/vspherevm:v0.9.2"
              provider_crd: clusterproviderconfigs.vspherevm.m.stuttgart-things.com
            # v0.10.0 added spec.vm.cloneDatastore, v0.11.0 its `none` opt-out
            # sentinel. NOT optional for LabUL: both base-OS templates keep their
            # disk on the NFS store DD-sthings, whose ACL lost
            # Datastore.AllocateSpace in early 2026-08, so a clone that cannot
            # name a target datastore 403s. Below v0.10.0 the XRD has no such
            # field at all — a cluster built on v0.9.0 cannot provision a LabUL
            # Proxmox VM, which is not obvious because every Configuration still
            # reports Healthy. Raised from v0.9.0 after u26-kind3 (2026-08-11).
            #
            # v0.12.0 splits the template's node from the VM's: a clone source
            # living on one Proxmox node no longer forces the new VM onto that
            # same node (spec.vm.templateNode).
            #
            # v0.12.1 reicht den environmentConfig an den Ansible-Teil durch,
            # statt Defaults zu raten: die VM-Configurations lasen ihre gemeinsamen
            # Ansible-Werte aus einem `ansible`-Unterblock ihres EIGENEN
            # EnvironmentConfig, den kein Cluster traegt. `_env?.ansible` war also
            # immer {} und jeder Wert fiel auf einen hartkodierten Fallback durch —
            # der dann als expliziter Spec-Wert in der komponierten AnsibleRun
            # landete (crossplane-configurations#317/#320).
            #
            # v0.12.2 nimmt den environmentConfig-Durchreicher wieder heraus —
            # dieselbe Korrektur wie vspherevm v0.9.2 oben, gleiche Begruendung.
            # crossplane-configurations#347.
            - name: proxmoxvm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/proxmoxvm:v0.12.2"
              provider_crd: clusterproviderconfigs.proxmoxbpg.m.crossplane.io
            # Tekton-backed Packer builder — only provider-kubernetes, already up.
            - name: packer-build
              package: "ghcr.io/stuttgart-things/crossplane-configurations/packer-build:v0.4.1"
            # Build -> test -> promote. Its dependsOn floor of packer-build
            # >=v0.3.0 is why the pin above had to move: against v0.2.0 the
            # promotion gate reads a `template-name` result that older
            # packer-build does not surface, so the XR sits in phase=Building
            # behind a successful build with no error. Pulls vm-provision
            # (-> vsphere-vm, proxmox-vm, ansible-run) transitively; needs no
            # provider beyond the ones already waited on above.
            #
            # v0.4.2 dropped the XRD's `default: vault` on
            # promote.vaultSecretName. Below that tag the default is
            # materialized into every new object and beats the
            # EnvironmentConfig, so the `vaultSecretName: vault-labda` the
            # packer chart sets for LabDA is dead config and a LabDA promotion
            # has to restate it on the XR (crossplane-configurations#225).
            - name: packer-release
              package: "ghcr.io/stuttgart-things/crossplane-configurations/packer-release:v0.4.2"
            # Scheduled encrypted state export to an OCI registry. Only
            # provider-kubernetes (already up), like the packer packages, so no
            # provider_crd wait. Installing the package + its EnvironmentConfig
            # makes the capability available; a running backup additionally
            # needs the backup-registry push Secret and, on a scoped provider
            # SA, the provider-kubernetes RBAC from the Configuration's README
            # (fleet GitOps, same place as provider-kubernetes-flux) - neither
            # is required just to install this.
            - name: cluster-backup
              package: "ghcr.io/stuttgart-things/crossplane-configurations/cluster-backup:v0.1.0"
            # Cron-driven re-apply of an arbitrary XR (an AnsibleRun, a
            # PackerBuild). Only provider-kubernetes, so no provider_crd wait.
            # Its EnvironmentConfig comes from the scheduled-run capability
            # chart deployed below, not from the raw examples.
            - name: scheduled-run
              package: "ghcr.io/stuttgart-things/crossplane-configurations/scheduled-run:v0.1.1"
            # Runs a tofu module as a Workspace. Pulls provider-opentofu, which
            # the packer-release test VM also needs at RUN time — but nothing
            # installed here consumes its CRD at apply time, so no wait.
            - name: tofu-run
              package: "ghcr.io/stuttgart-things/crossplane-configurations/tofu-run:v0.1.0"
            # Harvester / KubeVirt VMs. Third hypervisor next to vSphere and
            # Proxmox — crossplane-configurations#258 Block B wants a ClusterStack
            # to be able to build on it, and that starts with the Configuration
            # being on the cluster at all.
            #
            # NO provider_crd, and that is not an oversight: harvester-vm renders
            # a KubeVirt VirtualMachine through provider-kubernetes, which is
            # already waited on above. It registers no provider of its own.
            #
            # volume-claim (root-disk PVC), cloud-config (cloud-init Secret) and
            # ansible-run arrive through dependsOn and are deliberately NOT listed
            # here — same reason as flux-apps below: the same ghcr path under both
            # a short CR name and a dependsOn is the Lock collision from
            # crossplane-configurations#247.
            - name: harvester-vm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/harvester-vm:v0.1.9"

          # Fleet-manager half. `platform` pulls cni, flux-init, flux-apps and
          # — from v0.3.3 — ip-reservation, vault-auth and vault-pki-secrets
          # via dependsOn. Only the entry points are pinned here; everything
          # reachable through dependsOn deliberately is not (see below).
          platform_packages:
            # v0.3.1 is a FLOOR, not a preference: `cluster` below declares
            # dependsOn platform >=v0.3.1, so leaving this at v0.3.0 makes the
            # cluster Configuration unresolvable and the wait task fails.
            #
            # v0.3.3 additionally declares ip-reservation, vault-auth and
            # vault-pki-secrets (crossplane-configurations#250); v0.3.8 adds
            # substitution discovery, the wildcard certificate, and a
            # vault-pki-secrets floor of >=v0.1.5 — see the floor note below. Those back
            # `spec.ipReservation` / `spec.vaultIssuer` on a Platform XR, which
            # before that composed child XRs whose XRDs were on no cluster. They
            # arrive transitively — do NOT add them here, see below.
            #
            # v0.3.15 carries seven more, and the floors above are unchanged:
            #   v0.3.9-.11  headlamp + the machinery service reach the catalog
            #   v0.3.12     external-secrets, nfs-csi and vault join it
            #   v0.3.13     a cluster discovers its OWN Vault k8s-auth mount
            #               instead of being told the name by hand
            #   v0.3.14     the misleading ESO defaults became required
            #   v0.3.15     a required substitution variable that the platform
            #               can still DISCOVER defers its component instead of
            #               aborting the whole render — enabling an auth and the
            #               app that reads it in one step used to deadlock
            #               (crossplane-configurations#277)
            #   v0.3.16     declares that deferral's status field in the XRD.
            #               v0.3.15 shipped it only in the module, and an
            #               undeclared status field is not pruned — it fails the
            #               whole status apply and with it every compose, while
            #               Ready stays True on the last good result. Do not run
            #               v0.3.15 anywhere.
            #   v0.4.0      BREAKING: additionalAuths[].policies no longer takes
            #               free-form HCL (`rules`); the body is built from
            #               kvMount + read. Nothing here declared rules. Also
            #               adds the PENDING printer column.
            #   v0.6.0-.2   vaultIssuer WAITS for cert-manager instead of racing
            #               it. ClusterIssuer, PKI secret and tokenrequest RBAC
            #               are held back until the cert-manager webhook's
            #               Endpoints on the TARGET carry an address — which
            #               happens only once the pod is ready AND the Service
            #               selects it. Before that the ClusterIssuer was applied
            #               against a webhook that was not serving yet and stuck.
            #               On a cluster where ArgoCD installs cert-manager that
            #               is the NORMAL ordering, not an edge case.
            #               v0.6.1 declares certManagerReady and
            #               waitingForCertManager in the XRD — v0.6.0 computed
            #               them and the API server dropped them silently, so the
            #               gate was invisible from outside. Same trap as v0.3.15.
            #               v0.6.2 observes Endpoints instead of a Deployment: a
            #               metadata-only Deployment fails `kubeconform -strict`
            #               in the verify pipeline, and Endpoints is the stronger
            #               signal anyway.
            #               Floors unchanged (vault-pki-secrets >=v0.1.5), so this
            #               is NOT the "raised floor" case above.
            - name: platform
              package: "ghcr.io/stuttgart-things/crossplane-configurations/platform:v0.6.2"
            # flux-apps is NOT listed. platform has declared the dependency
            # since v0.3.1, so an explicit pin would put the same ghcr path
            # under both a short CR name (this play) and a dependsOn — which is
            # the Lock collision from crossplane-configurations#247: upgrading
            # the short-named CR briefly drops its Lock entry, the resolver
            # auto-installs a long-named duplicate of the identical source, and
            # every package on the cluster goes Healthy=False. That is exactly
            # what a flux-apps upgrade did to all 20 Configurations on u26-kind3
            # on 2026-08-12.
            #
            # So it arrives as a package-manager-named CR, same as
            # remote-cluster below, and is expected to look "extra" in
            # `kubectl get configuration`. The version follows platform's
            # `>=v0.1.2` rather than a pin here. Same reasoning for the three
            # Configurations v0.3.3 added.
            # Builds a WHOLE CLUSTER from one namespaced ClusterStack XR: VM ->
            # base-OS -> distribution -> kubeconfig upload -> ClusterAccess ->
            # Platform. Last in the list because it depends on platform above,
            # and it also pulls remote-cluster, which nothing else installs.
            #
            # Proven end to end on u26-kind3 -> Proxmox LabUL, 2026-08-12: a
            # six-line XR produced u26-rke2-1, v1.35.1+rke2r1 Ready with cilium,
            # reachable through the ClusterProviderConfigs it emitted.
            #
            # NEEDS platform_rbac_manifests, applied below. Without it the build
            # runs all three ansible stages green and then wedges at the access
            # stage — see the deceptive-failure note there.
            #
            # NEVER lower this pin. `kubectl apply` walks a Configuration
            # BACKWARDS without complaint, so a pin that trails the fleet is not
            # a no-op on an existing cluster, it is a silent downgrade — the same
            # failure mode CLAUDE.md records for examples/functions.yaml, here
            # aimed at the Configuration that builds whole clusters. Check the
            # fleet before touching it.
            #
            # v0.4.0 lets a ClusterStack build a control plane of its own and
            # declares management-plane >=v0.2.0, which therefore arrives
            # transitively — do NOT add it to this list.
            # That management-plane floor is unchanged in v0.5.0, so a fresh
            # cluster still resolves the newest one (v0.3.1 at time of writing).
            #
            # v0.5.0 DERIVES kubeconfig.providerConfigRef from
            # kubeconfig.vaultSecretName instead of defaulting it separately. The
            # two name the same Vault — one says where the kubeconfig is uploaded,
            # the other where it is read back — and nothing enforced that: the old
            # defaults `vault` / `vault-kubeconfigs` agreed only by accident.
            # Setting vaultSecretName to vault-infra, which the ArgoCD path
            # requires, sent the read to the OTHER Vault and the RemoteCluster
            # failed with `secret not found`. Nothing above it reported an error —
            # the ClusterStack stayed Ready=True, because without a ready
            # ClusterAccess the Platform branch is never emitted and there is
            # nothing left to wait for. Forty minutes to find
            # (crossplane-configurations#336, argoplatform-test2 2026-08-19).
            # The XRD now also rejects the two known crossed pairs at apply time.
            - name: cluster
              package: "ghcr.io/stuttgart-things/crossplane-configurations/cluster:v0.5.0"

          configuration_packages: >-
            {{ machinery_packages
               + (platform_packages if platform_enabled | bool else []) }}

          # Storage + CI helmfiles (no strict inter-step waits needed here).
          # The openebs chart ships an observability stack on by default — a Loki
          # StatefulSet, the MinIO StatefulSet backing it, an Alloy DaemonSet and
          # two extra StorageClasses. A machinery cluster is a kind cluster and
          # wants none of it, and on a 1+2 kind cluster it cannot even run: Loki
          # asks for three replicas with pod anti-affinity, the two workers take
          # replicas 1 and 2, the control-plane node is tainted, and replica 0
          # stays Pending forever. Set either to true to get it back.
          #
          # MinIO has no toggle of its own — it is Loki's object store, so
          # disabling Loki is what removes it. Alloy goes with it because a log
          # shipper with no Loki ships logs at nothing. openebs-hostpath, the
          # StorageClass everything here actually uses, is unaffected.
          #
          # Needs stuttgart-things/helm#155 for the state values to exist; on an
          # older helmfile they are simply ignored and the stack stays up.
          openebs_loki_enabled: false
          openebs_alloy_enabled: false

          # `location` plus optional `state_values` (a dict rendered into
          # --state-values-set). A plain string still works.
          pre_crossplane_helmfiles:
            - location: "{{ helm_repo }}@infra/openebs.yaml.gotmpl"
              state_values:
                openebs_loki_enabled: "{{ openebs_loki_enabled | lower }}"
                openebs_alloy_enabled: "{{ openebs_alloy_enabled | lower }}"
            - location: "{{ helm_repo }}@cicd/tekton.yaml.gotmpl"

        tasks:
          # ================================================================
          # 0) PREFLIGHT — fail fast on a missing age key or unreachable cluster.
          # ================================================================
          - name: Preflight — SOPS_AGE_KEY present
            ansible.builtin.assert:
              that:
                - sops_age_key | length > 0
              fail_msg: "export SOPS_AGE_KEY before running (age private key)."

          - name: Preflight — git token present when sops-git credentials are enabled
            ansible.builtin.assert:
              that:
                - sops_git_token | length > 0
              fail_msg: >-
                export SOPS_GIT_TOKEN before running (read-only token for
                stuttgart_things_repo), or set sops_git_secrets_enabled=false.
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool

          # The role ID may be given explicitly OR derived from the sops-git
          # `vault` Secret (see the vars block). One of the two must be possible,
          # so this only fails on the combination that leaves neither.
          - name: Preflight — an AppRole source exists when kubeconfig-vault is enabled
            ansible.builtin.assert:
              that:
                - vault_approle_role_id | length > 0 or (sops_git_secrets_enabled | bool and capabilities_enabled | bool)
              fail_msg: >-
                vault_kubeconfigs_enabled=true needs either an explicit
                vault_approle_role_id, or sops-git enabled so the AppRole can be
                read from {{ tekton_ci_namespace }}/{{ vault_approle_source_secret }}.
            when: vault_kubeconfigs_enabled | bool

          - name: Preflight — cluster reachable
            ansible.builtin.command: "kubectl get nodes --kubeconfig {{ kubeconfig }}"
            become_user: "{{ ansible_user }}"
            changed_when: false

          # ================================================================
          # 1) SECRETS LAYER — cert-manager (sops webhook serving-cert
          #    dependency), then sops-secrets-operator + age key.
          # ================================================================
          - name: Ensure cert-manager (sops-secrets-operator webhook dependency)
            ansible.builtin.shell: |
              kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml --kubeconfig {{ kubeconfig }}
              for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
                kubectl -n cert-manager rollout status deploy/$d --timeout=180s --kubeconfig {{ kubeconfig }}
              done
              for i in $(seq 1 30); do
                echo '{"apiVersion":"cert-manager.io/v1","kind":"Issuer","metadata":{"name":"cm-webhook-probe","namespace":"kube-system"},"spec":{"selfSigned":{}}}' | kubectl apply --dry-run=server --kubeconfig {{ kubeconfig }} -f - >/dev/null 2>&1 && break
                sleep 5
              done
            become_user: "{{ ansible_user }}"

          # Deployed through a thin local overlay rather than `apply -k <remote>`
          # directly, so the manager's flags are part of the applied desired
          # state. A `kubectl patch` after the apply would be undone by the next
          # run — the same post-hoc mutation this playbook just dropped for the
          # image pin (#1018).
          - name: Create the sops-secrets-operator overlay dir
            ansible.builtin.file:
              path: "{{ sops_operator_overlay_dir }}"
              state: directory
              mode: "0755"
            become_user: "{{ ansible_user }}"

          - name: Render the sops-secrets-operator kustomize overlay
            ansible.builtin.copy:
              dest: "{{ sops_operator_overlay_dir }}/kustomization.yaml"
              mode: "0644"
              content: |
                ---
                resources:
                  - {{ sops_operator_kustomize }}?ref={{ sops_operator_ref }}
                {% if sops_global_age_key_enabled | bool %}
                patches:
                  - target:
                      kind: Deployment
                      name: sops-secrets-operator-controller-manager
                    patch: |-
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-secret={{ sops_operator_namespace }}/sops-age-key
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-data-key={{ sops_age_key_data_key }}
                {% endif %}
            become_user: "{{ ansible_user }}"

          - name: Deploy sops-secrets-operator (kustomize)
            ansible.builtin.command: >
              kubectl apply -k {{ sops_operator_overlay_dir }}
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          - name: Wait for sops-secrets-operator controller rollout
            ansible.builtin.command: >
              kubectl -n sops-secrets-operator-system rollout status deployment --timeout=180s
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          - name: Install the sops age-key Secret into each consumer namespace
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              kubectl -n {{ item }} create secret generic sops-age-key \
                --from-literal=age.agekey='{{ sops_age_key }}' \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            become_user: "{{ ansible_user }}"
            loop: "{{ age_key_namespaces }}"
            no_log: true    # never echo the age private key

          # ================================================================
          # 2) STORAGE + CI — openebs, tekton (via remote helmfiles).
          # ================================================================
          - name: Clear helmfile git cache
            ansible.builtin.file:
              path: "/home/{{ ansible_user }}/.cache/helmfile/states/https_github_com_stuttgart-things_helm_git"
              state: absent
            become_user: "{{ ansible_user }}"

          # `item` may be a plain location string or a dict with an optional
          # `state_values` map; both shapes are accepted so a caller overriding
          # this list with strings keeps working.
          - name: Apply openebs + tekton helmfiles
            ansible.builtin.shell: |
              helmfile init --force
              helmfile apply -f {{ item.location | default(item) }} \
                {% if item.state_values is defined %}--state-values-set {% for k, v in item.state_values.items() %}{{ k }}={{ v }}{{ "," if not loop.last }}{% endfor %} \
                {% endif %}--kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            loop: "{{ pre_crossplane_helmfiles }}"
            loop_control:
              label: "{{ item.location | default(item) }}"

          - name: Wait for TektonPipeline Ready
            ansible.builtin.shell: |
              kubectl -n tekton-operator rollout status deploy/tekton-operator --timeout=180s --kubeconfig {{ kubeconfig }}
              for i in $(seq 1 60); do kubectl get tektonpipeline pipeline --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait tektonpipeline --all --for=condition=Ready --timeout=300s --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          # ================================================================
          # 3) CROSSPLANE — WAITED ordering (avoids the pkg CRD race + the
          #    function-auto-ready duplicate-lock-node collision).
          #    core -> rollout -> providers -> Healthy -> config -> Healthy
          #    -> (transitive kubernetes.m CRD) -> provider-configs.
          # ================================================================
          - name: Crossplane core
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl -n crossplane-system rollout status deploy/crossplane --timeout=180s --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          - name: Crossplane providers (+ RBAC) and wait Healthy
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-providers.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl wait provider.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          - name: Crossplane functions + configurations and wait Healthy
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-config.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl wait configuration.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              kubectl wait function.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          - name: Wait for transitive provider-kubernetes CRD, then provider-configs
            ansible.builtin.shell: |
              for i in $(seq 1 60); do kubectl get crd clusterproviderconfigs.kubernetes.m.crossplane.io --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-provider-configs.yaml.gotmpl --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"

          # ================================================================
          # 4) CROSSPLANE CONFIG — install the capability Configuration
          #    packages (each pulls its provider via dependsOn) and wait for
          #    the ClusterProviderConfig CRD before capabilities.
          # ================================================================
          # Providers with no Configuration to carry them (see provider_packages).
          # Applied before the Configurations so their CRDs are established by
          # the time a Configuration composes against them.
          - name: Install standalone Provider packages
            ansible.builtin.shell: |
              cat <<'EOF' | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: {{ item.name }}
              spec:
                package: {{ item.package }}
              EOF
            become_user: "{{ ansible_user }}"
            loop: "{{ provider_packages }}"
            loop_control:
              label: "{{ item.name }}"
            when: platform_enabled | bool

          - name: Wait standalone Providers Healthy + CRD established
            ansible.builtin.shell: |
              kubectl wait provider.pkg.crossplane.io/{{ item.name }} --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              {% if item.provider_crd is defined %}
              for i in $(seq 1 60); do kubectl get crd {{ item.provider_crd }} --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait --for=condition=established crd/{{ item.provider_crd }} --timeout=180s --kubeconfig {{ kubeconfig }}
              {% endif %}
            become_user: "{{ ansible_user }}"
            loop: "{{ provider_packages }}"
            loop_control:
              label: "{{ item.name }}"
            when: platform_enabled | bool

          - name: Install Configuration packages
            ansible.builtin.shell: |
              cat <<'EOF' | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              apiVersion: pkg.crossplane.io/v1
              kind: Configuration
              metadata:
                name: {{ item.name }}
              spec:
                package: {{ item.package }}
              EOF
            become_user: "{{ ansible_user }}"
            loop: "{{ configuration_packages }}"
            loop_control:
              label: "{{ item.name }}"

          - name: Wait Configuration Healthy + provider CRD established
            ansible.builtin.shell: |
              kubectl wait configuration.pkg.crossplane.io/{{ item.name }} --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              {% if item.provider_crd is defined %}
              for i in $(seq 1 60); do kubectl get crd {{ item.provider_crd }} --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait --for=condition=established crd/{{ item.provider_crd }} --timeout=180s --kubeconfig {{ kubeconfig }}
              {% endif %}
            become_user: "{{ ansible_user }}"
            loop: "{{ configuration_packages }}"
            loop_control:
              label: "{{ item.name }}"

          - name: Apply EnvironmentConfigs shipped as crossplane-configurations examples
            ansible.builtin.command: >
              kubectl apply --kubeconfig {{ kubeconfig }}
              -f {{ crossplane_configurations_raw }}/{{ crossplane_configurations_ref }}/{{ item }}
            become_user: "{{ ansible_user }}"
            loop: >-
              {{ environment_config_manifests
                 + (platform_environment_config_manifests if platform_enabled | bool else []) }}

          # Same fetch-and-apply shape as the EnvironmentConfigs above, kept a
          # separate task because it is gated differently: these are cluster-
          # scoped RBAC objects, so they exist only for the fleet-manager half.
          # A pure VM builder (platform_enabled=false) installs no Configuration
          # that composes a RemoteCluster and needs none of it.
          - name: Apply cluster-scoped RBAC the platform Configurations require
            ansible.builtin.command: >
              kubectl apply --kubeconfig {{ kubeconfig }}
              -f {{ crossplane_configurations_raw }}/{{ crossplane_configurations_ref }}/{{ item }}
            become_user: "{{ ansible_user }}"
            loop: "{{ platform_rbac_manifests }}"
            when: platform_enabled | bool

          # ================================================================
          # 5) CAPABILITIES — the per-environment hypervisor charts from
          #    `capability_charts` (vspherevm, proxmoxvm — one release per env),
          #    then ansible, which is env-independent and keeps its own task
          #    because it is a single release with different value paths
          #    (sshCredentials.*) and an un-suffixed credentials file.
          # ================================================================
          # A cluster built by hand may have its Configurations owned by the
          # capability RELEASES rather than kubectl-applied — kind1 does, because
          # each was installed incrementally with configuration.install left at
          # its default. This play installs them itself and then deploys those
          # same charts with the Configuration switched OFF, which drops the
          # object from the release manifest, and a plain `helm upgrade` DELETES
          # what a release stops rendering. That would take the XRDs and every XR
          # under them with it.
          #
          # `helm.sh/resource-policy: keep` is read only by Helm, so applying it
          # to every Configuration is a no-op on the ones this play applied
          # itself. The tradeoff is that a genuine `helm uninstall` now leaves the
          # Configuration behind — the right default for a package that owns
          # XRDs. Must run BEFORE the first capability chart.
          - name: Pin Configurations against deletion by a capability-chart upgrade
            ansible.builtin.command: >
              kubectl annotate configuration.pkg.crossplane.io --all
              helm.sh/resource-policy=keep --overwrite
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          - name: Ensure the tekton-ci namespace
            ansible.builtin.shell: |
              kubectl create namespace {{ tekton_ci_namespace }} \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          # The GitRepository + read-only credential the sops-git backend reads
          # through. One per cluster, shared by every capability chart — each
          # chart emitting its own would collide on Helm ownership and clone the
          # same repo once per capability. Must exist before the charts below.
          # The operator writes each standalone secret into the namespace named
          # below, and creates none of them. `tekton-ci` is handled above and
          # `crossplane-system` always exists, but `flux-system` does not on a
          # cluster that has not been Flux-bootstrapped — so that one
          # SopsSecretManifest sits at Applied=False indefinitely while
          # everything around it reports healthy. Derived from the list itself
          # so a new entry cannot reintroduce the gap. Found on u26-kind3.
          - name: Ensure the namespaces the standalone sops secrets are written into
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            become_user: "{{ ansible_user }}"
            loop: "{{ standalone_sops_secrets | map(attribute='namespace') | unique | list }}"
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool

          - name: Deploy sops-git-secrets (GitRepository + read-only credential)
            ansible.builtin.command: >
              helm upgrade --install sops-git-secrets {{ charts_oci }}/sops-git-secrets
              --version {{ sops_git_secrets_chart_version }}
              --set git.name={{ sops_git_repository_name }}
              --set git.url={{ stuttgart_things_repo }}
              --set git.auth.username={{ sops_git_username }}
              --set git.auth.password={{ sops_git_token }}
              {% for s in standalone_sops_secrets %}--set secrets[{{ loop.index0 }}].name={{ s.name }} --set secrets[{{ loop.index0 }}].namespace={{ s.namespace }} {% endfor %}
              --set ageKeySecret.name={{ sops_age_key_ref_name }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool
            no_log: true    # never echo the git token

          - name: Deploy per-environment capability charts
            ansible.builtin.command: >
              helm upgrade --install {{ item.0.chart }}-{{ item.1 }} {{ charts_oci }}/{{ item.0.chart }}
              --version {{ item.0.version }}
              --set environment={{ item.1 }}
              --set {{ item.0.backend_key }}={{ item.0.backend | default('sops') }}
              {{ item.0.extra_set | default([]) | map('regex_replace', '^', '--set ') | join(' ') }}
              {% if item.0.repository_ref_key is defined %}--set {{ item.0.repository_ref_key }}={{ sops_git_repository_name }}{% endif %}
              {% if item.0.age_key_ref_key is defined %}--set {{ item.0.age_key_ref_key }}={{ sops_age_key_ref_name }}{% endif %}
              {% if item.0.credentials_key is defined %}--set-file {{ item.0.credentials_key }}={{ secrets_dir }}/{{ item.0.credentials_prefix }}-{{ item.1 }}.enc.yaml{% endif %}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            loop: "{{ capability_charts | subelements('envs') }}"
            loop_control:
              label: "{{ item.0.chart }}-{{ item.1 }}"
            when: capabilities_enabled | bool

          # WITHOUT THIS THE NEXT TASK FAILS ON EVERY FRESH CLUSTER.
          #
          # `machinery_packages` deliberately does not list ansible-run — but
          # vspherevm and proxmoxvm both declare it in dependsOn, so installing
          # THEM makes the package manager create the Configuration anyway,
          # under the image-derived name. The ansible chart then wants to create
          # the same object (its configuration.enabled defaults to true) and
          # Helm refuses an object it did not create:
          #
          #   Error: unable to continue with install: Configuration
          #   "stuttgart-things-...-ansible-run" exists and cannot be imported
          #   into the current release: invalid ownership metadata
          #
          # The sibling vspherevm/proxmoxvm tasks dodge this with
          # configuration.install=false; here the chart's own pin is the one we
          # want to keep authoritative, so the object is adopted instead.
          # Content-wise a no-op — the transitive package and the chart pin are
          # the same version. `|| exit 0` keeps this a no-op on a cluster where
          # the dependency has not (yet) materialized the object.
          #
          # This never bit kind1 because it was built incrementally by hand, in
          # an order where the chart got there first. Found on u26-kind3.
          - name: Adopt the transitive ansible-run Configuration into the ansible release
            ansible.builtin.shell: |
              kubectl get configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 || exit 0
              kubectl label configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                app.kubernetes.io/managed-by=Helm --overwrite --kubeconfig {{ kubeconfig }}
              kubectl annotate configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                meta.helm.sh/release-name=ansible \
                meta.helm.sh/release-namespace=crossplane-system \
                --overwrite --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          - name: Deploy ansible capability (single release, tekton-ci creds)
            ansible.builtin.command: >
              helm upgrade --install ansible {{ charts_oci }}/ansible
              --version {{ ansible_chart_version }}
              --set environment={{ vsphere_env }}
              --set sshCredentials.backend=sops-git
              --set sshCredentials.sopsGit.repositoryRef.name={{ sops_git_repository_name }}
              --set sshCredentials.sopsGit.ageKeySecret.name={{ sops_age_key_ref_name }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          # Provider-kubernetes RBAC (the backup composes CronJobs + RBAC) and
          # the cluster-backup EnvironmentConfig. The push credential is the
          # sops-git backup-registry blob, not set here.
          - name: Deploy cluster-backup capability (single release)
            ansible.builtin.command: >
              helm upgrade --install cluster-backup {{ charts_oci }}/cluster-backup
              --version {{ cluster_backup_chart_version }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          # Env-independent, like ansible and cluster-backup: the schedule
          # defaults are fleet-wide and every ScheduledRun XR overrides what it
          # cares about, so the chart has no `environment` selector.
          #
          # NB the key is `configuration.enabled`, not `configuration.install` —
          # this chart spells the toggle differently from vspherevm/proxmoxvm/
          # packer, and a wrong key is silently accepted by helm, leaving the
          # Configuration installed twice under two owners.
          - name: Deploy scheduled-run capability (single release)
            ansible.builtin.command: >
              helm upgrade --install scheduled-run {{ charts_oci }}/scheduled-run
              --version {{ scheduled_run_chart_version }}
              --set configuration.enabled=false
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool

          # Shallow checkout for the charts that are not published to OCI. Cloned
          # once and reused by the packer + provider-kubeconfig-vault tasks below.
          #
          # AUTHENTICATED, because stuttgart_things_repo is PRIVATE and the
          # target host has no git credential of its own — an anonymous clone
          # here just fails. Reuses SOPS_GIT_TOKEN, which is already a
          # precondition for the sops-git backend and is read-only.
          #
          # Two things keep the token from leaking:
          #   no_log        so it never reaches the run output, and
          #   rm -rf .git   because `git clone` writes the credential-bearing URL
          #                 into .git/config, where it would sit on the host for
          #                 anyone to read. Nothing below needs git history — the
          #                 checkout is only a chart source — and the next run
          #                 re-clones from scratch anyway.
          - name: Clone the monorepo for charts not on OCI
            ansible.builtin.shell: |
              set -e
              rm -rf {{ stuttgart_things_checkout }}
              git clone --depth 1 --branch {{ stuttgart_things_ref }} \
                "{{ stuttgart_things_repo | regex_replace('^https://', 'https://' ~ sops_git_username ~ ':' ~ sops_git_token ~ '@') }}" \
                {{ stuttgart_things_checkout }}
              rm -rf {{ stuttgart_things_checkout }}/.git
            become_user: "{{ ansible_user }}"
            no_log: true    # never echo the git token
            when: >-
              (capabilities_enabled | bool and packer_chart_enabled | bool)
              or vault_kubeconfigs_enabled | bool

          # The packer runtime: the two Configurations' EnvironmentConfigs
          # (packer-build-defaults, packer-release-defaults, packer-release-labda)
          # and the packer-ca-certs bundle in tekton-ci. One release covers every
          # environment — these EnvironmentConfigs carry no credentials, they only
          # NAME the Secrets that sops-git-secrets materializes, and a single XR
          # reads one build-side and one release-side entry anyway.
          #
          # This replaces applying cicd/packer-{build,release}/examples/
          # environmentconfig.yaml raw; see environment_config_manifests above.
          - name: Deploy packer capability (single release, from the monorepo)
            ansible.builtin.command: >
              helm upgrade --install packer
              {{ stuttgart_things_checkout }}/crossplane/platform/capabilities/packer
              --set configuration.install=false
              --set namespace={{ tekton_ci_namespace }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: capabilities_enabled | bool and packer_chart_enabled | bool

          # ================================================================
          # 6) REMOTE-CLUSTER CREDENTIALS — the vault-kubeconfigs
          #    ClusterProviderConfig that RemoteCluster CRs reference. Chart
          #    lives in the monorepo, not on OCI, so it is cloned above.
          # ================================================================
          # The sops-git backend writes the `vault` Secret asynchronously — the
          # helm release returns as soon as the SopsSecretManifest is created,
          # not when the operator has fetched, decrypted and applied it. Without
          # this wait the two tasks below race it on a cold cluster and read an
          # empty AppRole, which produces a ClusterProviderConfig that looks
          # installed and fails on first use.
          - name: Wait for the sops-git vault Secret to materialize
            ansible.builtin.shell: |
              # Wait for the KEY, not just the object. The operator creates the
              # Secret and populates it a moment later, so `get secret`
              # succeeding is not the same as the AppRole being readable — and
              # the derive task below fails its `test -n` when it wins that
              # race. Observed on a cold machinery build 2026-08-14: this wait
              # reported changed, the very next task failed, and the identical
              # commands run by hand minutes later succeeded.
              {% for v in kubeconfig_vaults %}
              {% if not (v.source_secret == vault_approle_source_secret and vault_approle_role_id | length > 0) %}
              for i in $(seq 1 60); do
                V=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                  -o jsonpath='{.data.{{ vault_approle_secret_id_key }}}' \
                  --kubeconfig {{ kubeconfig }} 2>/dev/null)
                [ -n "$V" ] && break
                sleep 5
              done
              if [ -z "$V" ]; then
                echo "{{ tekton_ci_namespace }}/{{ v.source_secret }} never carried {{ vault_approle_secret_id_key }}" >&2
                exit 1
              fi
              {% endif %}
              {% endfor %}
              exit 0
            become_user: "{{ ansible_user }}"
            # Nicht mehr an vault_approle_role_id gekoppelt: der Override gilt nur
            # fuer den primaeren Vault, die uebrigen Eintraege aus kubeconfig_vaults
            # muessen trotzdem abgeleitet werden. Der Skip passiert jetzt pro
            # Eintrag im Shell-Body.
            when: vault_kubeconfigs_enabled | bool

          # The chart reads the secret-id from a Secret it does not create, so
          # this projects it out of the sops-git `vault` Secret into the name and
          # key the chart's vault.appRole.secretRef expects. Same AppRole, just
          # reshaped — no second credential to distribute or rotate.
          - name: Derive the vault-approle Secret from the sops-git vault Secret
            ansible.builtin.shell: |
              set -euo pipefail
              {% for v in kubeconfig_vaults %}
              {% if not (v.source_secret == vault_approle_source_secret and vault_approle_role_id | length > 0) %}
              SECRET_ID=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                -o jsonpath='{.data.{{ vault_approle_secret_id_key }}}' --kubeconfig {{ kubeconfig }} | base64 -d)
              test -n "$SECRET_ID"
              kubectl -n crossplane-system create secret generic {{ v.approle_secret }} \
                --from-literal=secret-id="$SECRET_ID" \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              {% endif %}
              {% endfor %}
            become_user: "{{ ansible_user }}"
            # Nicht mehr an vault_approle_role_id gekoppelt: der Override gilt nur
            # fuer den primaeren Vault, die uebrigen Eintraege aus kubeconfig_vaults
            # muessen trotzdem abgeleitet werden. Der Skip passiert jetzt pro
            # Eintrag im Shell-Body.
            when: vault_kubeconfigs_enabled | bool
            no_log: true    # never echo the AppRole secret-id

          # Role ID resolution happens INSIDE the shell rather than in Jinja, so
          # the explicit-override path and the derived path are one code path and
          # the value never has to become an ansible fact (which `no_log` would
          # hide from the log but not from a fact dump).
          - name: Deploy provider-kubeconfig-vault
            ansible.builtin.shell: |
              set -euo pipefail
              SETS=()
              {% for v in kubeconfig_vaults %}
              ROLE_ID='{% if v.source_secret == vault_approle_source_secret %}{{ vault_approle_role_id }}{% endif %}'
              if [ -z "$ROLE_ID" ]; then
                ROLE_ID=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                  -o jsonpath='{.data.{{ vault_approle_role_id_key }}}' --kubeconfig {{ kubeconfig }} | base64 -d)
              fi
              test -n "$ROLE_ID"
              SETS+=(--set "roleIds.{{ v.provider_config }}=$ROLE_ID")
              {% endfor %}
              # roleIds ist eine MAP, keine Liste — genau deswegen. Ein
              # --set additionalVaults[N].appRole.roleId wuerde den ganzen
              # Listeneintrag ersetzen statt ihn zu ergaenzen; siehe den Kopf von
              # templates/clusterproviderconfig.yaml im Chart.
              helm upgrade --install provider-kubeconfig-vault \
                {{ stuttgart_things_checkout }}/crossplane/platform/baseline/provider-kubeconfig-vault \
                "${SETS[@]}" \
                -n crossplane-system --create-namespace \
                --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: vault_kubeconfigs_enabled | bool
            no_log: true    # never echo the AppRole role ID

          # THE CHART CANNOT DO THIS ITSELF, AND WITHOUT IT THE CHART IS INERT.
          #
          # The Provider CR is created by the package manager from a dependsOn,
          # so helm will not adopt it — the chart emits the
          # DeploymentRuntimeConfig and nothing ever points the provider at it.
          # The provider then keeps the `default` runtime config, never receives
          # VAULT_CACERT, and every RemoteCluster fails with
          #
          #   Vault AppRole auth login failed: ... tls: failed to verify
          #   certificate: x509: certificate signed by unknown authority
          #
          # which reads like a credential problem and is not one — the AppRole is
          # fine, the provider simply does not trust the Vault CA. The chart's own
          # DeploymentRuntimeConfig comment predicts exactly this failure.
          #
          # kind1 has the reference set; it was patched there by hand and never
          # written down. Confirmed by diff on 2026-08-11: kind1
          # runtimeConfigRef=provider-kubeconfig, a fresh cluster =default.
          #
          # The same patch also pins the ServiceAccount name (the DRC's
          # serviceAccountTemplate), without which Crossplane derives it from the
          # package revision hash and the chart's RBAC silently stops applying
          # after any provider upgrade.
          - name: Point the kubeconfig provider at its DeploymentRuntimeConfig
            ansible.builtin.shell: |
              set -euo pipefail
              kubectl patch provider.pkg.crossplane.io {{ kubeconfig_provider_name }} --type=merge \
                -p '{"spec":{"runtimeConfigRef":{"apiVersion":"pkg.crossplane.io/v1beta1","kind":"DeploymentRuntimeConfig","name":"{{ kubeconfig_provider_runtime_config }}"}}}' \
                --kubeconfig {{ kubeconfig }}
              kubectl wait provider.pkg.crossplane.io/{{ kubeconfig_provider_name }} \
                --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            when: vault_kubeconfigs_enabled | bool

          # Installing ~24 Configuration packages registers a large number of CRDs.
          # Each burst forces the apiserver to rebuild discovery and OpenAPI, etcd
          # applies queue behind it, and kube-controller-manager / kube-scheduler miss
          # their lease deadline and exit. That is self-healing, but the play used to
          # finish mid-storm and report failed=0 while the control plane was still
          # flapping -- which reads as "machinery ready" and is not.
          #
          # Gate on a QUIET PERIOD, never a single sample: a lone check lands in the
          # gap between two crashes and looks healthy. Require three consecutive
          # samples with no pod outside Running/Completed AND no new control-plane
          # restart.
          - name: Wait for the cluster to settle
            ansible.builtin.shell: |
              set -uo pipefail
              stable=0
              prev=""
              for i in $(seq 1 {{ settle_max_samples | default(60) }}); do
                busy=$(kubectl get pods -A --no-headers --kubeconfig {{ kubeconfig }} 2>/dev/null \
                       | awk '$4 != "Running" && $4 != "Completed"' | wc -l)
                now=$(kubectl -n kube-system get pod -l tier=control-plane \
                        -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount},{end}' \
                        --kubeconfig {{ kubeconfig }} 2>/dev/null)
                if [ "$busy" -eq 0 ] && [ -n "$now" ] && [ "$now" = "$prev" ]; then
                  stable=$((stable + 1))
                  [ "$stable" -ge 3 ] && exit 0
                else
                  stable=0
                fi
                prev="$now"
                sleep {{ settle_interval | default(10) }}
              done
              echo "cluster did not settle: still restarting or with unhealthy pods" >&2
              kubectl get pods -A --no-headers --kubeconfig {{ kubeconfig }} \
                | awk '$4 != "Running" && $4 != "Completed"' >&2
              exit 1
            become_user: "{{ ansible_user }}"
            changed_when: false
            # Set settle_enabled=false to finish without the gate -- the play then
            # reports success on a cluster that may still be settling.
            when: settle_enabled | default(true) | bool


          - name: Show machinery readiness
            ansible.builtin.command: >
              kubectl get provider.pkg.crossplane.io,configuration.pkg.crossplane.io,environmentconfig
              --kubeconfig {{ kubeconfig }}
            become_user: "{{ ansible_user }}"
            register: machinery_status

          - name: Machinery status
            ansible.builtin.debug:
              var: machinery_status.stdout_lines

  # ====================================================================
  # Flat / local-testable form — no become, runs as the current user
  # against a local kubeconfig by default. Proven copy (mirrors
  # plays/kind-machinery-test.yaml). Override target_host/ansible_connection
  # to drive a remote host.
  # ====================================================================
  - name: kind_machinery
    play: |
      ---
      - name: kind machinery bootstrap (flat / local-testable)
        hosts: "{{ target_host | default('localhost') }}"
        connection: "{{ ansible_connection | default('local') }}"
        gather_facts: false

        vars:
          # Six tasks below open with `set -euo pipefail`. Ansible's shell
          # module runs /bin/sh, which on Ubuntu is dash — and dash has no
          # pipefail, so those tasks die on line 1 with
          #   /bin/sh: 1: set: Illegal option -o pipefail
          # before reading a single value. Through Tekton this never showed,
          # because the pipeline image supplies its own ansible.cfg; run from
          # the CLI against a plain Ubuntu host it fails every time. Set here
          # so the play is correct however it is invoked.
          ansible_shell_executable: /bin/bash
          ansible_user: "{{ lookup('env', 'USER') | default('sthings', true) }}"
          kind_cluster_name: dev2
          kubeconfig: "/home/{{ ansible_user }}/.kube/{{ kind_cluster_name }}"

          # vsphere_envs ist bewusst eine EXPLIZITE Liste und leitet sich nicht
          # mehr aus vsphere_env ab: auf einem Cluster laufen beide vSphere-Envs
          # nebeneinander (je eine vspherevm-Release, Namen vspherevm-<env>).
          # vsphere_env bleibt der "primaere" Env und steuert weiterhin die
          # ansible-Capability (eine Release) und den secrets_dir-Pfad.
          #
          # labda kam am 2026-08-20 dazu. Alles dafuer war schon da — das Chart
          # 0.12.6 traegt den environments.labda-Block, und
          # secrets/vsphere-creds-labda.enc.yaml liegt im secrets-Repo, also
          # genau dort, wo der sops-git-Backend den Pfad ohnehin ableitet. Es
          # fehlte nur die Release. Verifiziert auf kind3 mit einem echten
          # Clone (10.100.136.67, moid vm-45964).
          #
          # labul BLEIBT DRIN, wird aber NICHT MEHR GEPFLEGT: LabUL-vSphere wird
          # in den naechsten Wochen abgeschaltet, der Hypervisor-Fokus im LabUL
          # ist Proxmox. Den labul-Block im Chart (u.a. der Stopgap-Pin auf
          # sthings-u26-previous, cloud-init deaktiviert, stuttgart-things#2432)
          # also nicht mehr reparieren — neue vSphere-Arbeit geht nach labda.
          vsphere_env: labul                         # labul | labda — primary env
          vsphere_envs: ["labul", "labda"]           # one vspherevm release per entry
          proxmox_env: labul                         # only labul creds exist today
          proxmox_envs: ["{{ proxmox_env }}"]        # one proxmoxvm release per entry
          capabilities_enabled: true                 # false = stop after crossplane
          platform_enabled: true                     # false = pure VM builder, no cni/Flux/platform
          sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') }}"
          secrets_dir: "/home/{{ ansible_user }}/projects/stuttgart-things/secrets"
          age_key_namespaces: >-
            {{ ['sops-secrets-operator-system'] if sops_global_age_key_enabled | bool else ['crossplane-system'] }}

          # See the profile play above for the full commentary on these. Short
          # version: on by default now, because the AppRole this needs is already
          # on the cluster in the sops-git `vault` Secret and no longer has to be
          # supplied by hand. Set vault_approle_role_id to override the
          # derivation.
          vault_kubeconfigs_enabled: true
          vault_approle_role_id: ""
          vault_approle_source_secret: vault
          vault_approle_role_id_key: VAULT_ROLE_ID
          vault_approle_secret_id_key: VAULT_SECRET_ID

          # EIN PROVIDER, MEHRERE VAULTS.
          #
          # provider-kubeconfig-vault emittiert eine ClusterProviderConfig je
          # Eintrag; jede braucht eine eigene AppRole — role ID im Manifest,
          # secret-id in einem Secret. Diese Liste sagt, aus welchem
          # tekton-ci-Secret die AppRole abgeleitet wird und wie das dabei
          # entstehende crossplane-system-Secret heisst.
          #
          # Der primaere Vault steht bewusst MIT drin. Bis 2026-08-20 leitete
          # dieser Play nur ihn ab und uebergab auch nur seine role ID;
          # vault-kubeconfigs-infra war deshalb von Hand gesetzt (2026-08-18)
          # und haette den naechsten Lauf nicht ueberlebt. Helm merged Listen
          # naemlich nicht, es ersetzt sie — der infra-Eintrag waere auf
          # roleId="" gefallen und jeder RemoteCluster darueber still
          # kaputtgegangen. Seit Chart 0.2.0 laufen die role IDs ueber die MAP
          # `roleIds`, die sauber merged.
          #
          # Einen Vault dazunehmen = ein Eintrag hier PLUS einer in den
          # additionalVaults des Charts; das Secret in source_secret muss in
          # standalone_sops_secrets stehen, sonst existiert es nie.
          kubeconfig_vaults:
            - provider_config: vault-kubeconfigs
              source_secret: vault
              approle_secret: vault-approle
            - provider_config: vault-kubeconfigs-infra
              source_secret: vault-infra
              approle_secret: vault-approle-infra
            # LabDA, dazu am 2026-08-20 (crossplane-configurations#258). Eigener
            # Vault statt eines LabUL-Vaults, weil LabUL-vSphere abgeschaltet
            # wird und ein LabDA-Cluster seinen kubeconfig nicht in etwas
            # Sterbendem ablegen soll. Vorab geprueft: AppRole-Login OK (Policy
            # superuser), Mount kubeconfigs/ vorhanden, 8200 erreichbar.
            - provider_config: vault-kubeconfigs-labda
              source_secret: vault-labda
              approle_secret: vault-approle-labda
          # The Provider CR the package manager creates for provider-kubeconfig,
          # and the DeploymentRuntimeConfig the chart emits for it. They have to
          # be wired together by hand — see the patch task.
          kubeconfig_provider_name: provider-kubeconfig
          kubeconfig_provider_runtime_config: provider-kubeconfig

          helm_repo: "git::https://github.com/stuttgart-things/helm.git"
          # From v0.9.0 the ref alone selects the image: semantic-release now
          # writes config/manager/kustomization.yaml before it tags, so the
          # tagged tree pins its own release. Verified by building the bundle:
          # ref=v0.8.5 -> image v0.8.4 (the old off-by-one),
          # ref=v0.9.0 -> image v0.9.0. sops-secrets-operator#86, fixed by #90.
          sops_operator_ref: v0.9.0
          sops_operator_kustomize: "https://github.com/stuttgart-things/sops-secrets-operator/config/default"
          sops_operator_namespace: sops-secrets-operator-system
          sops_operator_overlay_dir: "/home/{{ ansible_user }}/.cache/sops-operator-overlay"
          sops_age_key_data_key: age.agekey
          # v0.9.0 (sops-secrets-operator#47) lets the operator hold one age key
          # for resources that omit spec.decryption.keyRef. Enabling it here does
          # NOT remove the per-namespace copies below: the capability charts
          # still render an explicit keyRef, and a resource's own reference wins
          # over the global default. Groundwork — see the PR.
          sops_global_age_key_enabled: true
          # Derived from the toggle above, driving all three coupled changes so
          # they cannot fall out of sync: the age key ref passed to the charts,
          # and the namespaces the age-key Secret is installed into.
          #   enabled  -> ref "" (charts omit spec.decryption; operator uses its
          #               --global-age-key-secret), key only in the operator ns.
          #   disabled -> ref "sops-age-key" (charts render an explicit keyRef),
          #               key in the namespace every sops-git CR resolves in.
          # Every sops-git SopsSecretManifest is created in crossplane-system
          # (next to the GitRepository), so that is the only per-CR namespace.
          sops_age_key_ref_name: "{{ '' if sops_global_age_key_enabled | bool else 'sops-age-key' }}"
          charts_oci: "oci://ghcr.io/stuttgart-things/charts"
          ansible_chart_version: "0.9.2" # datasource=docker depName=ghcr.io/stuttgart-things/charts/ansible
          # The name the ansible chart gives its Configuration — which is the
          # name `crossplane xpkg install` derives from the image ref, NOT the
          # short `ansible-run`. See the adopt task below for why this matters.
          ansible_run_configuration_name: stuttgart-things-crossplane-configurations-ansible-run
          cluster_backup_chart_version: "0.1.0" # datasource=docker depName=ghcr.io/stuttgart-things/charts/cluster-backup
          scheduled_run_chart_version: "0.2.1" # datasource=docker depName=ghcr.io/stuttgart-things/charts/scheduled-run
          cert_manager_version: 1.21.1 # datasource=github-releases depName=cert-manager/cert-manager
          # The packer capability chart is NOT on OCI — it is installed from a
          # path in the monorepo, like provider-kubeconfig-vault below. Move it
          # to `charts_oci` once `task push-platform-charts` has published it.
          #
          # NB: it lives on the feat/packer-capability-chart branch as of this
          # writing, so until that merges a run needs
          # `-e stuttgart_things_ref=feat/packer-capability-chart`.
          packer_chart_enabled: true

          # Per-environment capability charts. One Helm release per entry in
          # `envs`, named `<chart>-<env>`, credentials read from
          # <secrets_dir>/<credentials_prefix>-<env>.enc.yaml. Every chart here
          # follows the same shape: `--set environment=<env>` selects the
          # placement block, `<backend_key>=sops` picks the sops backend (kind
          # clusters have no Vault/ESO), and the Configuration package itself is
          # skipped because `configuration_packages` above installs it.
          # Add a hypervisor by adding an entry — no new task.
          capability_charts:
            # sops-git: the chart derives the path as secrets/<name>.enc.yaml,
            # i.e. secrets/vsphere-creds-<env>.enc.yaml — exactly where the
            # blobs already live in the repo. No credentials_key: the operator
            # fetches the file, nothing is passed in at deploy time.
            - chart: vspherevm
              version: "0.12.6"
              envs: "{{ vsphere_envs }}"
              credentials_prefix: vsphere-creds
              backend_key: secretStore.backend
              backend: sops-git
              # Set from the play var on the command line rather than inside
              # extra_set: a {{ }} nested in a var value is not reliably
              # re-templated, and it rendered literally when checked.
              repository_ref_key: secretStore.sopsGit.repositoryRef.name
              # Emptied to "" when the global age key is on, which omits
              # spec.decryption so --global-age-key-secret is used instead.
              age_key_ref_key: secretStore.sopsGit.ageKeySecret.name
              extra_set:
                - configuration.install=false
            # Same sops-git treatment as vspherevm above. kind1 already ran
            # 0.4.0 on this backend (installed by hand during the live test)
            # while this file still said 0.3.0 + sops, so a playbook run used
            # to downgrade it and revert it to the embedded blob.
            # 0.10.0, NOT 0.9.2 — and 0.9.2 must not be reintroduced here.
            # stuttgart-things#2483 added `cloneDatastore: V5010-01-1` to
            # environments.labul without bumping Chart.yaml, so the registry's
            # 0.9.2 and the monorepo's 0.9.2 became two different charts: a run
            # against the published one silently produced an EnvironmentConfig
            # with no cloneDatastore, and under the DD-sthings ACL every LabUL
            # clone then 403s unless each XR restates the field. 0.10.0 is the
            # first published version whose content matches the tree (pushed
            # 2026-08-11 alongside this bump); 0.9.2 was deliberately left in
            # place rather than overwritten, so clusters already on it are
            # unchanged. Found on u26-kind3.
            - chart: proxmoxvm
              version: "0.10.0"
              envs: "{{ proxmox_envs }}"
              credentials_prefix: proxmox-creds
              backend_key: secretStore.backend
              backend: sops-git
              repository_ref_key: secretStore.sopsGit.repositoryRef.name
              # Emptied to "" when the global age key is on, which omits
              # spec.decryption so --global-age-key-secret is used instead.
              age_key_ref_key: secretStore.sopsGit.ageKeySecret.name
              extra_set:
                - configuration.install=false

          # openebs observability — off, see the helmfile task below.
          openebs_loki_enabled: false
          openebs_alloy_enabled: false

          # --- git-sourced sops credentials (backend=sops-git) ---
          # Capability charts on this backend read their encrypted credentials
          # straight from the repo instead of having the blob embedded at deploy
          # time, so rotating a credential is a git push rather than a playbook
          # run. Needs one GitRepository + read-only credential per cluster,
          # from the sops-git-secrets baseline chart. That chart is NOT on OCI,
          # so it is cloned — same as provider-kubeconfig-vault below.
          sops_git_secrets_enabled: true
          sops_git_repository_name: sops-secrets
          sops_git_username: stuttgart-things
          # Read-only token with access to stuttgart_things_repo. Never commit.
          sops_git_token: "{{ lookup('env', 'SOPS_GIT_TOKEN') }}"
          # sops-git-secrets is published to OCI (stuttgart-things#2407/#2408); install
          # from there rather than cloning the private monorepo for its chart source.
          sops_git_secrets_chart_version: "0.9.0" # datasource=docker depName=ghcr.io/stuttgart-things/charts/sops-git-secrets
          # Encrypted blobs in the secrets repo with no capability chart of
          # their own — the capability charts each emit their own
          # SopsSecretManifest, this list covers the rest. Both were applied by
          # hand before they had an owner (stuttgart-things#2407).
          # `namespace` is where the SECRET is written; the CR itself always
          # goes next to the GitRepository, because the operator resolves
          # sourceRef only within the CR's own namespace.
          standalone_sops_secrets:
            - name: vault
              namespace: tekton-ci
            # Quellen fuer die AppRoles der weiteren kubeconfig-Vaults,
            # siehe kubeconfig_vaults oben. Ohne diese beiden Eintraege
            # existieren die Secrets nicht und der Derive-Task bricht ab.
            - name: vault-infra
              namespace: tekton-ci
            - name: vault-labda
              namespace: tekton-ci
            - name: dapr-backstage-template-execution-vars
              namespace: flux-system
            # ghcr push credential for the cluster-backup CronJob. Lands in
            # crossplane-system (cluster-backup's default spec.namespace), as a
            # kubernetes.io/dockerconfigjson Secret - the type is carried in the
            # encrypted manifest, so the operator materializes it as-is.
            - name: backup-registry
              namespace: crossplane-system
            # AppRole a TofuRun authenticates to Vault with, as TF_VAR_* keys.
            # NOT the same credential as the `vault` Secret above — a different
            # AppRole entirely (verified by hash), which is why it needs its own
            # blob. It was hand-applied on kind1 and existed nowhere else until
            # stuttgart-things committed secrets/terraform-credentials.enc.yaml
            # while retiring that cluster; without this entry a machinery
            # cluster can render a TofuRun but not authenticate it.
            - name: terraform-credentials
              namespace: tekton-ci
            # git credential the packer pipelines clone the packer repo with
            # (.git-credentials + .gitconfig). Required now that
            # packer_chart_enabled is on by default — the capability chart names
            # this Secret but creates nothing, so without it a PackerBuild fails
            # at the clone. Same token as sops-git-credentials, but the packer
            # task consumes it in git's own file format rather than as a value.
            - name: packer-git-basicauth
              namespace: tekton-ci

          stuttgart_things_repo: "https://github.com/stuttgart-things/stuttgart-things.git"
          stuttgart_things_ref: main
          # Shallow checkout shared by every chart that is not on OCI (packer,
          # provider-kubeconfig-vault). Cloned once, when either needs it.
          stuttgart_things_checkout: "/tmp/stuttgart-things-baseline"
          # The PipelineRun namespace. Both packer pipelines run here, and it is
          # where the packer CA bundle and the tekton-ci sops Secrets must land —
          # Tekton resolves them in the namespace the run executes in, not the
          # XR's. `helm --create-namespace` only ever creates the RELEASE
          # namespace (crossplane-system), so this one needs creating explicitly.
          tekton_ci_namespace: tekton-ci

          crossplane_configurations_raw: "https://raw.githubusercontent.com/stuttgart-things/crossplane-configurations"
          crossplane_configurations_ref: main
          environment_config_manifests:
            - machinery/vsphere-vm/examples/environmentconfig.yaml
            - cicd/tofu-run/examples/environmentconfig.yaml
            # cluster-backup's EnvironmentConfig comes from its capability chart
            # (deployed below), not applied raw — it also carries the provider RBAC.
            # Same for scheduled-run (scheduled-run-defaults).
            #
            # The packer ones USED to be applied from
            # cicd/packer-{build,release}/examples/ here. They are now emitted by
            # the packer capability chart, under the same names
            # (packer-build-defaults, packer-release-defaults) plus
            # packer-release-labda. Applying the upstream examples as well would
            # overwrite the chart's values — reverting pipelineRevision to the
            # example's pin and dropping the Proxmox promotion target — so both
            # lines are deliberately gone rather than merely commented out.
          platform_environment_config_manifests:
            - bootstrap/flux-init/examples/environment-config.yaml
            - bootstrap/flux-apps/examples/environment-config.yaml

          # Cluster-scoped RBAC that a Configuration documents as a PRECONDITION
          # but cannot ship — a package installs CRDs and Compositions, never
          # ClusterRoleBindings. Pulled from the repo rather than inlined so the
          # rules stay in one place; the file's own header explains each one.
          #
          # remote-cluster (via `cluster`) needs two, and both were found by a
          # wedged live build on u26-kind3, 2026-08-12:
          #
          #   create remoteclusters — RemoteClusters were always applied by hand
          #   before, so provider-kubernetes only ever had to READ them.
          #
          #   patch clusterproviderconfigs.helm.m — needed even though the Object
          #   that touches them is Observe-only. The provider computes desired
          #   state with a DRY-RUN server-side apply, which the API server
          #   authorizes exactly like a real write.
          #
          # THE SECOND ONE FAILS DECEPTIVELY. status.ready goes true and
          # status.share fills in with the endpoint and serverVersion (both come
          # from the RemoteCluster, which is fine) while only Crossplane's own
          # Ready condition stays False on "Unready resources: observe-helm". A
          # ClusterStack looks finished and is not.
          platform_rbac_manifests:
            - bootstrap/remote-cluster/examples/rbac.yaml
            # Lets the provider-kubernetes SA observe RemoteClusters and manage
            # IPReservations, which is what an ip-reservation child XR (enabled
            # via spec.ipReservation on a Platform) reconciles through.
            #
            # MERGE ORDER: needs crossplane-configurations#251, which changed
            # this file's binding from a literally-named ServiceAccount (with an
            # XXXXXXXXXXXX hash placeholder) to the group
            # `system:serviceaccounts:crossplane-system`. These manifests are
            # fetched raw from `crossplane_configurations_ref` (main) at run
            # time, so merging this play first would apply a binding to a
            # subject that does not exist — and RBAC does not validate subjects,
            # so it would look like it worked.
            - bootstrap/ip-reservation/examples/rbac.yaml

          # Providers that no Configuration carries. Every other provider on a
          # machinery cluster arrives through some Configuration's dependsOn —
          # provider-clusterbook does not, because ip-reservation classes it
          # (and provider-kubeconfig) as a fleet cluster precondition rather
          # than a package dep. Without it, `spec.ipReservation.enabled: true`
          # on a Platform XR has its XRD (platform v0.3.3 pulls ip-reservation)
          # but no controller to reconcile the IPReservation it composes.
          #
          # Gated on platform_enabled with the rest of the fleet-manager half:
          # a pure VM builder composes no Platform and needs none of it.
          provider_packages:
            - name: provider-clusterbook
              package: "ghcr.io/stuttgart-things/provider-clusterbook-xpkg:v0.4.2"
              provider_crd: clusterproviderconfigs.clusterbook.stuttgart-things.com

          machinery_packages:
            # v0.9.1 reicht den environmentConfig an den Ansible-Teil durch statt
            # Defaults zu raten — derselbe Fix wie bei proxmoxvm v0.12.1 unten,
            # beide aus crossplane-configurations#320.
            #
            # v0.9.2 NIMMT GENAU DAS WIEDER ZURUECK, und zwar absichtlich. Der
            # Durchreicher aus #317/#320 war ein Fehlschluss: spec.environmentConfig
            # benennt eine HYPERVISOR-Env (labul, labda) und wird gegen das
            # vspherevm-Label aufgeloest — ansible-run loest sein EIGENES Label auf,
            # und dort existiert im Fleet nur `default` (ansible-run-defaults).
            # Der Forward matchte also nichts und liess JEDEN ansible-run-Default
            # still fallen, ansibleExtraCollections eingeschlossen; das Playbook
            # lief dann gegen die Collection, die zufaellig im Working-Image steckt.
            #
            # Gefunden auf kind3 (2026-08-20) beim ersten LabDA-Build:
            # sthings.baseos.setup starb nach ok=70 in install_configure_vault mit
            # "dict object has no element 26" — obwohl das gepinnte Release
            # sthings-baseos-26.730.1176 den Ubuntu-26-Key laengst hat. Der echte
            # Hinweis stand im Step-Log: "No collections directory found".
            #
            # Ab v0.9.2 bleibt der Default `default` stehen; wer eine
            # ansible-run-<env> hat, waehlt sie ueber spec.ansible.environmentConfig.
            # crossplane-configurations#347.
            - name: vspherevm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/vspherevm:v0.9.2"
              provider_crd: clusterproviderconfigs.vspherevm.m.stuttgart-things.com
            # v0.10.0 added spec.vm.cloneDatastore, v0.11.0 its `none` opt-out
            # sentinel. NOT optional for LabUL: both base-OS templates keep their
            # disk on the NFS store DD-sthings, whose ACL lost
            # Datastore.AllocateSpace in early 2026-08, so a clone that cannot
            # name a target datastore 403s. Below v0.10.0 the XRD has no such
            # field at all — a cluster built on v0.9.0 cannot provision a LabUL
            # Proxmox VM, which is not obvious because every Configuration still
            # reports Healthy. Raised from v0.9.0 after u26-kind3 (2026-08-11).
            #
            # v0.12.0 splits the template's node from the VM's: a clone source
            # living on one Proxmox node no longer forces the new VM onto that
            # same node (spec.vm.templateNode).
            #
            # v0.12.1 reicht den environmentConfig an den Ansible-Teil durch,
            # statt Defaults zu raten: die VM-Configurations lasen ihre gemeinsamen
            # Ansible-Werte aus einem `ansible`-Unterblock ihres EIGENEN
            # EnvironmentConfig, den kein Cluster traegt. `_env?.ansible` war also
            # immer {} und jeder Wert fiel auf einen hartkodierten Fallback durch —
            # der dann als expliziter Spec-Wert in der komponierten AnsibleRun
            # landete (crossplane-configurations#317/#320).
            #
            # v0.12.2 nimmt den environmentConfig-Durchreicher wieder heraus —
            # dieselbe Korrektur wie vspherevm v0.9.2 oben, gleiche Begruendung.
            # crossplane-configurations#347.
            - name: proxmoxvm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/proxmoxvm:v0.12.2"
              provider_crd: clusterproviderconfigs.proxmoxbpg.m.crossplane.io
            - name: packer-build
              package: "ghcr.io/stuttgart-things/crossplane-configurations/packer-build:v0.4.1"
            # Build -> test -> promote. Its dependsOn floor of packer-build
            # >=v0.3.0 is why the pin above had to move: against v0.2.0 the
            # promotion gate reads a `template-name` result that older
            # packer-build does not surface, so the XR sits in phase=Building
            # behind a successful build with no error. Pulls vm-provision
            # (-> vsphere-vm, proxmox-vm, ansible-run) transitively; needs no
            # provider beyond the ones already waited on above.
            #
            # v0.4.2 dropped the XRD's `default: vault` on
            # promote.vaultSecretName. Below that tag the default is
            # materialized into every new object and beats the
            # EnvironmentConfig, so the `vaultSecretName: vault-labda` the
            # packer chart sets for LabDA is dead config and a LabDA promotion
            # has to restate it on the XR (crossplane-configurations#225).
            - name: packer-release
              package: "ghcr.io/stuttgart-things/crossplane-configurations/packer-release:v0.4.2"
            # Scheduled encrypted state export to an OCI registry. Only
            # provider-kubernetes (already up), like the packer packages, so no
            # provider_crd wait. Installing the package + its EnvironmentConfig
            # makes the capability available; a running backup additionally
            # needs the backup-registry push Secret and, on a scoped provider
            # SA, the provider-kubernetes RBAC from the Configuration's README
            # (fleet GitOps, same place as provider-kubernetes-flux) - neither
            # is required just to install this.
            - name: cluster-backup
              package: "ghcr.io/stuttgart-things/crossplane-configurations/cluster-backup:v0.1.0"
            # Cron-driven re-apply of an arbitrary XR (an AnsibleRun, a
            # PackerBuild). Only provider-kubernetes, so no provider_crd wait.
            # Its EnvironmentConfig comes from the scheduled-run capability
            # chart deployed below, not from the raw examples.
            - name: scheduled-run
              package: "ghcr.io/stuttgart-things/crossplane-configurations/scheduled-run:v0.1.1"
            # Runs a tofu module as a Workspace. Pulls provider-opentofu, which
            # the packer-release test VM also needs at RUN time — but nothing
            # installed here consumes its CRD at apply time, so no wait.
            - name: tofu-run
              package: "ghcr.io/stuttgart-things/crossplane-configurations/tofu-run:v0.1.0"
            # Harvester / KubeVirt VMs. Third hypervisor next to vSphere and
            # Proxmox — crossplane-configurations#258 Block B wants a ClusterStack
            # to be able to build on it, and that starts with the Configuration
            # being on the cluster at all.
            #
            # NO provider_crd, and that is not an oversight: harvester-vm renders
            # a KubeVirt VirtualMachine through provider-kubernetes, which is
            # already waited on above. It registers no provider of its own.
            #
            # volume-claim (root-disk PVC), cloud-config (cloud-init Secret) and
            # ansible-run arrive through dependsOn and are deliberately NOT listed
            # here — same reason as flux-apps below: the same ghcr path under both
            # a short CR name and a dependsOn is the Lock collision from
            # crossplane-configurations#247.
            - name: harvester-vm
              package: "ghcr.io/stuttgart-things/crossplane-configurations/harvester-vm:v0.1.9"

          platform_packages:
            # v0.3.1 is a FLOOR, not a preference: `cluster` below declares
            # dependsOn platform >=v0.3.1, so leaving this at v0.3.0 makes the
            # cluster Configuration unresolvable and the wait task fails.
            #
            # v0.3.3 additionally declares ip-reservation, vault-auth and
            # vault-pki-secrets (crossplane-configurations#250); v0.3.8 adds
            # substitution discovery, the wildcard certificate, and a
            # vault-pki-secrets floor of >=v0.1.5 — see the floor note below. Those back
            # `spec.ipReservation` / `spec.vaultIssuer` on a Platform XR, which
            # before that composed child XRs whose XRDs were on no cluster. They
            # arrive transitively — do NOT add them here, see below.
            #
            # v0.3.15 carries seven more, and the floors above are unchanged:
            #   v0.3.9-.11  headlamp + the machinery service reach the catalog
            #   v0.3.12     external-secrets, nfs-csi and vault join it
            #   v0.3.13     a cluster discovers its OWN Vault k8s-auth mount
            #               instead of being told the name by hand
            #   v0.3.14     the misleading ESO defaults became required
            #   v0.3.15     a required substitution variable that the platform
            #               can still DISCOVER defers its component instead of
            #               aborting the whole render — enabling an auth and the
            #               app that reads it in one step used to deadlock
            #               (crossplane-configurations#277)
            #   v0.6.0-.2   vaultIssuer WAITS for cert-manager instead of racing
            #               it. ClusterIssuer, PKI secret and tokenrequest RBAC
            #               are held back until the cert-manager webhook's
            #               Endpoints on the TARGET carry an address — which
            #               happens only once the pod is ready AND the Service
            #               selects it. Before that the ClusterIssuer was applied
            #               against a webhook that was not serving yet and stuck.
            #               On a cluster where ArgoCD installs cert-manager that
            #               is the NORMAL ordering, not an edge case.
            #               v0.6.1 declares certManagerReady and
            #               waitingForCertManager in the XRD — v0.6.0 computed
            #               them and the API server dropped them silently, so the
            #               gate was invisible from outside. Same trap as v0.3.15.
            #               v0.6.2 observes Endpoints instead of a Deployment: a
            #               metadata-only Deployment fails `kubeconform -strict`
            #               in the verify pipeline, and Endpoints is the stronger
            #               signal anyway.
            #               Floors unchanged (vault-pki-secrets >=v0.1.5), so this
            #               is NOT the "raised floor" case above.
            - name: platform
              package: "ghcr.io/stuttgart-things/crossplane-configurations/platform:v0.6.2"
            # flux-apps is NOT listed. platform has declared the dependency
            # since v0.3.1, so an explicit pin would put the same ghcr path
            # under both a short CR name (this play) and a dependsOn — which is
            # the Lock collision from crossplane-configurations#247: upgrading
            # the short-named CR briefly drops its Lock entry, the resolver
            # auto-installs a long-named duplicate of the identical source, and
            # every package on the cluster goes Healthy=False. That is exactly
            # what a flux-apps upgrade did to all 20 Configurations on u26-kind3
            # on 2026-08-12.
            #
            # So it arrives as a package-manager-named CR, same as
            # remote-cluster below, and is expected to look "extra" in
            # `kubectl get configuration`. The version follows platform's
            # `>=v0.1.2` rather than a pin here. Same reasoning for the three
            # Configurations v0.3.3 added.
            # Builds a WHOLE CLUSTER from one namespaced ClusterStack XR: VM ->
            # base-OS -> distribution -> kubeconfig upload -> ClusterAccess ->
            # Platform. Last in the list because it depends on platform above,
            # and it also pulls remote-cluster, which nothing else installs.
            #
            # Proven end to end on u26-kind3 -> Proxmox LabUL, 2026-08-12: a
            # six-line XR produced u26-rke2-1, v1.35.1+rke2r1 Ready with cilium,
            # reachable through the ClusterProviderConfigs it emitted.
            #
            # NEEDS platform_rbac_manifests, applied below. Without it the build
            # runs all three ansible stages green and then wedges at the access
            # stage — see the deceptive-failure note there.
            #
            # NEVER lower this pin. `kubectl apply` walks a Configuration
            # BACKWARDS without complaint, so a pin that trails the fleet is not
            # a no-op on an existing cluster, it is a silent downgrade — the same
            # failure mode CLAUDE.md records for examples/functions.yaml, here
            # aimed at the Configuration that builds whole clusters. Check the
            # fleet before touching it.
            #
            # v0.4.0 lets a ClusterStack build a control plane of its own and
            # declares management-plane >=v0.2.0, which therefore arrives
            # transitively — do NOT add it to this list.
            # That management-plane floor is unchanged in v0.5.0, so a fresh
            # cluster still resolves the newest one (v0.3.1 at time of writing).
            #
            # v0.5.0 DERIVES kubeconfig.providerConfigRef from
            # kubeconfig.vaultSecretName instead of defaulting it separately. The
            # two name the same Vault — one says where the kubeconfig is uploaded,
            # the other where it is read back — and nothing enforced that: the old
            # defaults `vault` / `vault-kubeconfigs` agreed only by accident.
            # Setting vaultSecretName to vault-infra, which the ArgoCD path
            # requires, sent the read to the OTHER Vault and the RemoteCluster
            # failed with `secret not found`. Nothing above it reported an error —
            # the ClusterStack stayed Ready=True, because without a ready
            # ClusterAccess the Platform branch is never emitted and there is
            # nothing left to wait for. Forty minutes to find
            # (crossplane-configurations#336, argoplatform-test2 2026-08-19).
            # The XRD now also rejects the two known crossed pairs at apply time.
            - name: cluster
              package: "ghcr.io/stuttgart-things/crossplane-configurations/cluster:v0.5.0"

          configuration_packages: >-
            {{ machinery_packages
               + (platform_packages if platform_enabled | bool else []) }}

        tasks:
          - name: Preflight — SOPS_AGE_KEY present
            ansible.builtin.assert:
              that:
                - sops_age_key | length > 0
              fail_msg: "export SOPS_AGE_KEY before running (age private key)."

          - name: Preflight — git token present when sops-git credentials are enabled
            ansible.builtin.assert:
              that:
                - sops_git_token | length > 0
              fail_msg: >-
                export SOPS_GIT_TOKEN before running (read-only token for
                stuttgart_things_repo), or set sops_git_secrets_enabled=false.
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool

          # The role ID may be given explicitly OR derived from the sops-git
          # `vault` Secret (see the vars block). One of the two must be possible,
          # so this only fails on the combination that leaves neither.
          - name: Preflight — an AppRole source exists when kubeconfig-vault is enabled
            ansible.builtin.assert:
              that:
                - vault_approle_role_id | length > 0 or (sops_git_secrets_enabled | bool and capabilities_enabled | bool)
              fail_msg: >-
                vault_kubeconfigs_enabled=true needs either an explicit
                vault_approle_role_id, or sops-git enabled so the AppRole can be
                read from {{ tekton_ci_namespace }}/{{ vault_approle_source_secret }}.
            when: vault_kubeconfigs_enabled | bool

          - name: Preflight — cluster reachable
            ansible.builtin.command: "kubectl get nodes --kubeconfig {{ kubeconfig }}"
            changed_when: false

          - name: Ensure cert-manager (sops-secrets-operator webhook dependency)
            ansible.builtin.shell: |
              kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml --kubeconfig {{ kubeconfig }}
              for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
                kubectl -n cert-manager rollout status deploy/$d --timeout=180s --kubeconfig {{ kubeconfig }}
              done
              for i in $(seq 1 30); do
                echo '{"apiVersion":"cert-manager.io/v1","kind":"Issuer","metadata":{"name":"cm-webhook-probe","namespace":"kube-system"},"spec":{"selfSigned":{}}}' | kubectl apply --dry-run=server --kubeconfig {{ kubeconfig }} -f - >/dev/null 2>&1 && break
                sleep 5
              done

          # Deployed through a thin local overlay rather than `apply -k <remote>`
          # directly, so the manager's flags are part of the applied desired
          # state. A `kubectl patch` after the apply would be undone by the next
          # run — the same post-hoc mutation this playbook just dropped for the
          # image pin (#1018).
          - name: Create the sops-secrets-operator overlay dir
            ansible.builtin.file:
              path: "{{ sops_operator_overlay_dir }}"
              state: directory
              mode: "0755"

          - name: Render the sops-secrets-operator kustomize overlay
            ansible.builtin.copy:
              dest: "{{ sops_operator_overlay_dir }}/kustomization.yaml"
              mode: "0644"
              content: |
                ---
                resources:
                  - {{ sops_operator_kustomize }}?ref={{ sops_operator_ref }}
                {% if sops_global_age_key_enabled | bool %}
                patches:
                  - target:
                      kind: Deployment
                      name: sops-secrets-operator-controller-manager
                    patch: |-
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-secret={{ sops_operator_namespace }}/sops-age-key
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --global-age-key-data-key={{ sops_age_key_data_key }}
                {% endif %}

          - name: Deploy sops-secrets-operator (kustomize)
            ansible.builtin.command: >
              kubectl apply -k {{ sops_operator_overlay_dir }}
              --kubeconfig {{ kubeconfig }}

          - name: Wait for sops-secrets-operator controller rollout
            ansible.builtin.command: >
              kubectl -n sops-secrets-operator-system rollout status deployment --timeout=180s
              --kubeconfig {{ kubeconfig }}
            changed_when: false

          - name: Install the sops age-key Secret into each consumer namespace
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              kubectl -n {{ item }} create secret generic sops-age-key \
                --from-literal=age.agekey='{{ sops_age_key }}' \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            loop: "{{ age_key_namespaces }}"
            no_log: true

          - name: Clear helmfile git cache
            ansible.builtin.file:
              path: "/home/{{ ansible_user }}/.cache/helmfile/states/https_github_com_stuttgart-things_helm_git"
              state: absent

          # See the profile play: the openebs chart ships Loki + its MinIO object
          # store + an Alloy DaemonSet on by default, and on a 1+2 kind cluster
          # Loki's 3-replica anti-affinity leaves replica 0 Pending forever.
          # openebs-hostpath is unaffected. Needs stuttgart-things/helm#155;
          # against an older helmfile the state values are ignored.
          - name: Apply openebs + tekton helmfiles
            ansible.builtin.shell: |
              helmfile init --force
              helmfile apply -f {{ item.location }} \
                {% if item.state_values is defined %}--state-values-set {% for k, v in item.state_values.items() %}{{ k }}={{ v }}{{ "," if not loop.last }}{% endfor %} \
                {% endif %}--kubeconfig {{ kubeconfig }}
            loop:
              - location: "{{ helm_repo }}@infra/openebs.yaml.gotmpl"
                state_values:
                  openebs_loki_enabled: "{{ openebs_loki_enabled | lower }}"
                  openebs_alloy_enabled: "{{ openebs_alloy_enabled | lower }}"
              - location: "{{ helm_repo }}@cicd/tekton.yaml.gotmpl"
            loop_control:
              label: "{{ item.location }}"

          - name: Wait for TektonPipeline Ready
            ansible.builtin.shell: |
              kubectl -n tekton-operator rollout status deploy/tekton-operator --timeout=180s --kubeconfig {{ kubeconfig }}
              for i in $(seq 1 60); do kubectl get tektonpipeline pipeline --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait tektonpipeline --all --for=condition=Ready --timeout=300s --kubeconfig {{ kubeconfig }}
            changed_when: false

          - name: Crossplane core + rollout
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl -n crossplane-system rollout status deploy/crossplane --timeout=180s --kubeconfig {{ kubeconfig }}

          - name: Crossplane providers + wait Healthy
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-providers.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl wait provider.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}

          - name: Crossplane config (functions+configurations) + wait Healthy
            ansible.builtin.shell: |
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-config.yaml.gotmpl --kubeconfig {{ kubeconfig }}
              kubectl wait configuration.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              kubectl wait function.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}

          - name: Wait for transitive kubernetes.m CRD, then provider-configs
            ansible.builtin.shell: |
              for i in $(seq 1 60); do kubectl get crd clusterproviderconfigs.kubernetes.m.crossplane.io --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              helmfile apply -f {{ helm_repo }}@cicd/crossplane-provider-configs.yaml.gotmpl --kubeconfig {{ kubeconfig }}

          # Providers with no Configuration to carry them (see provider_packages).
          # Applied before the Configurations so their CRDs are established by
          # the time a Configuration composes against them.
          - name: Install standalone Provider packages
            ansible.builtin.shell: |
              cat <<'EOF' | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: {{ item.name }}
              spec:
                package: {{ item.package }}
              EOF
            loop: "{{ provider_packages }}"
            loop_control:
              label: "{{ item.name }}"
            when: platform_enabled | bool

          - name: Wait standalone Providers Healthy + CRD established
            ansible.builtin.shell: |
              kubectl wait provider.pkg.crossplane.io/{{ item.name }} --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              {% if item.provider_crd is defined %}
              for i in $(seq 1 60); do kubectl get crd {{ item.provider_crd }} --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait --for=condition=established crd/{{ item.provider_crd }} --timeout=180s --kubeconfig {{ kubeconfig }}
              {% endif %}
            loop: "{{ provider_packages }}"
            loop_control:
              label: "{{ item.name }}"
            when: platform_enabled | bool

          - name: Install Configuration packages
            ansible.builtin.shell: |
              cat <<'EOF' | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              apiVersion: pkg.crossplane.io/v1
              kind: Configuration
              metadata:
                name: {{ item.name }}
              spec:
                package: {{ item.package }}
              EOF
            loop: "{{ configuration_packages }}"
            loop_control:
              label: "{{ item.name }}"

          - name: Wait Configuration Healthy + provider CRD established
            ansible.builtin.shell: |
              kubectl wait configuration.pkg.crossplane.io/{{ item.name }} --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
              {% if item.provider_crd is defined %}
              for i in $(seq 1 60); do kubectl get crd {{ item.provider_crd }} --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 && break; sleep 5; done
              kubectl wait --for=condition=established crd/{{ item.provider_crd }} --timeout=180s --kubeconfig {{ kubeconfig }}
              {% endif %}
            loop: "{{ configuration_packages }}"
            loop_control:
              label: "{{ item.name }}"

          - name: Apply EnvironmentConfigs shipped as crossplane-configurations examples
            ansible.builtin.command: >
              kubectl apply --kubeconfig {{ kubeconfig }}
              -f {{ crossplane_configurations_raw }}/{{ crossplane_configurations_ref }}/{{ item }}
            loop: >-
              {{ environment_config_manifests
                 + (platform_environment_config_manifests if platform_enabled | bool else []) }}

          # Same fetch-and-apply shape as the EnvironmentConfigs above, kept a
          # separate task because it is gated differently: these are cluster-
          # scoped RBAC objects, so they exist only for the fleet-manager half.
          # A pure VM builder (platform_enabled=false) installs no Configuration
          # that composes a RemoteCluster and needs none of it.
          - name: Apply cluster-scoped RBAC the platform Configurations require
            ansible.builtin.command: >
              kubectl apply --kubeconfig {{ kubeconfig }}
              -f {{ crossplane_configurations_raw }}/{{ crossplane_configurations_ref }}/{{ item }}
            loop: "{{ platform_rbac_manifests }}"
            when: platform_enabled | bool

          # See the profile play for the full commentary: this play installs the
          # Configurations itself and then deploys the capability charts with the
          # Configuration switched off, and a `helm upgrade` deletes what a
          # release stops rendering — which on a hand-built cluster would take
          # the XRDs and every XR under them. Must run BEFORE the first chart.
          - name: Pin Configurations against deletion by a capability-chart upgrade
            ansible.builtin.command: >
              kubectl annotate configuration.pkg.crossplane.io --all
              helm.sh/resource-policy=keep --overwrite
              --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool

          - name: Ensure the tekton-ci namespace
            ansible.builtin.shell: |
              kubectl create namespace {{ tekton_ci_namespace }} \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            when: capabilities_enabled | bool

          # The GitRepository + read-only credential the sops-git backend reads
          # through. One per cluster, shared by every capability chart — each
          # chart emitting its own would collide on Helm ownership and clone the
          # same repo once per capability. Must exist before the charts below.
          # See the profile play above: the operator creates none of the target
          # namespaces, and `flux-system` does not exist on a cluster that was
          # never Flux-bootstrapped — leaving that SopsSecretManifest at
          # Applied=False while everything around it looks healthy.
          - name: Ensure the namespaces the standalone sops secrets are written into
            ansible.builtin.shell: |
              kubectl create namespace {{ item }} \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
            loop: "{{ standalone_sops_secrets | map(attribute='namespace') | unique | list }}"
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool

          - name: Deploy sops-git-secrets (GitRepository + read-only credential)
            ansible.builtin.command: >
              helm upgrade --install sops-git-secrets {{ charts_oci }}/sops-git-secrets
              --version {{ sops_git_secrets_chart_version }}
              --set git.name={{ sops_git_repository_name }}
              --set git.url={{ stuttgart_things_repo }}
              --set git.auth.username={{ sops_git_username }}
              --set git.auth.password={{ sops_git_token }}
              {% for s in standalone_sops_secrets %}--set secrets[{{ loop.index0 }}].name={{ s.name }} --set secrets[{{ loop.index0 }}].namespace={{ s.namespace }} {% endfor %}
              --set ageKeySecret.name={{ sops_age_key_ref_name }}
              -n crossplane-system --create-namespace
              --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool and sops_git_secrets_enabled | bool
            no_log: true    # never echo the git token

          - name: Deploy per-environment capability charts
            ansible.builtin.command: >
              helm upgrade --install {{ item.0.chart }}-{{ item.1 }} {{ charts_oci }}/{{ item.0.chart }}
              --version {{ item.0.version }}
              --set environment={{ item.1 }}
              --set {{ item.0.backend_key }}={{ item.0.backend | default('sops') }}
              {{ item.0.extra_set | default([]) | map('regex_replace', '^', '--set ') | join(' ') }}
              {% if item.0.repository_ref_key is defined %}--set {{ item.0.repository_ref_key }}={{ sops_git_repository_name }}{% endif %}
              {% if item.0.age_key_ref_key is defined %}--set {{ item.0.age_key_ref_key }}={{ sops_age_key_ref_name }}{% endif %}
              {% if item.0.credentials_key is defined %}--set-file {{ item.0.credentials_key }}={{ secrets_dir }}/{{ item.0.credentials_prefix }}-{{ item.1 }}.enc.yaml{% endif %}
              -n crossplane-system --create-namespace --kubeconfig {{ kubeconfig }}
            loop: "{{ capability_charts | subelements('envs') }}"
            loop_control:
              label: "{{ item.0.chart }}-{{ item.1 }}"
            when: capabilities_enabled | bool

          # See the profile play above for the full commentary. Short version:
          # vspherevm/proxmoxvm pull ansible-run in via dependsOn, so the object
          # already exists un-owned when the ansible chart tries to create it,
          # and Helm refuses it with "invalid ownership metadata". Adopting is a
          # content no-op (same version) and keeps the chart's pin authoritative.
          - name: Adopt the transitive ansible-run Configuration into the ansible release
            ansible.builtin.shell: |
              kubectl get configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                --kubeconfig {{ kubeconfig }} >/dev/null 2>&1 || exit 0
              kubectl label configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                app.kubernetes.io/managed-by=Helm --overwrite --kubeconfig {{ kubeconfig }}
              kubectl annotate configuration.pkg.crossplane.io {{ ansible_run_configuration_name }} \
                meta.helm.sh/release-name=ansible \
                meta.helm.sh/release-namespace=crossplane-system \
                --overwrite --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool

          - name: Deploy ansible capability (single release)
            ansible.builtin.command: >
              helm upgrade --install ansible {{ charts_oci }}/ansible
              --version {{ ansible_chart_version }}
              --set environment={{ vsphere_env }} --set sshCredentials.backend=sops-git
              --set sshCredentials.sopsGit.repositoryRef.name={{ sops_git_repository_name }}
              --set sshCredentials.sopsGit.ageKeySecret.name={{ sops_age_key_ref_name }}
              -n crossplane-system --create-namespace --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool

          - name: Deploy cluster-backup capability (single release)
            ansible.builtin.command: >
              helm upgrade --install cluster-backup {{ charts_oci }}/cluster-backup
              --version {{ cluster_backup_chart_version }}
              -n crossplane-system --create-namespace --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool

          # NB `configuration.enabled`, not `configuration.install` — this chart
          # spells the toggle differently from vspherevm/proxmoxvm/packer, and a
          # wrong key is silently accepted by helm.
          - name: Deploy scheduled-run capability (single release)
            ansible.builtin.command: >
              helm upgrade --install scheduled-run {{ charts_oci }}/scheduled-run
              --version {{ scheduled_run_chart_version }}
              --set configuration.enabled=false
              -n crossplane-system --create-namespace --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool

          # Authenticated: stuttgart_things_repo is private and the host has no
          # git credential of its own. `.git` is removed afterwards because the
          # clone URL — token included — is written into .git/config. See the
          # profile play for the full note.
          - name: Clone the monorepo for charts not on OCI
            ansible.builtin.shell: |
              set -e
              rm -rf {{ stuttgart_things_checkout }}
              git clone --depth 1 --branch {{ stuttgart_things_ref }} \
                "{{ stuttgart_things_repo | regex_replace('^https://', 'https://' ~ sops_git_username ~ ':' ~ sops_git_token ~ '@') }}" \
                {{ stuttgart_things_checkout }}
              rm -rf {{ stuttgart_things_checkout }}/.git
            no_log: true    # never echo the git token
            when: >-
              (capabilities_enabled | bool and packer_chart_enabled | bool)
              or vault_kubeconfigs_enabled | bool

          # Emits packer-build-defaults, packer-release-defaults,
          # packer-release-labda and the packer-ca-certs bundle in tekton-ci.
          # Replaces applying the cicd/packer-*/examples/ EnvironmentConfigs raw.
          - name: Deploy packer capability (single release, from the monorepo)
            ansible.builtin.command: >
              helm upgrade --install packer
              {{ stuttgart_things_checkout }}/crossplane/platform/capabilities/packer
              --set configuration.install=false
              --set namespace={{ tekton_ci_namespace }}
              -n crossplane-system --create-namespace --kubeconfig {{ kubeconfig }}
            when: capabilities_enabled | bool and packer_chart_enabled | bool

          # See the profile play for the full commentary. Short version: the
          # AppRole this chart needs is already on the cluster, in the sops-git
          # `vault` Secret — role ID and secret-id both. The wait exists because
          # that Secret is written asynchronously by the operator.
          - name: Wait for the sops-git vault Secret to materialize
            ansible.builtin.shell: |
              # Wait for the KEY, not just the object. The operator creates the
              # Secret and populates it a moment later, so `get secret`
              # succeeding is not the same as the AppRole being readable — and
              # the derive task below fails its `test -n` when it wins that
              # race. Observed on a cold machinery build 2026-08-14: this wait
              # reported changed, the very next task failed, and the identical
              # commands run by hand minutes later succeeded.
              {% for v in kubeconfig_vaults %}
              {% if not (v.source_secret == vault_approle_source_secret and vault_approle_role_id | length > 0) %}
              for i in $(seq 1 60); do
                V=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                  -o jsonpath='{.data.{{ vault_approle_secret_id_key }}}' \
                  --kubeconfig {{ kubeconfig }} 2>/dev/null)
                [ -n "$V" ] && break
                sleep 5
              done
              if [ -z "$V" ]; then
                echo "{{ tekton_ci_namespace }}/{{ v.source_secret }} never carried {{ vault_approle_secret_id_key }}" >&2
                exit 1
              fi
              {% endif %}
              {% endfor %}
              exit 0
            # Nicht mehr an vault_approle_role_id gekoppelt: der Override gilt nur
            # fuer den primaeren Vault, die uebrigen Eintraege aus kubeconfig_vaults
            # muessen trotzdem abgeleitet werden. Der Skip passiert jetzt pro
            # Eintrag im Shell-Body.
            when: vault_kubeconfigs_enabled | bool

          - name: Derive the vault-approle Secret from the sops-git vault Secret
            ansible.builtin.shell: |
              set -euo pipefail
              {% for v in kubeconfig_vaults %}
              {% if not (v.source_secret == vault_approle_source_secret and vault_approle_role_id | length > 0) %}
              SECRET_ID=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                -o jsonpath='{.data.{{ vault_approle_secret_id_key }}}' --kubeconfig {{ kubeconfig }} | base64 -d)
              test -n "$SECRET_ID"
              kubectl -n crossplane-system create secret generic {{ v.approle_secret }} \
                --from-literal=secret-id="$SECRET_ID" \
                --dry-run=client -o yaml --kubeconfig {{ kubeconfig }} \
                | kubectl apply --kubeconfig {{ kubeconfig }} -f -
              {% endif %}
              {% endfor %}
            # Nicht mehr an vault_approle_role_id gekoppelt: der Override gilt nur
            # fuer den primaeren Vault, die uebrigen Eintraege aus kubeconfig_vaults
            # muessen trotzdem abgeleitet werden. Der Skip passiert jetzt pro
            # Eintrag im Shell-Body.
            when: vault_kubeconfigs_enabled | bool
            no_log: true    # never echo the AppRole secret-id

          - name: Deploy provider-kubeconfig-vault
            ansible.builtin.shell: |
              set -euo pipefail
              SETS=()
              {% for v in kubeconfig_vaults %}
              ROLE_ID='{% if v.source_secret == vault_approle_source_secret %}{{ vault_approle_role_id }}{% endif %}'
              if [ -z "$ROLE_ID" ]; then
                ROLE_ID=$(kubectl -n {{ tekton_ci_namespace }} get secret {{ v.source_secret }} \
                  -o jsonpath='{.data.{{ vault_approle_role_id_key }}}' --kubeconfig {{ kubeconfig }} | base64 -d)
              fi
              test -n "$ROLE_ID"
              SETS+=(--set "roleIds.{{ v.provider_config }}=$ROLE_ID")
              {% endfor %}
              # roleIds ist eine MAP, keine Liste — genau deswegen. Ein
              # --set additionalVaults[N].appRole.roleId wuerde den ganzen
              # Listeneintrag ersetzen statt ihn zu ergaenzen; siehe den Kopf von
              # templates/clusterproviderconfig.yaml im Chart.
              helm upgrade --install provider-kubeconfig-vault \
                {{ stuttgart_things_checkout }}/crossplane/platform/baseline/provider-kubeconfig-vault \
                "${SETS[@]}" \
                -n crossplane-system --create-namespace \
                --kubeconfig {{ kubeconfig }}
            when: vault_kubeconfigs_enabled | bool
            no_log: true    # never echo the AppRole role ID

          # See the profile play for the full note. Without this the chart is
          # inert: the provider never gets VAULT_CACERT and every RemoteCluster
          # dies on `x509: certificate signed by unknown authority`, which looks
          # like a credential problem and is not one.
          - name: Point the kubeconfig provider at its DeploymentRuntimeConfig
            ansible.builtin.shell: |
              set -euo pipefail
              kubectl patch provider.pkg.crossplane.io {{ kubeconfig_provider_name }} --type=merge \
                -p '{"spec":{"runtimeConfigRef":{"apiVersion":"pkg.crossplane.io/v1beta1","kind":"DeploymentRuntimeConfig","name":"{{ kubeconfig_provider_runtime_config }}"}}}' \
                --kubeconfig {{ kubeconfig }}
              kubectl wait provider.pkg.crossplane.io/{{ kubeconfig_provider_name }} \
                --for=condition=Healthy --timeout=300s --kubeconfig {{ kubeconfig }}
            when: vault_kubeconfigs_enabled | bool

          # Installing ~24 Configuration packages registers a large number of CRDs.
          # Each burst forces the apiserver to rebuild discovery and OpenAPI, etcd
          # applies queue behind it, and kube-controller-manager / kube-scheduler miss
          # their lease deadline and exit. That is self-healing, but the play used to
          # finish mid-storm and report failed=0 while the control plane was still
          # flapping -- which reads as "machinery ready" and is not.
          #
          # Gate on a QUIET PERIOD, never a single sample: a lone check lands in the
          # gap between two crashes and looks healthy. Require three consecutive
          # samples with no pod outside Running/Completed AND no new control-plane
          # restart.
          - name: Wait for the cluster to settle
            ansible.builtin.shell: |
              set -uo pipefail
              stable=0
              prev=""
              for i in $(seq 1 {{ settle_max_samples | default(60) }}); do
                busy=$(kubectl get pods -A --no-headers --kubeconfig {{ kubeconfig }} 2>/dev/null \
                       | awk '$4 != "Running" && $4 != "Completed"' | wc -l)
                now=$(kubectl -n kube-system get pod -l tier=control-plane \
                        -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount},{end}' \
                        --kubeconfig {{ kubeconfig }} 2>/dev/null)
                if [ "$busy" -eq 0 ] && [ -n "$now" ] && [ "$now" = "$prev" ]; then
                  stable=$((stable + 1))
                  [ "$stable" -ge 3 ] && exit 0
                else
                  stable=0
                fi
                prev="$now"
                sleep {{ settle_interval | default(10) }}
              done
              echo "cluster did not settle: still restarting or with unhealthy pods" >&2
              kubectl get pods -A --no-headers --kubeconfig {{ kubeconfig }} \
                | awk '$4 != "Running" && $4 != "Completed"' >&2
              exit 1
            changed_when: false
            # Set settle_enabled=false to finish without the gate -- the play then
            # reports success on a cluster that may still be settling.
            when: settle_enabled | default(true) | bool


          - name: Show machinery readiness
            ansible.builtin.command: >
              kubectl get provider.pkg.crossplane.io,configuration.pkg.crossplane.io,environmentconfig
              --kubeconfig {{ kubeconfig }}
            changed_when: false
            register: readiness

          - name: Machinery status
            ansible.builtin.debug:
              var: readiness.stdout_lines
