---
# stuttgart-things/ansible#1218, #1248 — homerun2-led-catcher on a Raspberry Pi
# driving a HUB75 LED matrix: boot config, audio blacklist, venv with the
# matrix library, systemd unit, /healthz check. Plays on the Pi itself, no
# container runtime involved; it lives here because the catcher is part of the
# homerun2 stack that provision_edge / send_events_homerun already serve.
playbooks:
  - name: homerun2_led_catcher_pi
    play: | # pragma: allowlist secret -- variable names (led_api_token, led_redis_password, led_tls_vault_token), no values
      ---
      # =============================================================================
      # homerun2-led-catcher on a Raspberry Pi
      # -----------------------------------------------------------------------------
      # Base install of https://github.com/stuttgart-things/homerun2-led-catcher on a
      # Pi driving a 64x64 HUB75 matrix, from a fresh Raspberry Pi OS Lite (64-bit)
      # image (Trixie or Bookworm) to a running systemd service.
      #
      #   1. boot config: onboard audio off, one core reserved for the matrix
      #   2. audio driver blacklisted (it shares the PWM hardware with the matrix)
      #   3. reboot, only when 1. or 2. changed something
      #   4. build packages, home directory the matrix process can still enter
      #   5. catcher checkout + venv, rpi-rgb-led-matrix built into that venv
      #   6. /etc/default/led-catcher (API token, Redis password) and the unit
      #   7. service enabled, started, and checked through /healthz
      #
      # Every step is idempotent: a second run changes nothing, the matrix library
      # is only rebuilt when its checkout moves, and the Pi only reboots when the
      # boot config or the blacklist changed.
      #
      # Why it looks the way it does: docs/raspberry-pi-deployment.md in the
      # led-catcher repo. In short: the blacklist line needs the word "blacklist";
      # the matrix library compiles against Debian's Pillow header, so the venv must
      # run Debian's Pillow (--system-site-packages); after init the library drops
      # root and runs as "daemon", which cannot enter a 0700 home.
      #
      # Usage:
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_api_token=change-me
      #
      #   # with Redis instead of standalone
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_mode=full -e led_redis_addr=redis.example.com \
      #     -e led_api_token=change-me -e led_redis_password=secret
      #
      #   # with a profile of your own, and buttons to switch the panel onto a
      #   # scoreboard stream (POST /streams) and back
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_mode=full -e led_redis_addr=redis.example.com \
      #     -e led_profile_src=$PWD/profile.yaml -e led_ui_stream_presets=messages,tabletennis
      #
      #   # under /matrix behind homerun2-portal (homerun2-led-catcher v0.19.0 and
      #   # later for the portal's card): every route carries the prefix,
      #   # /healthz and /health stay at the root, / redirects to /matrix/
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_api_token=change-me -e led_catcher_version=v0.20.0 -e led_base_path=/matrix
      #
      #   # behind https://matrix.sthings.lab, with a certificate from the OpenBao PKI
      #   # (VAULT_TOKEN on the controller), and the clock between displays
      #   VAULT_TOKEN=... ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_api_token=change-me -e led_tls_hostname=matrix.sthings.lab \
      #     -e led_tls_ip_sans=192.168.10.120 -e led_idle=clock
      #
      #   # another release, PWM mod soldered, no automatic reboot
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_catcher_version=v0.11.0 -e led_hardware_mapping=adafruit-hat-pwm \
      #     -e led_allow_reboot=false
      #
      # inventory.ini:
      #   [ledpi]
      #   192.168.10.120 ansible_user=sthings
      #
      # Tags: boot, packages, install, service, tls, verify
      # =============================================================================

      - name: Install homerun2-led-catcher on a Raspberry Pi
        hosts: "{{ target_host | default('all') }}"
        become: true
        gather_facts: true

        vars:
          # --- What to install ---
          led_catcher_repo: https://github.com/stuttgart-things/homerun2-led-catcher.git
          led_catcher_version: v0.10.0          # tag, branch or commit
          rgbmatrix_repo: https://github.com/hzeller/rpi-rgb-led-matrix.git
          # a commit, not master: every new upstream commit changed the checkout
          # and rebuilt the library on the Pi (~8 min on a 3B+). No tags upstream.
          rgbmatrix_version: 14464b3ad8974665f75a3c82355cf872311fec21   # master, 2026-10-10

          # --- Who runs it (defaults to the SSH user) ---
          led_user: "{{ ansible_user | default(ansible_facts['env'].SUDO_USER | default('')) }}"

          # --- Service ---
          led_mode: standalone                  # standalone, led, full, web
          led_api_token: ""                     # required in standalone mode
          led_health_port: 8080
          led_log_format: text
          led_log_level: info
          led_base_path: ""                     # e.g. /matrix behind homerun2-portal (v0.18.0 and later); empty serves at the root

          # --- Panel ---
          led_hardware_mapping: adafruit-hat    # adafruit-hat-pwm if the PWM bridge is soldered
          led_gpio_slowdown: 2
          led_brightness: 100

          # --- Idle screen (homerun2-led-catcher v0.12.0 and later) ---
          led_idle: ""                          # clock; empty leaves LED_IDLE unset, the panel dark between displays
          led_idle_color: ""                    # a profile colour name or r,g,b; empty: the catcher's default (info)

          # --- Display queue (homerun2-led-catcher#142 and later) ---
          led_display_queue: ""                 # e.g. 3: finite displays wait FIFO, up to N; empty leaves DISPLAY_QUEUE unset (1: the newest waiting one wins)

          # --- TLS (optional): a hostname, a PKI certificate, Caddy on 443 ---
          led_tls_hostname: ""                  # e.g. matrix.sthings.lab; empty: no certificate, no Caddy
          led_tls_ip_sans: []                   # e.g. [192.168.10.120] or "192.168.10.120", so https://<ip> is valid too
          # a list, or a comma-separated string (-e key=value cannot pass a list)
          led_tls_ips: "{{ (led_tls_ip_sans.split(',') if led_tls_ip_sans is string else led_tls_ip_sans) | map('trim') | select | list }}"
          led_tls_vault_addr: https://openbao.platform.sthings.lab
          led_tls_vault_pki_path: pki
          led_tls_vault_role: sthings-lab       # allows subdomains of sthings.lab, up to a year
          led_tls_vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"   # read on the controller
          led_tls_ttl: 2160h                    # 90 days
          led_tls_renew_days: 30                # re-issue when fewer days are left
          led_tls_ca_name: sthings-lab          # file name of the PKI's CA in the Pi's trust store

          # --- Redis (led, full, web) ---
          led_redis_addr: ""
          led_redis_port: 6379
          led_redis_stream: messages
          led_redis_password: ""
          # One Pi, several LANs -- e.g. a panel that travels with an edge box between two networks.
          # Per LAN: the default gateway that identifies it, the Redis to consume from there, and
          # optionally a Wi-Fi to join. At every start the catcher waits for a default route, picks
          # the LAN by gateway and takes its Redis; a NetworkManager hook restarts it when the LAN
          # changes. No match: led_redis_* as before. Empty list: unchanged behaviour.
          #   - name: sthings              # [a-z0-9-]
          #     gateway: 192.168.10.1
          #     redis_addr: 192.168.10.179
          #     redis_port: 6379           # optional, default led_redis_port
          #     redis_password: secret
          #     wifi_ssid: sthings         # optional: a NetworkManager connection led-<name>
          #     wifi_psk: secret
          #     wifi_priority: 10          # optional: preferred over lower ones when both are in range
          led_networks: []
          led_network_wait_seconds: 30     # max. wait for a default route before picking the LAN
          led_consumer_group: homerun2-led-catcher
          led_ui_stream_presets: ""             # e.g. messages,tabletennis: the simulator's stream buttons; empty: only led_redis_stream
          led_profile_src: ""                   # a profile.yaml on the controller, installed and kept in sync; empty: the repo's tests/profile.yaml, once

          # --- Boot ---
          led_isolate_cpu: true                 # isolcpus=3 on boards with 4+ cores
          led_allow_reboot: true

          led_packages:
            - acl                               # lets become_user drop to the login user
            - git
            - make
            - g++
            - cmake
            - python3-dev
            - python3-venv
            - python3-pil                       # Imaging.h for the matrix library build

        pre_tasks:
          - name: Check the inputs
            ansible.builtin.assert:
              that:
                - led_mode in ['standalone', 'led', 'full', 'web']
                - led_mode != 'standalone' or led_api_token | length > 0
                - led_mode == 'standalone' or led_redis_addr | length > 0
                - led_user | length > 0 and led_user != 'root'
              fail_msg: >-
                standalone needs led_api_token (nothing could write to the panel without it),
                led/full/web need led_redis_addr, and led_user must be the non-root login user.
              quiet: true
            tags: always

          - name: Look up the home directory of {{ led_user }}
            ansible.builtin.getent:
              database: passwd
              key: "{{ led_user }}"
            tags: always

          - name: Set paths
            ansible.builtin.set_fact:
              led_home: "{{ ansible_facts.getent_passwd[led_user][4] }}"
              led_dir: "{{ ansible_facts.getent_passwd[led_user][4] }}/homerun2-led-catcher"
              rgbmatrix_dir: "{{ ansible_facts.getent_passwd[led_user][4] }}/lib/rpi-rgb-led-matrix"
            tags: always

          - name: Find the boot partition
            ansible.builtin.stat:
              path: /boot/firmware/config.txt
            register: led_boot_firmware
            tags: always

          - name: Set boot paths (/boot/firmware on Bookworm and later, /boot before)
            ansible.builtin.set_fact:
              led_boot_dir: "{{ '/boot/firmware' if led_boot_firmware.stat.exists else '/boot' }}"
            tags: always

          - name: Check config.txt and cmdline.txt exist
            ansible.builtin.stat:
              path: "{{ led_boot_dir }}/{{ item }}"
            loop: [config.txt, cmdline.txt]
            register: led_boot_files
            tags: always

          - name: Note which boot files are there
            ansible.builtin.set_fact:
              led_has_config_txt: "{{ led_boot_files.results[0].stat.exists }}"
              led_has_cmdline_txt: "{{ led_boot_files.results[1].stat.exists }}"
            tags: always

        tasks:
          # ---------------------------------------------------------------- boot ---
          - name: Onboard audio off in config.txt (replace the image's audio=on)
            ansible.builtin.lineinfile:
              path: "{{ led_boot_dir }}/config.txt"
              regexp: '^dtparam=audio='
              line: dtparam=audio=off
            register: led_boot_audio
            when: led_has_config_txt | bool
            tags: boot

          - name: Read cmdline.txt
            ansible.builtin.slurp:
              src: "{{ led_boot_dir }}/cmdline.txt"
            register: led_cmdline
            when:
              - led_isolate_cpu | bool
              - ansible_facts['processor_nproc'] | int >= 4
              - led_has_cmdline_txt | bool
            tags: boot

          - name: Reserve one core for the matrix (isolcpus=3, cmdline.txt stays one line)
            ansible.builtin.copy:
              dest: "{{ led_boot_dir }}/cmdline.txt"
              content: "{{ (led_cmdline.content | b64decode | trim) ~ ' isolcpus=3' }}\n"
              mode: preserve
            register: led_boot_isolcpus
            when:
              - led_cmdline is not skipped
              - "'isolcpus=' not in (led_cmdline.content | b64decode)"
            tags: boot

          - name: Blacklist the onboard audio driver
            ansible.builtin.copy:
              dest: /etc/modprobe.d/blacklist-rgb-matrix.conf
              # "blacklist" is required: a bare module name is ignored by modprobe.d
              content: "blacklist snd_bcm2835\n"
              mode: "0644"
            register: led_blacklist
            tags: boot

          # A task, not a handler: it has to run before the reboot below, and
          # handlers only run at the end of the play.
          - name: Rebuild the initramfs  # noqa: no-handler
            ansible.builtin.command: update-initramfs -u
            when: led_blacklist is changed
            changed_when: true
            tags: boot

          - name: Reboot, so the boot config and the blacklist take effect
            ansible.builtin.reboot:
              reboot_timeout: 600
            when:
              - led_allow_reboot | bool
              - led_boot_audio is changed or led_boot_isolcpus is changed or led_blacklist is changed
            tags: boot

          - name: Check the audio driver is gone
            ansible.builtin.command: lsmod
            register: led_lsmod
            changed_when: false
            tags: [boot, verify]

          - name: Warn if the audio driver is still loaded
            ansible.builtin.debug:
              msg: >-
                snd_bcm2835 is still loaded: rpi-rgb-led-matrix refuses to start with it.
                Reboot the Pi (led_allow_reboot was false, or the reboot did not happen).
            when: "'snd_bcm2835' in led_lsmod.stdout"
            tags: [boot, verify]

          # ------------------------------------------------------------ packages ---
          - name: Install build packages
            ansible.builtin.apt:
              name: "{{ led_packages }}"
              state: present
              update_cache: true
              cache_valid_time: 3600
            tags: packages

          - name: Let "daemon" (the matrix process after init) enter the home directory
            ansible.builtin.file:
              path: "{{ led_home }}"
              mode: "0711"
            tags: packages

          # ------------------------------------------------------------- install ---
          - name: Check out homerun2-led-catcher {{ led_catcher_version }}
            ansible.builtin.git:
              repo: "{{ led_catcher_repo }}"
              dest: "{{ led_dir }}"
              version: "{{ led_catcher_version }}"
              force: false
            become: true
            become_user: "{{ led_user }}"
            register: led_catcher_checkout
            notify: Restart led-catcher
            tags: install

          - name: Check out rpi-rgb-led-matrix {{ rgbmatrix_version }}
            ansible.builtin.git:
              repo: "{{ rgbmatrix_repo }}"
              dest: "{{ rgbmatrix_dir }}"
              version: "{{ rgbmatrix_version }}"
              depth: 1
            become: true
            become_user: "{{ led_user }}"
            register: led_rgbmatrix_checkout
            tags: install

          - name: Create the venv (with Debian's Pillow, which the matrix library is built against)
            ansible.builtin.command:
              cmd: python3 -m venv --system-site-packages {{ led_dir }}/.venv
              creates: "{{ led_dir }}/.venv/bin/python"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv
            tags: install

          - name: Check what the venv already has
            ansible.builtin.command:
              cmd: >-
                {{ led_dir }}/.venv/bin/python -c
                "import importlib.util as u; print(bool(u.find_spec('rgbmatrix')), bool(u.find_spec('led_catcher')))"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv_state
            changed_when: false
            tags: install

          - name: Build rpi-rgb-led-matrix into the venv (takes a few minutes)
            ansible.builtin.command:
              cmd: "{{ led_dir }}/.venv/bin/pip install {{ rgbmatrix_dir }}"
            become: true
            become_user: "{{ led_user }}"
            when: led_rgbmatrix_checkout is changed or led_venv_state.stdout.split()[0] == 'False'
            changed_when: true
            notify: Restart led-catcher
            tags: install

          - name: Install homerun2-led-catcher into the venv
            ansible.builtin.command:
              cmd: "{{ led_dir }}/.venv/bin/pip install -e {{ led_dir }}"
            become: true
            become_user: "{{ led_user }}"
            when: led_catcher_checkout is changed or led_venv_state.stdout.split()[1] == 'False'
            changed_when: true
            notify: Restart led-catcher
            tags: install

          - name: Check the venv runs the matrix library and Debian's Pillow
            ansible.builtin.command:
              cmd: >-
                {{ led_dir }}/.venv/bin/python -c
                "from led_catcher.display.matrix import HAS_RGBMATRIX; import PIL;
                print(HAS_RGBMATRIX, PIL.__version__, PIL.__file__)"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv_check
            changed_when: false
            tags: [install, verify]

          - name: Assert the hardware path is active and Pillow matches the build header
            ansible.builtin.assert:
              that:
                - led_venv_check.stdout.split()[0] == 'True'
                - led_venv_check.stdout.split()[2].startswith('/usr/lib/python3/dist-packages/')
              fail_msg: >-
                {{ led_venv_check.stdout }} — expected HAS_RGBMATRIX True and Pillow from
                /usr/lib/python3/dist-packages. A Pillow inside the venv breaks image and gif
                displays: remove it with {{ led_dir }}/.venv/bin/pip uninstall pillow.
              success_msg: "{{ led_venv_check.stdout }}"
            tags: [install, verify]

          # Read from the checkout, not from the git task's result: that task is
          # skipped under --tags service, and the unit would lose the commit.
          - name: Read the installed commit (VERSION and COMMIT for /healthz)
            ansible.builtin.command:
              cmd: git -C {{ led_dir }} rev-parse HEAD
            become: true
            become_user: "{{ led_user }}"
            register: led_catcher_commit
            changed_when: false
            tags: [install, service, verify]

          # ------------------------------------------------------------- service ---
          - name: Secrets for the service (API token, Redis password)
            ansible.builtin.copy:
              dest: /etc/default/led-catcher
              content: |
                LED_API_TOKEN={{ led_api_token }}
                {% if led_redis_password | length > 0 %}
                REDIS_PASSWORD={{ led_redis_password }}
                {% endif %}
              owner: root
              group: root
              mode: "0600"
            no_log: true
            notify: Restart led-catcher
            tags: service

          # ---- several LANs (led_networks) -----------------------------------------
          - name: Settings per LAN directory
            ansible.builtin.file:
              path: /etc/led-catcher
              state: directory
              owner: root
              group: root
              mode: "0700"
            when: led_networks | length > 0
            tags: service

          - name: Redis per LAN (/etc/led-catcher/<name>.env)
            ansible.builtin.copy:
              dest: "/etc/led-catcher/{{ item.name }}.env"
              content: |
                REDIS_ADDR={{ item.redis_addr | quote }}
                REDIS_PORT={{ item.redis_port | default(led_redis_port) | quote }}
                {% if (item.redis_password | default('')) | length > 0 %}
                REDIS_PASSWORD={{ item.redis_password | quote }}
                {% endif %}
              owner: root
              group: root
              mode: "0600"
            loop: "{{ led_networks }}"
            loop_control:
              label: "{{ item.name }}"
            no_log: true
            notify: Restart led-catcher
            tags: service

          - name: Find LANs no longer listed
            ansible.builtin.find:
              paths: /etc/led-catcher
              patterns: "*.env"
            register: led_network_envs
            when: led_networks | length > 0
            tags: service

          - name: Remove LANs no longer listed
            ansible.builtin.file:
              path: "{{ item.path }}"
              state: absent
            loop: "{{ led_network_envs.files | default([]) | rejectattr('path', 'in', led_networks | map(attribute='name') | map('regex_replace', '^(.*)$', '/etc/led-catcher/\\1.env') | list) | list }}"
            loop_control:
              label: "{{ item.path }}"
            when: led_networks | length > 0
            notify: Restart led-catcher
            tags: service

          - name: Which LAN (led-catcher-net, by default gateway)
            ansible.builtin.copy:
              dest: /usr/local/bin/led-catcher-net
              mode: "0755"
              content: |
                #!/bin/sh
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                # Prints the LAN this Pi is in, by its default gateway (led_networks); exit 1 if none matches.
                route=$(ip route show default)
                {% for n in led_networks %}
                case "$route" in *"via {{ n.gateway }} "*) echo {{ n.name }}; exit 0 ;; esac
                {% endfor %}
                exit 1
            when: led_networks | length > 0
            notify: Restart led-catcher
            tags: service

          - name: Start wrapper (led-catcher-start, takes the Redis of the LAN)
            ansible.builtin.copy:
              dest: /usr/local/bin/led-catcher-start
              mode: "0755"
              content: |
                #!/bin/sh
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                # At boot the unit may start before DHCP: wait for a default route, then pick the LAN.
                i=0
                while [ -z "$(ip route show default)" ] && [ "$i" -lt {{ led_network_wait_seconds | int }} ]; do
                  sleep 1; i=$((i + 1))
                done
                net=$(/usr/local/bin/led-catcher-net) || net=""
                mkdir -p /run/led-catcher
                echo "$net" > /run/led-catcher/net
                if [ -n "$net" ] && [ -f "/etc/led-catcher/$net.env" ]; then
                  set -a; . "/etc/led-catcher/$net.env"; set +a
                  echo "led-catcher: LAN $net, Redis $REDIS_ADDR:$REDIS_PORT"
                else
                  echo "led-catcher: no known LAN, Redis ${REDIS_ADDR:-none} (led_redis_addr)"
                fi
                exec {{ led_dir }}/.venv/bin/python -m led_catcher
            when: led_networks | length > 0
            notify: Restart led-catcher
            tags: service

          - name: Restart the catcher when the LAN changes (NetworkManager hook)
            ansible.builtin.copy:
              dest: /etc/NetworkManager/dispatcher.d/90-led-catcher
              mode: "0755"
              content: |
                #!/bin/sh
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                # A new LAN (other default gateway) means another Redis: restart led-catcher.
                case "$2" in up|dhcp4-change) ;; *) exit 0 ;; esac
                now=$(/usr/local/bin/led-catcher-net) || exit 0
                [ "$now" = "$(cat /run/led-catcher/net 2>/dev/null)" ] && exit 0
                # one restart per move: NetworkManager reports up and dhcp4-change for it
                echo "$now" > /run/led-catcher/net
                logger -t led-catcher "LAN changed to $now, restarting"
                systemctl restart led-catcher
            when: led_networks | length > 0
            tags: service

          - name: Remove the LAN helpers (led_networks empty)
            ansible.builtin.file:
              path: "{{ item }}"
              state: absent
            loop:
              - /usr/local/bin/led-catcher-net
              - /usr/local/bin/led-catcher-start
              - /etc/NetworkManager/dispatcher.d/90-led-catcher
              - /etc/led-catcher
            when: led_networks | length == 0
            notify: Restart led-catcher
            tags: service

          - name: Wi-Fi per LAN (NetworkManager connection led-<name>)
            ansible.builtin.shell: |
              set -eu
              con="led-$NAME"
              if ! nmcli -t -f NAME con show | grep -qx "$con"; then
                nmcli con add type wifi ifname wlan0 con-name "$con" ssid "$SSID" \
                  wifi-sec.key-mgmt wpa-psk wifi-sec.psk "$PSK" connection.autoconnect yes \
                  connection.autoconnect-priority "$PRIO" >/dev/null
                echo changed
              elif [ "$(nmcli -g 802-11-wireless.ssid con show "$con")" != "$SSID" ] || \
                   [ "$(nmcli -s -g 802-11-wireless-security.psk con show "$con")" != "$PSK" ] || \
                   [ "$(nmcli -g connection.autoconnect-priority con show "$con")" != "$PRIO" ]; then
                nmcli con modify "$con" 802-11-wireless.ssid "$SSID" wifi-sec.key-mgmt wpa-psk \
                  wifi-sec.psk "$PSK" connection.autoconnect-priority "$PRIO"
                echo changed
              fi
            environment:
              NAME: "{{ item.name }}"
              SSID: "{{ item.wifi_ssid }}"
              PSK: "{{ item.wifi_psk | default('') }}"
              PRIO: "{{ item.wifi_priority | default(0) | int }}"
            register: led_wifi
            changed_when: "'changed' in led_wifi.stdout"
            loop: "{{ led_networks | selectattr('wifi_ssid', 'defined') | list }}"
            loop_control:
              label: "{{ item.name }}: {{ item.wifi_ssid }}"
            no_log: true
            tags: service

          - name: Systemd unit
            ansible.builtin.copy:
              dest: /etc/systemd/system/led-catcher.service
              mode: "0644"
              content: |
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                [Unit]
                Description=homerun2-led-catcher
                Documentation=https://github.com/stuttgart-things/homerun2-led-catcher
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=simple
                # root is needed for GPIO; the matrix library drops to "daemon" after init
                User=root
                WorkingDirectory={{ led_dir }}
                Environment=LED_MODE={{ led_mode }}
                Environment=LED_HARDWARE_MAPPING={{ led_hardware_mapping }}
                Environment=LED_GPIO_SLOWDOWN={{ led_gpio_slowdown }}
                Environment=LED_BRIGHTNESS={{ led_brightness }}
                Environment=HEALTH_PORT={{ led_health_port }}
                Environment=LOG_FORMAT={{ led_log_format }}
                Environment=LOG_LEVEL={{ led_log_level }}
                # shown by /healthz and the simulator footer
                Environment=VERSION={{ led_catcher_version }}
                Environment=COMMIT={{ led_catcher_commit.stdout }}
                {% if led_base_path | length > 0 %}
                # the URL prefix behind a reverse proxy; /healthz stays at the root
                Environment=BASE_PATH={{ led_base_path }}
                {% endif %}
                {% if led_idle | length > 0 %}
                # what the panel shows between displays
                Environment=LED_IDLE={{ led_idle }}
                {% endif %}
                {% if led_idle_color | length > 0 %}
                Environment=LED_IDLE_COLOR={{ led_idle_color }}
                {% endif %}
                {% if led_display_queue | string | length > 0 %}
                # how many finite displays may wait for the panel (default 1)
                Environment=DISPLAY_QUEUE={{ led_display_queue }}
                {% endif %}
                {% if led_mode != 'standalone' %}
                Environment=REDIS_ADDR={{ led_redis_addr }}
                Environment=REDIS_PORT={{ led_redis_port }}
                Environment=REDIS_STREAM={{ led_redis_stream }}
                Environment=CONSUMER_GROUP={{ led_consumer_group }}
                Environment=PROFILE_PATH={{ led_dir }}/profile.yaml
                {% if led_ui_stream_presets | length > 0 %}
                # the simulator's stream switch: comma-separated presets, streams in one joined by |
                Environment=UI_STREAM_PRESETS={{ led_ui_stream_presets }}
                {% endif %}
                {% endif %}
                # LED_API_TOKEN and REDIS_PASSWORD
                EnvironmentFile=/etc/default/led-catcher
                {% if led_networks | length > 0 %}
                # picks the Redis of the LAN (led_networks), then execs the catcher
                ExecStart=/usr/local/bin/led-catcher-start
                {% else %}
                ExecStart={{ led_dir }}/.venv/bin/python -m led_catcher
                {% endif %}
                Restart=always
                RestartSec=5
                KillSignal=SIGTERM
                TimeoutStopSec=20

                [Install]
                WantedBy=multi-user.target
            notify: Restart led-catcher
            tags: service

          - name: A profile for modes that match messages (kept if it already exists)
            ansible.builtin.copy:
              src: "{{ led_dir }}/tests/profile.yaml"
              dest: "{{ led_dir }}/profile.yaml"
              remote_src: true
              force: false
              owner: "{{ led_user }}"
              group: "{{ led_user }}"
              mode: "0644"
            when: led_mode != 'standalone' and led_profile_src | length == 0
            notify: Restart led-catcher
            tags: service

          # The catcher reads the profile at startup only, hence the restart.
          # Overwrites on every run: the file on the controller is the truth.
          - name: The profile from the controller (led_profile_src)
            ansible.builtin.copy:
              src: "{{ led_profile_src }}"
              dest: "{{ led_dir }}/profile.yaml"
              owner: "{{ led_user }}"
              group: "{{ led_user }}"
              mode: "0644"
            when: led_mode != 'standalone' and led_profile_src | length > 0
            notify: Restart led-catcher
            tags: service

          # Before the start task: on a first install the restart handler does the
          # one and only start (restarted also starts a stopped unit), instead of
          # killing the service the start task had just brought up.
          - name: Apply pending restarts (starts the service on a first install)
            ansible.builtin.meta: flush_handlers
            tags: always

          - name: Enable and start led-catcher
            ansible.builtin.systemd_service:
              name: led-catcher
              enabled: true
              state: started
              daemon_reload: true
            tags: service

          # -------------------------------------------------------------- verify ---
          - name: Wait for /healthz
            ansible.builtin.uri:
              url: "http://127.0.0.1:{{ led_health_port }}/healthz"
              return_content: true
            register: led_health
            until: led_health.status == 200
            retries: 30
            delay: 2
            tags: verify

          # ----------------------------------------------------------------- tls ---
          # Only with led_tls_hostname. The certificate comes from the PKI's API with
          # the controller's token, which only ever travels as a no_log task
          # argument: the Pi keeps a certificate, never a credential. It is only
          # re-issued when it is missing, about to expire or for another name, so a
          # second run changes nothing. Caddy terminates TLS on 443 (80 redirects)
          # and proxies to the catcher; the catcher itself stays on plain HTTP.
          - name: Install Caddy
            ansible.builtin.apt:
              name: caddy
              state: present
            when: led_tls_hostname | length > 0
            tags: tls

          # First contact with the PKI: this download is what establishes trust,
          # so it cannot verify the server yet. Later runs keep the file.
          - name: Trust the PKI's CA on the Pi
            ansible.builtin.get_url:
              url: "{{ led_tls_vault_addr }}/v1/{{ led_tls_vault_pki_path }}/ca/pem"
              dest: "/usr/local/share/ca-certificates/{{ led_tls_ca_name }}.crt"
              mode: "0644"
              validate_certs: false
            register: led_tls_ca
            when: led_tls_hostname | length > 0
            tags: tls

          - name: Update the trust store
            ansible.builtin.command: update-ca-certificates
            when: led_tls_ca is changed
            changed_when: true
            tags: tls

          - name: Directory for the certificate
            ansible.builtin.file:
              path: /etc/caddy/tls
              state: directory
              owner: root
              group: caddy
              mode: "0750"
            when: led_tls_hostname | length > 0
            tags: tls

          - name: Check the certificate (there, for this name, valid long enough)
            ansible.builtin.shell: |
              cert=/etc/caddy/tls/{{ led_tls_hostname }}.crt
              test -s "$cert" || { echo missing; exit 0; }
              openssl x509 -in "$cert" -noout -checkend {{ (led_tls_renew_days | int) * 86400 }} >/dev/null || { echo expiring; exit 0; }
              openssl x509 -in "$cert" -noout -ext subjectAltName | grep -qF "DNS:{{ led_tls_hostname }}" || { echo other-name; exit 0; }
              echo ok
            register: led_tls_current
            changed_when: false
            when: led_tls_hostname | length > 0
            tags: tls

          - name: A token for the PKI
            ansible.builtin.assert:
              that: led_tls_vault_token | length > 0
              fail_msg: >-
                The certificate for {{ led_tls_hostname }} is {{ led_tls_current.stdout }} and has to be
                issued: export VAULT_TOKEN on the controller (the pki-issue policy is enough).
              quiet: true
            when: led_tls_current.stdout | default('ok') != 'ok'
            tags: tls

          - name: Issue a certificate for {{ led_tls_hostname }}
            ansible.builtin.uri:
              url: "{{ led_tls_vault_addr }}/v1/{{ led_tls_vault_pki_path }}/issue/{{ led_tls_vault_role }}"
              method: POST
              headers:
                X-Vault-Token: "{{ led_tls_vault_token }}"
              body_format: json
              body:
                common_name: "{{ led_tls_hostname }}"
                ip_sans: "{{ led_tls_ips | join(',') }}"
                ttl: "{{ led_tls_ttl }}"
              return_content: true
            register: led_tls_issued
            no_log: true
            when: led_tls_current.stdout | default('ok') != 'ok'
            tags: tls

          - name: Install the certificate, with the CA that issued it
            ansible.builtin.copy:
              dest: "/etc/caddy/tls/{{ led_tls_hostname }}.crt"
              content: "{{ led_tls_issued.json.data.certificate }}\n{{ led_tls_issued.json.data.issuing_ca }}\n"
              owner: root
              group: caddy
              mode: "0644"
            when: led_tls_issued is not skipped
            notify: Reload caddy
            tags: tls

          - name: Install the key
            ansible.builtin.copy:
              dest: "/etc/caddy/tls/{{ led_tls_hostname }}.key"
              content: "{{ led_tls_issued.json.data.private_key }}\n"
              owner: root
              group: caddy
              mode: "0640"
            no_log: true
            when: led_tls_issued is not skipped
            notify: Reload caddy
            tags: tls

          - name: Caddyfile
            ansible.builtin.copy:
              dest: /etc/caddy/Caddyfile
              mode: "0644"
              content: |
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                {{ ([led_tls_hostname] + led_tls_ips) | join(', ') }} {
                	tls /etc/caddy/tls/{{ led_tls_hostname }}.crt /etc/caddy/tls/{{ led_tls_hostname }}.key
                	reverse_proxy 127.0.0.1:{{ led_health_port }} {
                		# the simulator's event stream: pass every event on at once
                		flush_interval -1
                	}
                }
            when: led_tls_hostname | length > 0
            notify: Reload caddy
            tags: tls

          - name: Enable and start Caddy
            ansible.builtin.systemd_service:
              name: caddy
              enabled: true
              state: started
            when: led_tls_hostname | length > 0
            tags: tls

          - name: Apply pending Caddy reloads
            ansible.builtin.meta: flush_handlers
            tags: tls

          # --resolve: the check must not depend on the DNS record for the name.
          - name: Check the catcher over HTTPS
            ansible.builtin.command: >-
              curl -sS --fail -m 5 --resolve {{ led_tls_hostname }}:443:127.0.0.1
              https://{{ led_tls_hostname }}/healthz
            register: led_tls_health
            until: led_tls_health.rc == 0
            retries: 10
            delay: 2
            changed_when: false
            when: led_tls_hostname | length > 0
            tags: [tls, verify]

          - name: Report
            ansible.builtin.debug:
              msg: >-
                {{ ['led-catcher ' ~ led_catcher_version ~ ' (' ~ led_catcher_commit.stdout[:7] ~ ') is running in ' ~ led_mode ~ ' mode',
                    'health: ' ~ (led_health.json | to_json),
                    'simulator and API: http://' ~ led_connect_addr ~ ':' ~ led_health_port ~ led_base_path ~ '/']
                   + (['over TLS: https://' ~ led_tls_hostname ~ ' (certificate ' ~ led_tls_current.stdout ~ ' before this run)']
                      if led_tls_hostname | length > 0 else [])
                   + (['also on the default route: http://' ~ led_default_addr ~ ':' ~ led_health_port]
                      if led_default_addr not in ['', led_connect_addr] else [])
                   + ['logs: journalctl -u led-catcher -f'] }}
            vars:
              # the address the play connected to, which the inventory and docs use
              led_connect_addr: "{{ ansible_host | default(inventory_hostname) }}"
              led_default_addr: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
            tags: verify

        handlers:
          - name: Reload caddy
            ansible.builtin.systemd_service:
              name: caddy
              state: reloaded

          - name: Restart led-catcher
            ansible.builtin.systemd_service:
              name: led-catcher
              state: restarted
              daemon_reload: true
