---
# stuttgart-things/ansible#1218, #1248 — homerun2-led-catcher on a Raspberry Pi
# driving a HUB75 LED matrix: boot config, audio blacklist, venv with the
# matrix library, systemd unit, /healthz check. Plays on the Pi itself, no
# container runtime involved; it lives here because the catcher is part of the
# homerun2 stack that provision_edge / send_events_homerun already serve.
playbooks:
  - name: homerun2_led_catcher_pi
    play: |
      ---
      # =============================================================================
      # homerun2-led-catcher on a Raspberry Pi
      # -----------------------------------------------------------------------------
      # Base install of https://github.com/stuttgart-things/homerun2-led-catcher on a
      # Pi driving a 64x64 HUB75 matrix, from a fresh Raspberry Pi OS Lite (64-bit)
      # image (Trixie or Bookworm) to a running systemd service.
      #
      #   1. boot config: onboard audio off, one core reserved for the matrix
      #   2. audio driver blacklisted (it shares the PWM hardware with the matrix)
      #   3. reboot, only when 1. or 2. changed something
      #   4. build packages, home directory the matrix process can still enter
      #   5. catcher checkout + venv, rpi-rgb-led-matrix built into that venv
      #   6. /etc/default/led-catcher (API token, Redis password) and the unit
      #   7. service enabled, started, and checked through /healthz
      #
      # Every step is idempotent: a second run changes nothing, the matrix library
      # is only rebuilt when its checkout moves, and the Pi only reboots when the
      # boot config or the blacklist changed.
      #
      # Why it looks the way it does: docs/raspberry-pi-deployment.md in the
      # led-catcher repo. In short: the blacklist line needs the word "blacklist";
      # the matrix library compiles against Debian's Pillow header, so the venv must
      # run Debian's Pillow (--system-site-packages); after init the library drops
      # root and runs as "daemon", which cannot enter a 0700 home.
      #
      # Usage:
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_api_token=change-me
      #
      #   # with Redis instead of standalone
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_mode=full -e led_redis_addr=redis.example.com \
      #     -e led_api_token=change-me -e led_redis_password=secret
      #
      #   # another release, PWM mod soldered, no automatic reboot
      #   ansible-playbook -i inventory.ini sthings.container.homerun2_led_catcher_pi \
      #     -e led_catcher_version=v0.11.0 -e led_hardware_mapping=adafruit-hat-pwm \
      #     -e led_allow_reboot=false
      #
      # inventory.ini:
      #   [ledpi]
      #   192.168.10.120 ansible_user=sthings
      #
      # Tags: boot, packages, install, service, verify
      # =============================================================================

      - name: Install homerun2-led-catcher on a Raspberry Pi
        hosts: "{{ target_host | default('all') }}"
        become: true
        gather_facts: true

        vars:
          # --- What to install ---
          led_catcher_repo: https://github.com/stuttgart-things/homerun2-led-catcher.git
          led_catcher_version: v0.10.0          # tag, branch or commit
          rgbmatrix_repo: https://github.com/hzeller/rpi-rgb-led-matrix.git
          rgbmatrix_version: master

          # --- Who runs it (defaults to the SSH user) ---
          led_user: "{{ ansible_user | default(ansible_facts['env'].SUDO_USER | default('')) }}"

          # --- Service ---
          led_mode: standalone                  # standalone, led, full, web
          led_api_token: ""                     # required in standalone mode
          led_health_port: 8080
          led_log_format: text
          led_log_level: info

          # --- Panel ---
          led_hardware_mapping: adafruit-hat    # adafruit-hat-pwm if the PWM bridge is soldered
          led_gpio_slowdown: 2
          led_brightness: 100

          # --- Redis (led, full, web) ---
          led_redis_addr: ""
          led_redis_port: 6379
          led_redis_stream: messages
          led_redis_password: ""
          led_consumer_group: homerun2-led-catcher

          # --- Boot ---
          led_isolate_cpu: true                 # isolcpus=3 on boards with 4+ cores
          led_allow_reboot: true

          led_packages:
            - acl                               # lets become_user drop to the login user
            - git
            - make
            - g++
            - cmake
            - python3-dev
            - python3-venv
            - python3-pil                       # Imaging.h for the matrix library build

        pre_tasks:
          - name: Check the inputs
            ansible.builtin.assert:
              that:
                - led_mode in ['standalone', 'led', 'full', 'web']
                - led_mode != 'standalone' or led_api_token | length > 0
                - led_mode == 'standalone' or led_redis_addr | length > 0
                - led_user | length > 0 and led_user != 'root'
              fail_msg: >-
                standalone needs led_api_token (nothing could write to the panel without it),
                led/full/web need led_redis_addr, and led_user must be the non-root login user.
              quiet: true
            tags: always

          - name: Look up the home directory of {{ led_user }}
            ansible.builtin.getent:
              database: passwd
              key: "{{ led_user }}"
            tags: always

          - name: Set paths
            ansible.builtin.set_fact:
              led_home: "{{ ansible_facts.getent_passwd[led_user][4] }}"
              led_dir: "{{ ansible_facts.getent_passwd[led_user][4] }}/homerun2-led-catcher"
              rgbmatrix_dir: "{{ ansible_facts.getent_passwd[led_user][4] }}/lib/rpi-rgb-led-matrix"
            tags: always

          - name: Find the boot partition
            ansible.builtin.stat:
              path: /boot/firmware/config.txt
            register: led_boot_firmware
            tags: always

          - name: Set boot paths (/boot/firmware on Bookworm and later, /boot before)
            ansible.builtin.set_fact:
              led_boot_dir: "{{ '/boot/firmware' if led_boot_firmware.stat.exists else '/boot' }}"
            tags: always

          - name: Check config.txt and cmdline.txt exist
            ansible.builtin.stat:
              path: "{{ led_boot_dir }}/{{ item }}"
            loop: [config.txt, cmdline.txt]
            register: led_boot_files
            tags: always

          - name: Note which boot files are there
            ansible.builtin.set_fact:
              led_has_config_txt: "{{ led_boot_files.results[0].stat.exists }}"
              led_has_cmdline_txt: "{{ led_boot_files.results[1].stat.exists }}"
            tags: always

        tasks:
          # ---------------------------------------------------------------- boot ---
          - name: Onboard audio off in config.txt (replace the image's audio=on)
            ansible.builtin.lineinfile:
              path: "{{ led_boot_dir }}/config.txt"
              regexp: '^dtparam=audio='
              line: dtparam=audio=off
            register: led_boot_audio
            when: led_has_config_txt | bool
            tags: boot

          - name: Read cmdline.txt
            ansible.builtin.slurp:
              src: "{{ led_boot_dir }}/cmdline.txt"
            register: led_cmdline
            when:
              - led_isolate_cpu | bool
              - ansible_facts['processor_nproc'] | int >= 4
              - led_has_cmdline_txt | bool
            tags: boot

          - name: Reserve one core for the matrix (isolcpus=3, cmdline.txt stays one line)
            ansible.builtin.copy:
              dest: "{{ led_boot_dir }}/cmdline.txt"
              content: "{{ (led_cmdline.content | b64decode | trim) ~ ' isolcpus=3' }}\n"
              mode: preserve
            register: led_boot_isolcpus
            when:
              - led_cmdline is not skipped
              - "'isolcpus=' not in (led_cmdline.content | b64decode)"
            tags: boot

          - name: Blacklist the onboard audio driver
            ansible.builtin.copy:
              dest: /etc/modprobe.d/blacklist-rgb-matrix.conf
              # "blacklist" is required: a bare module name is ignored by modprobe.d
              content: "blacklist snd_bcm2835\n"
              mode: "0644"
            register: led_blacklist
            tags: boot

          # A task, not a handler: it has to run before the reboot below, and
          # handlers only run at the end of the play.
          - name: Rebuild the initramfs  # noqa: no-handler
            ansible.builtin.command: update-initramfs -u
            when: led_blacklist is changed
            changed_when: true
            tags: boot

          - name: Reboot, so the boot config and the blacklist take effect
            ansible.builtin.reboot:
              reboot_timeout: 600
            when:
              - led_allow_reboot | bool
              - led_boot_audio is changed or led_boot_isolcpus is changed or led_blacklist is changed
            tags: boot

          - name: Check the audio driver is gone
            ansible.builtin.command: lsmod
            register: led_lsmod
            changed_when: false
            tags: [boot, verify]

          - name: Warn if the audio driver is still loaded
            ansible.builtin.debug:
              msg: >-
                snd_bcm2835 is still loaded: rpi-rgb-led-matrix refuses to start with it.
                Reboot the Pi (led_allow_reboot was false, or the reboot did not happen).
            when: "'snd_bcm2835' in led_lsmod.stdout"
            tags: [boot, verify]

          # ------------------------------------------------------------ packages ---
          - name: Install build packages
            ansible.builtin.apt:
              name: "{{ led_packages }}"
              state: present
              update_cache: true
              cache_valid_time: 3600
            tags: packages

          - name: Let "daemon" (the matrix process after init) enter the home directory
            ansible.builtin.file:
              path: "{{ led_home }}"
              mode: "0711"
            tags: packages

          # ------------------------------------------------------------- install ---
          - name: Check out homerun2-led-catcher {{ led_catcher_version }}
            ansible.builtin.git:
              repo: "{{ led_catcher_repo }}"
              dest: "{{ led_dir }}"
              version: "{{ led_catcher_version }}"
              force: false
            become: true
            become_user: "{{ led_user }}"
            register: led_catcher_checkout
            notify: Restart led-catcher
            tags: install

          - name: Check out rpi-rgb-led-matrix {{ rgbmatrix_version }}
            ansible.builtin.git:
              repo: "{{ rgbmatrix_repo }}"
              dest: "{{ rgbmatrix_dir }}"
              version: "{{ rgbmatrix_version }}"
              depth: 1
            become: true
            become_user: "{{ led_user }}"
            register: led_rgbmatrix_checkout
            tags: install

          - name: Create the venv (with Debian's Pillow, which the matrix library is built against)
            ansible.builtin.command:
              cmd: python3 -m venv --system-site-packages {{ led_dir }}/.venv
              creates: "{{ led_dir }}/.venv/bin/python"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv
            tags: install

          - name: Check what the venv already has
            ansible.builtin.command:
              cmd: >-
                {{ led_dir }}/.venv/bin/python -c
                "import importlib.util as u; print(bool(u.find_spec('rgbmatrix')), bool(u.find_spec('led_catcher')))"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv_state
            changed_when: false
            tags: install

          - name: Build rpi-rgb-led-matrix into the venv (takes a few minutes)
            ansible.builtin.command:
              cmd: "{{ led_dir }}/.venv/bin/pip install {{ rgbmatrix_dir }}"
            become: true
            become_user: "{{ led_user }}"
            when: led_rgbmatrix_checkout is changed or led_venv_state.stdout.split()[0] == 'False'
            changed_when: true
            notify: Restart led-catcher
            tags: install

          - name: Install homerun2-led-catcher into the venv
            ansible.builtin.command:
              cmd: "{{ led_dir }}/.venv/bin/pip install -e {{ led_dir }}"
            become: true
            become_user: "{{ led_user }}"
            when: led_catcher_checkout is changed or led_venv_state.stdout.split()[1] == 'False'
            changed_when: true
            notify: Restart led-catcher
            tags: install

          - name: Check the venv runs the matrix library and Debian's Pillow
            ansible.builtin.command:
              cmd: >-
                {{ led_dir }}/.venv/bin/python -c
                "from led_catcher.display.matrix import HAS_RGBMATRIX; import PIL;
                print(HAS_RGBMATRIX, PIL.__version__, PIL.__file__)"
            become: true
            become_user: "{{ led_user }}"
            register: led_venv_check
            changed_when: false
            tags: [install, verify]

          - name: Assert the hardware path is active and Pillow matches the build header
            ansible.builtin.assert:
              that:
                - led_venv_check.stdout.split()[0] == 'True'
                - led_venv_check.stdout.split()[2].startswith('/usr/lib/python3/dist-packages/')
              fail_msg: >-
                {{ led_venv_check.stdout }} — expected HAS_RGBMATRIX True and Pillow from
                /usr/lib/python3/dist-packages. A Pillow inside the venv breaks image and gif
                displays: remove it with {{ led_dir }}/.venv/bin/pip uninstall pillow.
              success_msg: "{{ led_venv_check.stdout }}"
            tags: [install, verify]

          # Read from the checkout, not from the git task's result: that task is
          # skipped under --tags service, and the unit would lose the commit.
          - name: Read the installed commit (VERSION and COMMIT for /healthz)
            ansible.builtin.command:
              cmd: git -C {{ led_dir }} rev-parse HEAD
            become: true
            become_user: "{{ led_user }}"
            register: led_catcher_commit
            changed_when: false
            tags: [install, service, verify]

          # ------------------------------------------------------------- service ---
          - name: Secrets for the service (API token, Redis password)
            ansible.builtin.copy:
              dest: /etc/default/led-catcher
              content: |
                LED_API_TOKEN={{ led_api_token }}
                {% if led_redis_password | length > 0 %}
                REDIS_PASSWORD={{ led_redis_password }}
                {% endif %}
              owner: root
              group: root
              mode: "0600"
            no_log: true
            notify: Restart led-catcher
            tags: service

          - name: Systemd unit
            ansible.builtin.copy:
              dest: /etc/systemd/system/led-catcher.service
              mode: "0644"
              content: |
                # Managed by stuttgart-things/ansible sthings.container.homerun2_led_catcher_pi
                [Unit]
                Description=homerun2-led-catcher
                Documentation=https://github.com/stuttgart-things/homerun2-led-catcher
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=simple
                # root is needed for GPIO; the matrix library drops to "daemon" after init
                User=root
                WorkingDirectory={{ led_dir }}
                Environment=LED_MODE={{ led_mode }}
                Environment=LED_HARDWARE_MAPPING={{ led_hardware_mapping }}
                Environment=LED_GPIO_SLOWDOWN={{ led_gpio_slowdown }}
                Environment=LED_BRIGHTNESS={{ led_brightness }}
                Environment=HEALTH_PORT={{ led_health_port }}
                Environment=LOG_FORMAT={{ led_log_format }}
                Environment=LOG_LEVEL={{ led_log_level }}
                # shown by /healthz and the simulator footer
                Environment=VERSION={{ led_catcher_version }}
                Environment=COMMIT={{ led_catcher_commit.stdout }}
                {% if led_mode != 'standalone' %}
                Environment=REDIS_ADDR={{ led_redis_addr }}
                Environment=REDIS_PORT={{ led_redis_port }}
                Environment=REDIS_STREAM={{ led_redis_stream }}
                Environment=CONSUMER_GROUP={{ led_consumer_group }}
                Environment=PROFILE_PATH={{ led_dir }}/profile.yaml
                {% endif %}
                # LED_API_TOKEN and REDIS_PASSWORD
                EnvironmentFile=/etc/default/led-catcher
                ExecStart={{ led_dir }}/.venv/bin/python -m led_catcher
                Restart=always
                RestartSec=5
                KillSignal=SIGTERM
                TimeoutStopSec=20

                [Install]
                WantedBy=multi-user.target
            notify: Restart led-catcher
            tags: service

          - name: A profile for modes that match messages (kept if it already exists)
            ansible.builtin.copy:
              src: "{{ led_dir }}/tests/profile.yaml"
              dest: "{{ led_dir }}/profile.yaml"
              remote_src: true
              force: false
              owner: "{{ led_user }}"
              group: "{{ led_user }}"
              mode: "0644"
            when: led_mode != 'standalone'
            notify: Restart led-catcher
            tags: service

          # Before the start task: on a first install the restart handler does the
          # one and only start (restarted also starts a stopped unit), instead of
          # killing the service the start task had just brought up.
          - name: Apply pending restarts (starts the service on a first install)
            ansible.builtin.meta: flush_handlers
            tags: always

          - name: Enable and start led-catcher
            ansible.builtin.systemd_service:
              name: led-catcher
              enabled: true
              state: started
              daemon_reload: true
            tags: service

          # -------------------------------------------------------------- verify ---
          - name: Wait for /healthz
            ansible.builtin.uri:
              url: "http://127.0.0.1:{{ led_health_port }}/healthz"
              return_content: true
            register: led_health
            until: led_health.status == 200
            retries: 30
            delay: 2
            tags: verify

          - name: Report
            ansible.builtin.debug:
              msg: >-
                {{ ['led-catcher ' ~ led_catcher_version ~ ' (' ~ led_catcher_commit.stdout[:7] ~ ') is running in ' ~ led_mode ~ ' mode',
                    'health: ' ~ (led_health.json | to_json),
                    'simulator and API: http://' ~ led_connect_addr ~ ':' ~ led_health_port]
                   + (['also on the default route: http://' ~ led_default_addr ~ ':' ~ led_health_port]
                      if led_default_addr not in ['', led_connect_addr] else [])
                   + ['logs: journalctl -u led-catcher -f'] }}
            vars:
              # the address the play connected to, which the inventory and docs use
              led_connect_addr: "{{ ansible_host | default(inventory_hostname) }}"
              led_default_addr: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
            tags: verify

        handlers:
          - name: Restart led-catcher
            ansible.builtin.systemd_service:
              name: led-catcher
              state: restarted
              daemon_reload: true
