name: PR Collection Build
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'collections/**'

# LEAST PRIVILEGE BY DEFAULT. INDIVIDUAL JOBS WIDEN THIS WHERE THEY MUST
permissions:
  contents: read

jobs:
  Analyze-Collection-Config:
    # WAS runs-on: ghr-ansible-in-cluster INSIDE THE machineshop CONTAINER, WITH
    # environment: k8s AND A PAT. THIS JOB ONLY CURLS THE FILES API AND RUNS jq
    # AND awk - IT NEVER NEEDED THE IN-CLUSTER RUNNER OR THOSE CREDENTIALS.
    # EXPOSING A SELF-HOSTED RUNNER ON pull_request IS THE RISK FINDING #9
    # DESCRIBES, AND THE SAFEST WAY TO RESTRICT IT IS NOT TO USE IT HERE
    permissions:
      contents: read
      pull-requests: read
    outputs:
      collection_folders: ${{ steps.changed-files.outputs.collection_folders }}
      has_changes: ${{ steps.changed-files.outputs.has_changes }}
      molecule_folders: ${{ steps.changed-files.outputs.molecule_folders }}
      has_molecule: ${{ steps.changed-files.outputs.has_molecule }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Modified Files by PullRequest
        id: changed-files
        env:
          # THE BUILT-IN TOKEN, NOT A PAT. READING THE FILES API OF A PR IN THIS
          # PUBLIC REPO NEEDS NOTHING MORE, AND IT EXPIRES WITH THE JOB
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu

          CHANGED_FILES=$(mktemp)
          PAGE=1

          # THE FILES API PAGES AT 30 BY DEFAULT. A PR TOUCHING MORE THAN THAT
          # WOULD SILENTLY DROP COLLECTIONS, SO WALK EVERY PAGE
          while :; do
            RESPONSE=$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: token $GITHUB_TOKEN" \
              "${{ github.event.pull_request.url }}/files?per_page=100&page=${PAGE}")

            HTTP_CODE=$(printf '%s' "${RESPONSE}" | tail -n1)
            BODY=$(printf '%s' "${RESPONSE}" | sed '$d')

            # FAIL LOUDLY - AN API ERROR MUST NOT LOOK LIKE "NOTHING CHANGED"
            if [ "${HTTP_CODE}" != "200" ]; then
              echo "files api returned HTTP ${HTTP_CODE}"
              echo "${BODY}"
              exit 1
            fi

            BATCH=$(printf '%s' "${BODY}" | jq -r '.[].filename')
            if [ -z "${BATCH}" ]; then
              break
            fi

            printf '%s\n' "${BATCH}" >> "${CHANGED_FILES}"
            PAGE=$((PAGE + 1))
          done

          echo "ALL_CHANGED_FILES:"
          cat "${CHANGED_FILES}"

          # REDUCE TO collections/<name>. dirname MAPPED A NESTED FILE TO A
          # SUBDIRECTORY THAT IS NOT A COLLECTION, AND A FILE DIRECTLY UNDER
          # collections/ TO A BARE "collections" THAT FELL THROUGH AS ""
          ALL_CHANGED_FOLDERS=$(awk -F/ 'NF>=3 && $1=="collections" {print $1"/"$2}' \
            "${CHANGED_FILES}" | sort -u)

          echo "ALL_CHANGED_FOLDERS=${ALL_CHANGED_FOLDERS:-<none>}"

          if [ -z "${ALL_CHANGED_FOLDERS}" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_molecule=false" >> "$GITHUB_OUTPUT"
            echo "collection_folders={\"collection-directory\":[]}" >> "$GITHUB_OUTPUT"
            echo "molecule_folders={\"collection-directory\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SET CHANGED_FOLDERS AS MATRIX JSON
          JSON_FOLDERS=$(printf '%s\n' "${ALL_CHANGED_FOLDERS}" \
            | jq -R . \
            | jq -sc '{"collection-directory": .}')

          echo "${JSON_FOLDERS}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "collection_folders=${JSON_FOLDERS}" >> "$GITHUB_OUTPUT"

          # ONLY THESE SCENARIOS GATE A PR. awx NEEDS A KIND CLUSTER, AN AWX
          # DEPLOY AND VAULT CREDENTIALS, SO IT RUNS NIGHTLY INSTEAD
          # (nightly-molecule-awx.yaml). rke IS SYNTAX-ONLY AND RUNS BELOW
          MOLECULE_FOLDERS=$(printf '%s\n' "${ALL_CHANGED_FOLDERS}" \
            | grep -E '^collections/(baseos|container|rke)$' || true)

          echo "MOLECULE_FOLDERS=${MOLECULE_FOLDERS:-<none>}"

          if [ -z "${MOLECULE_FOLDERS}" ]; then
            echo "has_molecule=false" >> "$GITHUB_OUTPUT"
            echo "molecule_folders={\"collection-directory\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON_MOLECULE=$(printf '%s\n' "${MOLECULE_FOLDERS}" \
            | jq -R . \
            | jq -sc '{"collection-directory": .}')

          echo "${JSON_MOLECULE}"
          echo "has_molecule=true" >> "$GITHUB_OUTPUT"
          echo "molecule_folders=${JSON_MOLECULE}" >> "$GITHUB_OUTPUT"

  Build-Collections:
    needs: Analyze-Collection-Config
    if: ${{ needs.Analyze-Collection-Config.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Analyze-Collection-Config.outputs.collection_folders) }}
    # GITHUB VALIDATES A NESTED JOB'S REQUESTED PERMISSIONS EVEN WHEN THAT JOB
    # IS SKIPPED. Release-Collection NEVER RUNS HERE (publish-release: false),
    # BUT ITS DECLARATION IS STILL CHECKED AGAINST WHAT THIS CALLER GRANTS, SO
    # WITHDRAWING THE SIGNING SCOPES MADE THE WHOLE WORKFLOW FILE INVALID.
    #
    # GRANTING THEM DOES NOT HAND THEM TO THE BUILD: collection-build DECLARES
    # contents: read FOR ITSELF, AND A NESTED JOB ONLY EVER GETS WHAT IT ASKS
    # FOR. THE CAP THAT MATTERS IS THERE, NOT HERE
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ansible-collection.yaml@627fa26ea590c7ace7bf173a3660129367baab66 # main
    with:
      runs-on: ubuntu-latest
      environment-name: k8s
      collection-directory: ${{ matrix.collection-directory }}
      dagger-module-version: v0.121.0
      dagger-version: v0.21.7
      branch-name: ${{ github.event.pull_request.head.ref }}
      # BUILD ONLY - THE ARTIFACT IS UPLOADED FOR REVIEW BUT NOT PUBLISHED.
      # RELEASES ARE CUT BY main-collection-build.yaml ON MERGE TO MAIN
      publish-release: false
    secrets: inherit # pragma: allowlist secret

  Molecule-Test:
    name: Molecule
    needs:
      - Analyze-Collection-Config
      - Build-Collections
    if: ${{ needs.Analyze-Collection-Config.outputs.has_molecule == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Analyze-Collection-Config.outputs.molecule_folders) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Resolve Scenario
        id: scenario
        run: |
          set -eu
          SCENARIO=$(basename "${{ matrix.collection-directory }}")
          echo "SCENARIO: ${SCENARIO}"
          echo "scenario=${SCENARIO}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Molecule
        run: |
          set -eu
          pip install --upgrade pip setuptools
          pip install 'molecule' 'molecule-plugins[docker]' netaddr
          molecule --version
        shell: bash

      - name: Download Built Collection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # THE ARTIFACT IS NAMED sthings-<collection>-<version>.tar.gz AND THE
          # VERSION IS NOT KNOWN HERE, SO MATCH ON THE PREFIX
          pattern: sthings-${{ steps.scenario.outputs.scenario }}-*
          merge-multiple: true
          path: /tmp/collection

      - name: Install Collections
        run: |
          set -eu

          # PUBLISHED PINS FIRST - THEY PROVIDE THE OTHER sthings COLLECTIONS A
          # SCENARIO IMPORTS. molecule/container/converge.yaml, FOR ONE, PULLS IN
          # sthings.baseos.users AS WELL AS sthings.container.tools
          ansible-galaxy collection install -r requirements.yaml

          # THEN THE BUILD UNDER TEST, OVERWRITING ITS PUBLISHED COUNTERPART.
          # WITHOUT THIS THE SUITE TESTS THE LAST RELEASE, NOT THIS PR
          ARTIFACT=$(ls /tmp/collection/*.tar.gz | head -n 1)
          echo "COLLECTION UNDER TEST: ${ARTIFACT}"
          ansible-galaxy collection install --force "${ARTIFACT}"

          ansible-galaxy collection list | grep sthings
        shell: bash

      - name: Molecule Test
        env:
          MOLECULE_DOCKER_COMMAND: /lib/systemd/systemd
        run: molecule test -s ${{ steps.scenario.outputs.scenario }}
        shell: bash

      # INFORMATIONAL. THESE PLAYBOOKS HAVE NEVER BEEN HELD TO IDEMPOTENCE, SO A
      # FAILURE HERE REPORTS RATHER THAN BLOCKS. rke NEVER CONVERGES, SO IT HAS
      # NO INSTANCE TO RE-RUN AGAINST
      - name: Molecule Idempotence (informational)
        if: ${{ steps.scenario.outputs.scenario != 'rke' }}
        continue-on-error: true
        run: molecule idempotence -s ${{ steps.scenario.outputs.scenario }}
        shell: bash

      - name: Molecule Destroy
        if: always()
        continue-on-error: true
        run: molecule destroy -s ${{ steps.scenario.outputs.scenario }}
        shell: bash
