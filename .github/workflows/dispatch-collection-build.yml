---
name: Dispatch Collection Build
on:
  workflow_dispatch:
    inputs:
      collection:
        description: COLLECTION NAME
        type: string
        default: container
      branch-name:
        type: string
        description: BRANCH NAME
        default: main
      publish-release:
        description: PUBLISH A GITHUB RELEASE FOR THE BUILT COLLECTION
        type: boolean
        default: false
      dagger-module-version:
        description: DAGGER MODULE VERSION
        type: string
        default: v0.127.0
      dagger-version:
        description: DAGGER VERSION
        type: string
        default: v0.21.9

# THE MANUAL RE-RELEASE PATH. SINCE RELEASES ONLY HAPPEN ON MERGE TO MAIN,
# THIS IS HOW A COLLECTION IS REBUILT AND REPUBLISHED WITHOUT A CODE CHANGE -
# FOR EXAMPLE AFTER A DAGGER MODULE BUMP CHANGES THE BUILT ARTIFACT
permissions:
  contents: read

jobs:
  Build-Collection:
    # THIS PATH CAN PUBLISH (publish-release IS AN INPUT), SO IT NEEDS THE SAME
    # SIGNING SCOPES AS THE MERGE-TO-MAIN PATH
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ansible-collection.yaml@c039039cefc6e15b42bcc6b98d5b525423e2c36c # main
    with:
      runs-on: ubuntu-latest
      environment-name: k8s
      collection-directory: collections/${{ inputs.collection }}
      dagger-module-version: ${{ inputs.dagger-module-version }}
      dagger-version: ${{ inputs.dagger-version }}
      branch-name: ${{ inputs.branch-name }}
      publish-release: ${{ inputs.publish-release }}
    secrets: inherit # pragma: allowlist secret
