---
- hosts: "{{ target_host | default('all') }}"
  become: true
  gather_facts: true

  vars:
    manage_filesystem: true
    update_packages: true
    install_requirements: true
    install_motd: true
    reboot_all: false
    username: sthings
    lvm_home_sizing: "15%"
    lvm_root_sizing: "35%"
    lvm_var_sizing: "50%"
    send_to_homerun: false

    # HOMERUN
    address: "https://homerun.homerun-dev.sthings-vsphere.labul.sva.de/generic"
    auth_token: "IhrGeheimerToken"
    event_title: "BaseOS Setup executed"
    event_message: "BaseOS Setup executed on {{ ansible_fqdn }}"
    event_severity: "INFO"
    event_author: "{{ ansible_user_id }}"
    event_timestamp: "{{ ansible_date_time.date }}"
    event_system: "ansible"
    event_tags: "ansible,baseos"
    event_assignee_address: "patrick.hermann@sva.de"
    event_assignee_name: "patrick.hermann"
    event_artifacts: "vm: {{ ansible_fqdn }}"
    event_url: unset

    vault_instances:
      - https://vault.tiab.labda.sva.de:8200
      # - https://vault.labul.sva.de:8200
      # - https://vault-vsphere.labul.sva.de:8200
      - https://vault-vsphere.tiab.labda.sva.de:8200

  roles:
    - role: manage-filesystem
      when: manage_filesystem|bool

    - role: install-requirements
      when: install_requirements|bool

  pre_tasks:
    - name: Include vars
      ansible.builtin.include_vars: "{{ path_to_vars_file }}.yaml"
      when: path_to_vars_file is defined

    - ansible.builtin.reboot:
      when: reboot_all|bool

  tasks:
    # vault_instances is an infra-wide list, but any single entry can be
    # sealed, down or behind a broken ingress at any time. Installing the CA
    # straight from the list made ONE such instance fail the whole build. So
    # probe first and only install from the instances that serve the CA.
    - name: Probe vault instances for a reachable PKI CA endpoint
      ansible.builtin.uri:
        url: "{{ vault_instance }}/v1/pki/ca/pem"
        method: GET
        validate_certs: false
        timeout: 10
      loop: "{{ vault_instances }}"
      loop_control:
        loop_var: vault_instance
      register: vault_ca_probe
      failed_when: false
      changed_when: false
      when: vault_instances is defined

    - name: Report unreachable vault instances
      ansible.builtin.debug:
        msg: >-
          Skipping vault CA install from {{ item.vault_instance }} -
          not reachable ({{ item.msg | default('status ' ~ (item.status | default('unknown'))) }})
      loop: "{{ vault_ca_probe.results | default([]) | rejectattr('status', 'defined') | list
                + vault_ca_probe.results | default([]) | selectattr('status', 'defined') | rejectattr('status', 'equalto', 200) | list }}"
      loop_control:
        label: "{{ item.vault_instance }}"

    - name: Install vault ca certificate to local system from multiple instances
      ansible.builtin.include_role:
        name: install_configure_vault
        tasks_from: install-ca-auth
      vars:
        vault_url: "{{ vault_instance }}"
      loop: "{{ vault_ca_probe.results | default([])
                | selectattr('status', 'defined')
                | selectattr('status', 'equalto', 200)
                | map(attribute='vault_instance') | list }}"
      loop_control:
        loop_var: vault_instance

    - name: Send event to homerun if enabled
      block:
        - name: Send event notification to homerun
          ansible.builtin.uri:
            url: "{{ address }}"
            method: POST
            headers:
              Content-Type: "application/json"
              X-Auth-Token: "{{ auth_token }}"
            body: >
              {
                "title": "{{ event_title }}",
                "message": "{{ event_message }}",
                "severity": "{{ event_severity }}",
                "author": "{{ event_author }}",
                "timestamp": "{{ event_timestamp }}",
                "system": "{{ event_system }}",
                "tags": "{{ event_tags }}",
                "assigneeaddress": "{{ event_assignee_address }}",
                "assigneename": "{{ event_assignee_name }}",
                "artifacts": "{{ event_artifacts }}",
                "url": "{{ event_url }}"
              }
            body_format: json
            validate_certs: false
          register: homerun_result_message

        - name: Debug the response from homerun
          debug:
            var: homerun_result_message
      when: send_to_homerun | bool
