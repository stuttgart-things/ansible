---
- name: Create kind cluster
  ansible.builtin.import_playbook: sthings.container.kind
  vars:
    target_host: localhost
    cluster_name: dev
    kind_cluster_name: dev

- name: DIAGNOSTIC kubeconfig ownership and deploy identity (temporary)
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Login user id (no become)
      ansible.builtin.command: id
      changed_when: false
      register: diag_id_login

    - name: Root id (become, default become_user)
      ansible.builtin.command: id
      changed_when: false
      become: true
      register: diag_id_root

    - name: Stat kubeconfig
      ansible.builtin.stat:
        path: /home/sthings/.kube/dev
      become: true
      register: diag_kc

    - name: List /home, /home/sthings, /home/sthings/.kube
      ansible.builtin.command: ls -la /home /home/sthings /home/sthings/.kube
      changed_when: false
      become: true
      register: diag_ls
      ignore_errors: true

    - name: Read kubeconfig as sthings (become sthings)
      ansible.builtin.command: head -c 1 /home/sthings/.kube/dev
      changed_when: false
      become: true
      become_user: sthings
      register: diag_read_sthings
      ignore_errors: true

    - name: Read kubeconfig as login user (no become)
      ansible.builtin.command: head -c 1 /home/sthings/.kube/dev
      changed_when: false
      register: diag_read_login
      ignore_errors: true

    - name: DIAGNOSTIC RESULTS
      ansible.builtin.debug:
        msg:
          - "login_user_id: {{ diag_id_login.stdout }}"
          - "root_id:       {{ diag_id_root.stdout }}"
          - "kubeconfig exists={{ diag_kc.stat.exists }} owner={{ diag_kc.stat.pw_name | default('?') }} group={{ diag_kc.stat.gr_name | default('?') }} mode={{ diag_kc.stat.mode | default('?') }}"
          - "read_as_sthings rc={{ diag_read_sthings.rc | default('n/a') }} err={{ diag_read_sthings.stderr | default('') }}"
          - "read_as_login   rc={{ diag_read_login.rc | default('n/a') }} err={{ diag_read_login.stderr | default('') }}"
          - "ls: {{ diag_ls.stdout_lines | default(['<failed>']) }}"

- name: Deploy AWX
  ansible.builtin.import_playbook: sthings.awx.deploy
  vars:
    target_host: localhost
    cluster_name: dev
    control_plane_ip: "{{ control_plane_ip }}"

- name: Wait for all AWX components to be ready
  ansible.builtin.import_playbook: sthings.awx.check_deployment
  vars:
    target_host: localhost
    cluster_name: dev
    path_to_kubeconfig: /home/sthings/.kube/dev

- name: Add AWX config to molecule host
  hosts: localhost
  become: yes
  tasks:
    - name: Add AWX dev host entry with comment
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - AWX Host Entry"
        block: |
          # AWX dev hostname for local testing
          127.0.1.1 {{ awx_host }}

    - name: Write AWX controller config to file
      copy:
        dest: /tmp/awx-molecule.yaml
        content: | # pragma: allowlist secret
          controller_host: https://{{ awx_host }}
          controller_username: sthings
          controller_password: admin
          vault_approle_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
          vault_approle_secret: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
          vault_url: "{{ lookup('env', 'VAULT_ADDR') }}"
          tower_verify_ssl: false
        mode: '0777'
