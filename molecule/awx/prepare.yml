---
- name: Create kind cluster
  ansible.builtin.import_playbook: sthings.container.kind
  vars:
    target_host: localhost
    cluster_name: dev
    kind_cluster_name: dev

# The kind cluster is created as ansible_user=sthings, so its kubeconfig lands
# at /home/sthings/.kube/dev owned sthings:sthings 0600, inside a 0750 home dir.
# The AWX deploy's kubernetes.core.helm task reads the kubeconfig as the molecule
# login user (runner), which can neither traverse /home/sthings nor read the 0600
# file. Stage a world-readable copy and point the deploy at it.
- name: Stage a deploy-readable copy of the kind kubeconfig
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Copy kubeconfig to a world-readable path
      ansible.builtin.copy:
        src: /home/sthings/.kube/dev
        dest: /tmp/awx-kubeconfig
        remote_src: true
        mode: "0644"

    - name: Point subsequent plays at the readable kubeconfig
      ansible.builtin.set_fact:
        path_to_kubeconfig: /tmp/awx-kubeconfig

# The plain sthings.container.kind cluster is created with the default CNI
# disabled and never installs a replacement (cilium is only wired into the
# kind_xplane_cluster play). Without a CNI every node stays NotReady with a
# node.kubernetes.io/not-ready:NoSchedule taint, so the awx-operator pod is
# Unschedulable. Install cilium (the repo's kind CNI) so the nodes go Ready.
- name: Install cilium CNI on the kind cluster
  ansible.builtin.import_playbook: sthings.container.deploy_to_k8s
  vars:
    ansible_user: sthings
    profile: cilium-kind
    state: present
    target_host: localhost
    cluster_name: dev

# The AWX CR's ingress hostname is awx-dev.<control_plane_ip>.nip.io, so the
# deploy needs a real control_plane_ip. Nothing set it and the import below used
# to pass control_plane_ip: "{{ control_plane_ip }}" (self-referential), which
# tripped "Recursive loop detected in template". Resolve the kind control-plane
# node IP into the control_plane_ip fact first, then let it flow into the deploy.
- name: Resolve the kind control-plane IP
  ansible.builtin.import_playbook: sthings.container.get_controlplane_ip
  vars:
    target_host: localhost
    ansible_user: sthings
    kind_cluster_name: dev

- name: Deploy AWX
  ansible.builtin.import_playbook: sthings.awx.deploy
  vars:
    target_host: localhost
    cluster_name: dev

- name: Wait for all AWX components to be ready
  ansible.builtin.import_playbook: sthings.awx.check_deployment
  vars:
    target_host: localhost
    cluster_name: dev
    path_to_kubeconfig: /home/sthings/.kube/dev

- name: Add AWX config to molecule host
  hosts: localhost
  become: yes
  tasks:
    - name: Add AWX dev host entry with comment
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - AWX Host Entry"
        block: |
          # AWX dev hostname for local testing
          127.0.1.1 {{ awx_host }}

    - name: Write AWX controller config to file
      copy:
        dest: /tmp/awx-molecule.yaml
        content: | # pragma: allowlist secret
          controller_host: https://{{ awx_host }}
          controller_username: sthings
          controller_password: admin
          vault_approle_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
          vault_approle_secret: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
          vault_url: "{{ lookup('env', 'VAULT_ADDR') }}"
          tower_verify_ssl: false
        mode: '0777'
